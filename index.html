function makeReviews(){
  const out=[];
  const L=S.lastMonth; if(!L) return out;
  const rts=S.routes.filter(r=>r.last&&r.last.ok);
  if(!rts.length) return out;
  const push=(stars,txt,r)=>out.push({stars, txt,
    who:`${pick(VORNAMEN)} aus ${pick(ORTE)}`, route:r?`${r.from}–${r.to}`:"", d:`${String(S.month+1).padStart(2,"0")}/${S.year}`});
  const cnt=3+Math.floor(Math.random()*4);
  for(let i=0;i<cnt;i++){
    const r=pick(rts), q=r.last, city=AP[r.to].city;
    const ac=S.fleet.find(a=>a.status==="aktiv");
    const roll=Math.random();
    if(q.wx>0.4 && roll<0.28){
      push(2, `Über eine Stunde Verspätung nach ${city} wegen des Wetters. Die Crew hat gut informiert, geholfen hat es trotzdem wenig.`, r);
    } else if(L.cancel>0.02 && roll<0.4){
      push(1, `Mein Flug nach ${city} fiel kurzfristig aus, angeblich fehlte Personal. Umbuchung erst am Folgetag.`, r);
    } else if(q.lf>0.92 && roll<0.55){
      push(3, `Komplett ausgebucht nach ${city}, kein freier Platz und lange Wartezeit beim Einsteigen. Pünktlich war es immerhin.`, r);
    } else if(svcLevel("biz")===2 && q.detail.biz && q.detail.biz.pax>0 && roll<0.62){
      push(5, `Der Service in der Business nach ${city} war ausgezeichnet — Menüwahl, aufmerksames Personal, alles stimmig.`, r);
    } else if(svcLevel("eco")===0 && roll<0.7){
      push(2, `Nach ${city} gab es nur einen Becher Wasser, und für den Koffer wurde nochmals kassiert. Billig gebucht, billig geflogen.`, r);
    } else if(comfortOf(ac||S.fleet[0]||{type:"a20n"})>1.08 && roll<0.8){
      push(5, `Erstaunlich viel Beinfreiheit auf dem Flug nach ${city}. So macht Fliegen wieder Freude.`, r);
    } else if(S.fleet.length && S.fleet.reduce((a,x)=>a+x.age,0)/S.fleet.length/12>15 && roll<0.86){
      push(3, `Die Maschine nach ${city} hat ihre besten Jahre hinter sich. Sauber war sie, modern nicht.`, r);
    } else if(q.transfer>0.08 && roll<0.92){
      push(4, `Umstieg in ${AP[S.bases[0]].city} hat reibungslos geklappt, Gepäck war durchgecheckt. Weiter so.`, r);
    } else {
      push(4, `Solider Flug nach ${city}, pünktlich und freundlich. Nichts zu beanstanden.`, r);
    }
  }
  return out;
}

function rollUsed(){
  S.usedMarket=[];
  const pool=ACTL.filter(t=>t.price<400);
  for(let i=0;i<3;i++){
    const t=pick(pool);
    const ageY=rnd(8,22), hours=BAL.heavyCheckHrs*rnd(0.6,0.98);
    const disc=rnd(0.35,0.60);
    const price=Math.round(t.price*1e6*(1-disc)*Math.pow(0.965,ageY)/1000)*1000;
    S.usedMarket.push({id:"U"+Date.now().toString(36)+i, type:t.id, ageM:Math.round(ageY*12),
      hours:Math.round(hours), price:Math.max(price, t.price*1e6*0.10),
      seller:pick(["Leasinggesellschaft","Nachlassverwertung","Flottenerneuerung",
        "Rückläufer aus Leasing","Insolvenzverwertung","Betreiberwechsel"])});
  }
}

  const u=(S.usedMarket||[]).find(x=>x.id===id); if(!u) return;

  modal("Heimatbasis wählen",

     <select id="ub">${S.bases.map(b=>`<option value="${b}">${b} — ${esc(AP[b].city)}</option>`).join("")}</select>`,

/** Alle Flughäfen, die von einer Wettbewerberin als Drehkreuz genutzt werden. */

/** Welche Gesellschaften bedienen diese Strecke plausibel? */
function rivalsOn(r){
  if(r.rivals) return r.rivals;
  const A=AP[r.from], B=AP[r.to]; if(!A||!B){ r.rivals=[]; return r.rivals; }
  const d=distKm(A,B), tour=(A.tourism+B.tourism)/2;
  const target=competitorBase(A,B);
  const cands=[];
  (S.rivals||[]).forEach(x=>{
    const hub = x.hubs.find(h=>h===r.from||h===r.to);
    if(!hub) return;
    if(d>x.reach) return;
    if(x.model==="regional" && d>1900) return;
    if(x.model==="charter" && tour<1.15) return;
    const other = hub===r.from ? B : A;
    const ex=(x.routes||[]).find(q=>(q.from===r.from&&q.to===r.to)||(q.from===r.to&&q.to===r.from));
    let w = Math.pow(Math.min(AP[hub].pax,other.pax),0.45)*Math.pow(Math.max(AP[hub].pax,other.pax),0.20);
    if(x.model==="lcc") w*=1.25;
    if(x.model==="charter") w*=tour;
    if(x.model==="legacy" && d>4000) w*=1.4;
    cands.push({x, w, ex});
  });
  if(!cands.length){ r.rivals=[]; r.comp=Math.max(1,target*0.25); return r.rivals; }
  cands.sort((a,b)=>b.w-a.w);
  const keep=cands.slice(0, d<1200?4:3);
  let fixedSum=0;
  keep.forEach(c=>{ if(c.ex) fixedSum+=c.ex.dailyFreq*7; });
  const rest=Math.max(0, target-fixedSum);
  const openW=keep.filter(c=>!c.ex).reduce((a,c)=>a+c.w,0)||1;
  const RB=((S&&S.rules)||{}).rivalBoost;
  r.rivals=keep.map(c=>({
    id:c.x.id,
    flights: c.ex ? c.ex.dailyFreq*7 : Math.max(1.5, rest*c.w/openW),
    fare: c.ex ? c.ex.fareMod : c.x.fareMod
  }));
  if(RB && RB.ids) r.rivals.forEach(v=>{ if(RB.ids.includes(v.id)) v.flights*=RB.faktor; });
  r.comp=Math.max(1, r.rivals.reduce((a,v)=>a+v.flights,0));
  return r.rivals;
}


/* Marktaufteilung nach multinomialem Logit. Jeder Anbieter erhält einen
   Nutzenwert aus Preis, Ruf, Frequenz und Komfort; die Anteile ergeben sich
   aus den exponierten Nutzenwerten. */
const LOGIT = {fare:-2.4, rep:1.8, freq:1.22, comf:1.30};
function utility(fare, rep, freq, comfort){
  return LOGIT.fare*Math.log(Math.max(fare,0.25))
       + LOGIT.rep*(rep/100)
       + LOGIT.freq*Math.log(Math.max(freq,0.3))
       + LOGIT.comf*comfort;
}
/** Anteil des Spielers und der Wettbewerber auf einer Strecke. */
function marketSplit(r, myFare, myFreq, myComfort, loyal){
  /* Ein Vielfliegerprogramm macht die eigenen Gäste preisunempfindlicher. */
  const fareBeta = loyal ? LOGIT.fare*0.72 : LOGIT.fare;
  const me=Math.exp(fareBeta*Math.log(Math.max(myFare,0.25))
    + LOGIT.rep*(S.rep/100) + LOGIT.freq*Math.log(Math.max(myFreq,0.3))
    + LOGIT.comf*myComfort + (loyal?0.22:0));
  const list=rivalsOn(r);
  let sum=0; const parts=[];
  list.forEach(rv=>{
    const x=rivalById(rv.id); if(!x||rv.flights<=0) return;
    const u=Math.exp(utility(rv.fare, x.rep, rv.flights, x.comfort));
    parts.push({id:rv.id, u, flights:rv.flights, fare:rv.fare, name:x.name});
    sum+=u;
  });
  if(!parts.length) sum=Math.exp(utility(1.0, 60, Math.max(r.comp,1), 1.0));
  const tot=me+sum;
  return {share:me/tot,
    rivals:parts.map(q=>({id:q.id, name:q.name, share:q.u/tot, flights:q.flights, fare:q.fare}))};
}

/** Wöchentliche Reaktion der Konkurrenz auf das Verhalten des Spielers. */
function competitorTurn(){
  S.routes.forEach(r=>{
    const list=rivalsOn(r), L=r.last;
    if(!L||!L.ok) return;
    list.forEach(rv=>{
      const x=rivalById(rv.id); if(!x) return;
      x.aggroEff=(x.aggro||0.5)*(BAL.aggroMult||1);
      const meFare=r.fare;
      if(x.model==="lcc" && meFare < rv.fare*0.96){
        rv.fare=Math.max(0.58, rv.fare - 0.035*x.aggroEff);
        if(Math.random()<x.aggroEff*0.35) rv.flights*=1.07;
      }
      if(L.share>0.42 && Math.random()<x.aggroEff*0.4) rv.flights*=1.06;
      if(L.share<0.14 && x.model!=="lcc" && Math.random()<0.25) rv.flights*=0.95;
      if(x.model==="legacy" && L.share>0.55 && rv.flights<3 && Math.random()<0.22){
        rv.flights=0;
        logg(`${x.name} zieht sich von ${r.from}–${r.to} zurück.`,"good");
      }
      rv.flights=Math.max(0, rv.flights);
    });
    r.rivals=list.filter(v=>v.flights>0.05);
    r.comp=Math.max(1, r.rivals.reduce((a,v)=>a+v.flights,0));
    if(!r.rivals.length && Math.random()<0.05){
      const A=AP[r.from], B=AP[r.to], d=distKm(A,B);
      const cand=pick((S.rivals||[]).filter(x=>x.hubs.some(h=>h===r.from||h===r.to)&&d<=x.reach));
      if(cand){ r.rivals=[{id:cand.id, flights:competitorBase(A,B)*0.35, fare:cand.fareMod}];
        r.comp=r.rivals[0].flights;
        logg(`${cand.name} nimmt ${r.from}–${r.to} neu auf.`,"warn"); }
    }
  });
}


/* ============================================ Umsteigeverkehr über Hubs ==
   Passagiere buchen A → Hub → B als eine Reise. Erfüllen zwei Flüge das
   Umsteigefenster, wird die Nachfrage des Städtepaars A–B anteilig auf beide
   Flüge gebucht — das füllt vor allem Langstrecken ab der eigenen Basis. */
const MCT_MIN = 45, MCT_MAX = 180;
function applyHubTransfers(){
  if(!S || !S.bases.length) return;
  S.transferInfo=[];
  const legs=[];
  Object.keys(LEGSTATS).forEach(k=>{
    const st=LEGSTATS[k];
    if(!st || !st.flights) return;
    legs.push(st);
  });
  if(legs.length<2) return;
  /* freie Sitze je Flug ermitteln */
  legs.forEach(st=>{ st.free = Math.max(0, st.seats - st.pax); st.tPax=0; st.tRev=0; });

  S.bases.forEach(hub=>{
    const inb=legs.filter(x=>x.to===hub), outb=legs.filter(x=>x.from===hub);
    inb.forEach(f1=>{
      outb.forEach(f2=>{
        if(f1.from===f2.to) return;
        const gap=f2.dep-f1.arr;
        if(gap<MCT_MIN || gap>MCT_MAX) return;
        const A=AP[f1.from], B=AP[f2.to], H=AP[hub];
        if(!A||!B||!H) return;
        const direct=distKm(A,B);
        if(direct<250) return;
        const detour=(distKm(A,H)+distKm(H,B))/Math.max(direct,1);
        if(detour>1.45) return;
        const m=marketDemand(A,B,S.month);
        /* Anteil, den eine Umsteigeverbindung realistisch abschöpft */
        const quality = clamp(1.6-detour,0,1) * clamp(1-Math.abs(gap-95)/220,0.25,1);
        let want = m.weekly * 0.075 * quality * Math.min(f1.flights,f2.flights)/7;
        const cap = Math.min(f1.free, f2.free);
        const take = Math.max(0, Math.min(want, cap));
        if(take<1) return;
        const fare = baseFare(direct,"eco")*Math.pow(m.inc,0.35)*0.88;
        const d1=distKm(A,H), d2=distKm(H,B), dt=d1+d2;
        f1.free-=take; f2.free-=take;
        f1.tPax+=take; f2.tPax+=take;
        f1.tRev+=take*fare*(d1/dt); f2.tRev+=take*fare*(d2/dt);
        S.transferInfo.push({from:f1.from, hub, to:f2.to, pax:take, gap, fare});
      });
    });
  });
  /* Ergebnisse zurückschreiben */
  const perRoute={};
  legs.forEach(st=>{
    if(!st.tPax) return;
    st.pax+=st.tPax; st.rev+=st.tRev;
    st.lf = st.seats ? clamp(st.pax/st.seats,0,1) : 0;
    st.profit = st.rev-st.cost;
    st.transferPax = st.tPax;
    const key=routeKey(st.from,st.to);
    perRoute[key]=perRoute[key]||{pax:0,rev:0};
    perRoute[key].pax+=st.tPax; perRoute[key].rev+=st.tRev;
  });
  S.routes.forEach(r=>{
    const add=perRoute[r.key]; if(!add||!r.last||!r.last.ok) return;
    r.last.pax+=add.pax; r.last.rev+=add.rev;
    r.last.transferPax=add.pax;
    r.last.profit=r.last.rev-r.last.cost;
    r.last.lf = r.last.seats.total ? clamp(r.last.pax/r.last.seats.total,0,1) : 0;
  });
  S.transferInfo.sort((a,b)=>b.pax-a.pax);
  S.transferInfo=S.transferInfo.slice(0,40);
}

const CARGO_T = {
  at72:0.4, dh8d:0.5, cr9:0.6, e175:0.7, e29e:1.2, bcs1:1.6, bcs3:2.0,
  b737:2.2, a20n:2.6, b38m:2.8, a21n:3.2, a21x:3.2, b752:4.5,
  b763:16, a339:20, b788:15, b789:19, a359:21, a35k:24, b77w:28, b779:30, a388:22
};
function cargoCap(ac){
  const t=ACT[ac.type];
  const base = CARGO_T[t.id] != null ? CARGO_T[t.id]
    : (t.cat==="Grossraum" ? t.maxSeats*0.045 : t.cat==="Schmalrumpf" ? t.maxSeats*0.013 : 0.5);
  const combi = (ac.combi||0);        // in Combi-Umbau umgewandelte Sitze
  return base + combi*0.115;          // je ausgebautem Sitz rund 115 kg Frachtraum
}
const CARGO_YIELD = 0.25;             // CHF je Tonne und Kilometer

/* ================================================ Treibstoff-Hedging ====
   Terminkontrakte sichern eine Menge Kerosin zum heutigen Preis. */
function hedgedTons(){ return (S.hedges||[]).reduce((a,h)=>a+h.left,0); }
function hedgeAvgPrice(){
  const t=hedgedTons(); if(!t) return 0;
  return (S.hedges||[]).reduce((a,h)=>a+h.left*h.price,0)/t;
}
function buyHedge(tons, months){
  const price=S.fuel;
  const cost=tons*1000*price*0.06;     // Sicherheitsleistung und Gebühr
  if(S.cash<cost){ toast("Zu wenig Liquidität für die Sicherheitsleistung."); return; }
  S.cash-=cost;
  S.hedges=S.hedges||[];
  S.hedges.push({tons, left:tons, price, months, id:"H"+Date.now().toString(36)});
  logg(`Terminkontrakt über ${fmt(tons)} t Kerosin zu ${fmt(price,2)} CHF/kg auf ${months} Monate.`,"");
  render();
}
/** Verrechnet den Monatsverbrauch gegen die Kontrakte. */
function settleHedges(consumedKg){
  if(!(S.hedges||[]).length) return 0;
  let restKg=consumedKg, diff=0;
  S.hedges.forEach(h=>{
    if(restKg<=0 || h.left<=0) return;
    const useKg=Math.min(restKg, h.left*1000);
    diff += useKg*(S.fuel-h.price);   // positiv = Ersparnis gegenüber Marktpreis
    h.left-=useKg/1000; restKg-=useKg;
  });
  S.hedges=S.hedges.filter(h=>{ h.months--; 
    if(h.months<=0 || h.left<=0.01){
      if(h.left>0.01) logg(`Terminkontrakt ausgelaufen, ${fmt(h.left,0)} t verfallen.`,"warn");
      return false; }
    return true; });
  S.cash+=diff;
  return diff;
}

   EDW für Edelweiss. Im Spiel bleibt daneben das IATA-Kürzel sichtbar, weil

const ART_INDEX = {tail:{}, box:{}, long:{}};

/* Wo mein Kürzel nicht dem echten ICAO-Kürzel entspricht, wird hier
   richtiggestellt — sonst findet die Suche kein Bild. */
const ICAO_FIX = {
  ISS:"ICE", CSA:"TVS", LDM:"LGL", HOP:"DLA", IBK:"IBS", ADR:"ASL",
  NOZ:"NAX", AZA:"ITY", TUI:"TUI", CTN:"CTN"
};
const icaoOf = x => (x && (ICAO_FIX[x.id] || x.id)) || "";

async function scanAirlineArt(){
  ART_COUNT=0;
  for(const kind of ["tail","box","long"]){
    let files=[], dir=null;
    for(const d of ART_DIRS[kind]){
      const f=await listFolder(d);
      if(f.length){ files=f; dir=d; break; }
    }
    if(!dir) continue;
    const index={};
    files.filter(f=>/\.(png|jpe?g|svg|webp)$/i.test(f)).forEach(f=>{
      index[f.replace(/\.[^.]+$/,"").toUpperCase()]=dir+"/"+f;
    });
    ART_INDEX[kind]=index;
    ART_COUNT+=Object.keys(index).length;
    COMPETITOR_DATABASE.forEach(x=>{
      const cands=[icaoOf(x), x.id, AIRLINE_IATA[x.id]].filter(Boolean).map(c=>c.toUpperCase());
      for(const c of cands){ if(index[c]){ AIRLINE_ART[kind][x.id]=index[c]; break; } }
    });
  }
  ART_READY=true;
  if(S) applyPlayerArt();
  if(ART_COUNT && typeof render==="function") render();
}
/** Bild zu einem beliebigen Kürzel — ICAO bevorzugt, IATA als Rückfall. */
function artFor(code, kind){
  if(!code) return null;
  const idx=ART_INDEX[kind]||{};
  return idx[String(code).toUpperCase()] || null;
}
/** Setzt Heckflosse und Schriftzug der eigenen Gesellschaft, sobald gefunden. */
function applyPlayerArt(){
  if(!S || !S.icao) return;
  const t=artFor(S.icao,"tail"), l=artFor(S.icao,"long"), b=artFor(S.icao,"box");
  if(t && S.livery && !S.livery.tailImgManuell) S.livery.tailImg=t;
  if(l) S.logoLong=l;
  if(b) S.logoBox=b;
}
function airlineArt(x, kind){ return x && AIRLINE_ART[kind] ? AIRLINE_ART[kind][x.id] : null; }
/** Bildmarke einer Gesellschaft, mit Rückfall auf das gezeichnete Leitwerk. */
function rivalMark(x, size, kind){
  const url=airlineArt(x, kind||"tail") || airlineArt(x,"box");
  if(url) return `<img src="${esc(url)}" width="${size}" height="${size}"
    style="object-fit:contain;display:block;border-radius:2px" alt="" loading="lazy">`;
  return finSVG(x, size);
}

function rivalStyle(x){
  const st=RIVAL_STYLE[x.id];
  if(st) return {c1:st[0], c2:st[1], tail:st[2], glyph:st[3]};
  /* Unbekannte: aus dem Kürzel eine feste, aber eigene Gestaltung ableiten */
  let h=0; for(let i=0;i<x.id.length;i++) h=(h*31+x.id.charCodeAt(i))>>>0;
  const pal=PALETTE, tails=["vollton","diagonale","bogen","streifen"];
  return {c1:pal[h%pal.length], c2:(h>>3)%2?"#ffffff":"#f2c200",
    tail:tails[(h>>5)%tails.length], glyph:GLYPH_KEYS[(h>>7)%GLYPH_KEYS.length]};
}
/** Kleines Leitwerk als Bildmarke — einheitliche Form für alle. */
function finSVG(x, size){

  else if(st.tail==="diagonale") pattern=`<rect width="${W}" height="${H}" fill="#e9edf2"/>

  else if(st.tail==="bogen") pattern=`<rect width="${W}" height="${H}" fill="#e9edf2"/>
    <path d="M0,58 C22,52 34,26 ${W},6 L${W},${H} L0,${H} Z" fill="${st.c1}"/>`;
  else pattern=`<rect width="${W}" height="${H}" fill="#e9edf2"/>
    ${[0,1,2].map(i=>`<rect x="0" y="${16+i*14}" width="${W}" height="9" fill="${st.c1}" opacity="${1-i*0.2}"/>`).join("")}`;
  const gs=22, gx=30, gy=20;

/* =================================================== Beteiligungen ======
   Die Wettbewerber sind bewertete Unternehmen. Wer 51% hält, übernimmt. */
function rivalValue(x){
  let flights=0, routes=0;
  (S.routes||[]).forEach(r=>{ const v=(r.rivals||[]).find(q=>q.id===x.id);
    if(v&&v.flights>0){ flights+=v.flights; routes++; } });
  const hubPax=x.hubs.reduce((a,h)=>a+(AP[h]?AP[h].pax:0),0);
  const base = 60e6 + hubPax*9e6 + x.rep*1.4e6 + flights*2.2e6 + routes*4e6;
  return Math.round(base*(x.valMod||1));
}
function holdings(id){ return (S.holdings||{})[id]||0; }
function buyShares(id, pct){
  const x=rivalById(id); if(!x) return;
  const val=rivalValue(x);
  const have=holdings(id);
  const premium = 1 + 0.30*have + (have+pct>0.5?0.25:0);   // Aufschlag mit wachsendem Paket
  const cost=Math.round(val*pct*premium);
  if(S.cash<cost){ toast("Zu wenig Liquidität für dieses Paket."); return; }
  S.cash-=cost;
  S.holdings=S.holdings||{};
  S.holdings[id]=have+pct;
  logg(`${fmt(pct*100,0)}% an ${x.name} erworben für ${chf(cost)} CHF.`,"good");
  if(S.holdings[id]>=0.5001) takeover(id);
  render();
}
function sellShares(id, pct){
  const x=rivalById(id); if(!x) return;
  const have=holdings(id); const take=Math.min(pct,have);
  if(take<=0) return;
  const val=rivalValue(x)*take*0.92;
  S.cash+=val; S.holdings[id]=have-take;
  if(S.holdings[id]<=0.001) delete S.holdings[id];
  logg(`${fmt(take*100,0)}% an ${x.name} verkauft für ${chf(val)} CHF.`,"");
  render();
}
function takeover(id){
  const x=rivalById(id); if(!x) return;
  const newBases=x.hubs.filter(h=>AP[h] && !S.bases.includes(h)).slice(0,2);
  newBases.forEach(h=>S.bases.push(h));
  S.routes.forEach(r=>{ r.rivals=(r.rivals||[]).filter(v=>v.id!==id);
    r.comp=Math.max(1, r.rivals.reduce((a,v)=>a+v.flights,0)); });
  S.rivals=S.rivals.filter(y=>y.id!==id);
  delete S.holdings[id];
  S.takeovers=(S.takeovers||[]).concat([{id, name:x.name, y:S.year, m:S.month}]);
  const integration = 8e6 + newBases.length*4e6;
  S.cash-=integration;
  S.rep=clamp(S.rep+3,5,99);
  logg(`Übernahme abgeschlossen: ${x.name} geht in ${S.name} auf.`,"good");
  interrupt("Übernahme abgeschlossen",
    `<p><b>${esc(x.name)}</b> gehört jetzt zu ${esc(S.name)}.</p>
     ${newBases.length?`<p>Die Drehkreuze <b>${newBases.join(", ")}</b> gehen mitsamt Zeitfenstern in Ihren Besitz über.</p>`:""}
     <p class="dim">Integrationskosten ${chf(integration)} CHF. Die Gesellschaft verschwindet vom Markt, ihre Frequenzen auf Ihren Strecken entfallen.</p>`);
}

/* ============================================================ Simulation */
/* Tageszeit: früh und abends reisen Geschäftsleute, mittags ist es dünn.
   Deshalb rechnet sich derselbe Flug je nach Abflugzeit deutlich anders. */
function timeWeight(dep){
  const m=((dep%1440)+1440)%1440;
  if(m<300) return 0.55;
  if(m<480) return 1.22;
  if(m<660) return 1.06;
  if(m<900) return 0.84;
  if(m<1080) return 1.04;
  if(m<1320) return 1.14;
  return 0.72;
}
function bizWeight(dep){
  const m=((dep%1440)+1440)%1440;
  if(m<300) return 0.35;
  if(m<480) return 1.55;
  if(m<660) return 1.15;
  if(m<960) return 0.65;
  if(m<1140) return 1.05;
  if(m<1320) return 1.40;
  return 0.45;
}
function timeLabel(dep){
  const m=((dep%1440)+1440)%1440;
  if(m<300) return "Nachtrand";
  if(m<480) return "Morgenspitze";
  if(m<660) return "Vormittag";
  if(m<900) return "Mittagsloch";
  if(m<1080) return "Nachmittag";
  if(m<1320) return "Abendspitze";
  return "Spätabend";
}

/* Ergebnisse je einzelnem Flug, Schlüssel "Flugzeug-ID#Leg-Index". */
let LEGSTATS = {};
const legKey = (acId,d,i)=>acId+"#"+d+"#"+i;

/** Aktive Marketingaktion einer Strecke. */
function campaignOn(key, kind){
  return (S.campaigns||[]).find(c=>c.route===key && c.kind===kind && c.left>0);
}
function simRoute(r, legList, monthIdx, ctx){
  const A=AP[r.from], B=AP[r.to];
  const out={ok:false, flights:0, pax:0, rev:0, cost:0, profit:0, lf:0, cap:0, dist:0,
    seats:{eco:0,prem:0,biz:0,first:0,total:0}, detail:{}, blockH:0, fuelKg:0, legs:[]};
  if(!A||!B||!legList||!legList.length) return out;
  const d=distKm(A,B); out.dist=d;
  const slotF=Math.min(ctx.slot[r.from]||1, ctx.slot[r.to]||1);

  const parts=[];
  let flights=0, comfW=0, seatW=0, twW=0, wxW=0, trW=0, svcW=0, cargoT=0;
  legList.forEach(e=>{
    const ac=e.ac, t=ACT[ac.type];
    const pf = ctx.pilot[t.rating]==null?1:ctx.pilot[t.rating];
    const chF = (ctx.charter&&ctx.charter[ac.id])||1;
    const fl = e.days*Math.min(pf,ctx.cabinF)*slotF*chF;
    if(fl<=0) return;
    const sAll=seatsOf(ac), pen = d>t.range*0.85 ? 0.88 : 1;
    const seats={}; let tot=0;
    for(const k of ["eco","prem","biz","first"]){ seats[k]=Math.floor(sAll[k]*pen); tot+=seats[k]; }
    const bh=e.leg.block/60;
    const tw=timeWeight(e.leg.dep)*(1+(e.transfer||0)), bw=bizWeight(e.leg.dep)*(1+(e.transfer||0)*1.4);
    const wx=wxOnLeg(e.leg);
    const wxFuel = 1 + 0.15*wx;          // Ausweichrouten und Warteschleifen
    const part={ac, leg:e.leg, fl, seats, tot, tw, bw, wx, transfer:e.transfer||0, svc:svcOfAc(ac),
      fuel:t.burn*bh*fl*S.fuel*wxFuel, maint:t.maint*bh*fl,
      crew:(2*BAL.pilotHourly+t.cabin*BAL.cabinHourly)*bh*fl, block:bh*fl, fuelKg:t.burn*bh*fl*wxFuel};
    parts.push(part);
    for(const k of ["eco","prem","biz","first"]) out.seats[k]+=seats[k]*fl;
    out.seats.total += tot*fl;
    const wifiBonus = (ac.wifi && d>2000) ? 0.10 : 0;
    comfW += (comfortOf(ac)+wifiBonus)*(1-0.20*wx)*fl; seatW += tot*fl;
    cargoT += cargoCap(ac)*fl; twW += tw*fl; wxW += wx*fl; trW += (e.transfer||0)*fl;
    svcW += svcOfAc(ac).pull*fl;
    flights += fl;
  });
  if(flights<=0) return out;
  out.flights=flights; out.cap=out.seats.total;
  const comfort=comfW/flights, avgSeats=seatW/flights;
  const timeQual = twW/flights, wxAvg = wxW/flights, transferAvg = trW/flights;
  const svcPull = svcW/flights;

  const m=marketDemand(A,B,monthIdx), sh=classShares(m);
  const preis = campaignOn(r.key,"preis"), bekannt = campaignOn(r.key,"bekanntheit");
  const fareEff = r.fare * (preis?0.80:1);
  const priceAdv=Math.pow(1/fareEff,1.3)*Math.pow(S.rep/62,0.55)*Math.pow(comfort,0.5)
    *Math.pow(svcPull,0.6)*(bekannt?1.35:1);
  const effF=flights*priceAdv*Math.pow(timeQual,0.8);
  const split = marketSplit(r, fareEff/(bekannt?1.18:1), effF, comfort*svcPull, loyaltyActive());
  const share = split.share;
  out.split = split;
  const elast=Math.pow(fareEff, -BAL.elasticity*(loyaltyActive()?0.78:1));

  let rev=0, pax=0;
  const sold={eco:0,prem:0,biz:0,first:0};
  for(const k of ["eco","prem","biz","first"]){
    const lounge = ((hasUpgrade(r.from,"lounge")||hasUpgrade(r.to,"lounge")) && (k==="biz"||k==="first")) ? 1.20 : 1;
    const svcK = k==="eco" ? Math.pow(svcPull,0.5) : Math.pow(svcPull,1.6);
    const dem=m.weekly*sh[k]*share*elast*svcK*lounge*(k==="eco"?1:Math.pow(m.inc,0.4));
    const p=Math.min(out.seats[k],dem);
    const loungeYield = ((hasUpgrade(r.from,"lounge")||hasUpgrade(r.to,"lounge")) && (k==="biz"||k==="first")) ? 1.12 : 1;
    const fare=baseFare(d,k)*fareEff*Math.pow(m.inc,0.35)*loungeYield;
    rev+=p*fare; pax+=p; sold[k]=p;
    out.detail[k]={pax:p, seats:out.seats[k], fare, demand:dem, spill:0};
  }
  /* Übergebliebene Economy-Nachfrage nimmt leere Sitze der höheren Klassen
     zum leicht erhöhten Economy-Tarif — so verfallen Kabinen nicht sinnlos. */
  let restEco = Math.max(0, out.detail.eco.demand - out.detail.eco.pax);
  const ecoFare = baseFare(d,"eco")*fareEff*Math.pow(m.inc,0.35);
  [["prem",1.20],["biz",1.45]].forEach(([k,f])=>{
    if(restEco<=0) return;
    const free = out.seats[k]-out.detail[k].pax;
    const take = Math.min(free, restEco);
    if(take>0){ rev+=take*ecoFare*f; pax+=take; restEco-=take;
      out.detail[k].spill=take; sold[k]+=take; }
  });

  if(wxAvg>0){ const cut=1-clamp(wxAvg*0.05,0,0.05);
    pax*=cut; rev*=cut;
    for(const k of ["eco","prem","biz","first"]) out.detail[k].pax*=cut; }
  const avgFee=(A.fee+B.fee)/2;
  const fees = pax*14*avgFee + flights*avgSeats*6*avgFee;
  const svcMix = parts.reduce((a,x)=>a+x.fl,0)||1;
  const svcCost = ["eco","prem","biz","first"].reduce((a,k)=>{
    const w=parts.reduce((q,x)=>q+SERVICE[k][x.svc.i].cost*x.fl,0)/svcMix;
    return a+out.detail[k].pax*w; },0);
  out.pax=pax; out.rev=rev;
  out.fuelKg = parts.reduce((a,x)=>a+x.fuelKg,0);
  out.blockH = parts.reduce((a,x)=>a+x.block,0);
  out.maintC = parts.reduce((a,x)=>a+x.maint,0);
  out.crewC  = parts.reduce((a,x)=>a+x.crew,0);
  out.fees=fees;
  /* Beiladefracht: Auslastung des Frachtraums nach Wirtschaftskraft der Enden */
  const cargoLF = clamp(0.42+0.28*((A.biz+B.biz)/2-1)+0.10*(d>4000?1:0), 0.20, 0.92);
  const frachtUp = (hasUpgrade(r.from,"fracht")?1:0)+(hasUpgrade(r.to,"fracht")?1:0);
  const cargoRev = cargoT*cargoLF*d*CARGO_YIELD*(1+0.12*frachtUp)*(((S&&S.rules)||{}).cargoBoost||1);
  rev += cargoRev;
  out.cargoRev = cargoRev; out.cargoT = cargoT*cargoLF;
  const anc = pax*ancillaryPerPax();
  rev += anc; out.ancillary = anc;
  out.svc = svcCost;
  out.cost = out.fuelKg*S.fuel + out.maintC + out.crewC + fees + svcCost;
  out.lf = out.seats.total ? pax/out.seats.total : 0;
  out.profit = out.rev-out.cost;
  out.share = share; out.market = m.weekly; out.wx = wxAvg; out.transfer = transferAvg; out.ok = true;

  /* Auf die einzelnen Flüge herunterbrechen: Passagiere nach Sitzangebot,
     Kosten exakt je Flug. */
  const wSum={eco:0,prem:0,biz:0,first:0};
  parts.forEach(part=>{ for(const k of ["eco","prem","biz","first"])
    wSum[k] += part.seats[k]*part.fl*(k==="biz"||k==="first"?part.bw:part.tw); });
  parts.forEach(part=>{
    let pRev=0, pPax=0, pSeats=0;
    for(const k of ["eco","prem","biz","first"]){
      const offered = part.seats[k]*part.fl;
      pSeats += offered;
      if(!out.seats[k]||!wSum[k]) continue;
      const wq = offered*(k==="biz"||k==="first"?part.bw:part.tw)/wSum[k];
      const q = Math.min(wq*out.seats[k]/Math.max(offered,1e-9), 1) * offered/out.seats[k];
      const paxK = sold[k]*q;
      pPax += paxK;
      const baseF = out.detail[k].fare;
      const spillShare = out.detail[k].spill*q;
      pRev += (paxK-spillShare)*baseF + spillShare*ecoFare*(k==="prem"?1.20:k==="biz"?1.45:1);
    }
    const pFees = out.pax ? fees*(pPax/out.pax) : 0;
    const pSvc = out.pax ? svcCost*(pPax/out.pax) : 0;
    const cost = part.fuel+part.maint+part.crew+pFees+pSvc;
    const st = {reg:part.ac.reg, no:part.leg.no, from:part.leg.from, to:part.leg.to,
      dep:part.leg.dep, arr:part.leg.arr, block:part.leg.block,
      curfew: part.leg.issues.some(x=>/Sperrzeit/.test(x)),
      tag:timeLabel(part.leg.dep), wx:part.wx, transfer:part.transfer,
      flights:part.fl, seats:pSeats, pax:Math.min(pPax,pSeats),
      lf: pSeats? Math.min(pPax/pSeats,1) : 0, rev:pRev, cost, profit:pRev-cost};
    out.legs.push(st);
    LEGSTATS[legKey(part.ac.id, part.leg.day, part.leg.i)] = st;
  });
  return out;
}

/* =================================================== Echtzeit-Kernschleife
   Die Simulation läuft kontinuierlich. Einzelne Flüge werden zu ihrer
   Abflug- und Ankunftszeit abgerechnet, Fixkosten am Monatsersten. */
const MS_START = Date.UTC(2027,0,1,4,0);
function clockDate(){ return new Date((S.clock||MS_START)); }
function minuteOfDay(){ const d=clockDate(); return d.getUTCHours()*60+d.getUTCMinutes(); }
function weekdayIdx(){ return (clockDate().getUTCDay()+6)%7; }   // 0 = Montag
function clockLabel(){
  const d=clockDate();
  return `${String(d.getUTCDate()).padStart(2,"0")}.${String(d.getUTCMonth()+1).padStart(2,"0")}.${d.getUTCFullYear()} ${String(d.getUTCHours()).padStart(2,"0")}:${String(d.getUTCMinutes()).padStart(2,"0")}`;
}

/** Betriebswirtschaftliche Wochenrechnung. Liefert LEGSTATS je Einzelflug. */
function recomputeWeek(){
  if(!S) return;
  LEGSTATS={};
  const map=syncRoutes();
  const pf=pilotFactors(), cn=cabinNeed(), cabinF0 = cn ? clamp(S.cabin/cn,0,1) : 1;
  const cabinF = cabinF0*(S.thinMonth||1);
  const ctx={pilot:pf, cabinF, slot:slotFactors(), charter:{}};
  S.crewFactor = Math.min(cabinF, ...Object.values(pf).concat([1]));
  pruneFlightNumbers();
  S.routes.forEach(r=>{ r.last = simRoute(r, map[r.key], S.month, ctx); });
  applyHubTransfers();
}

/** Tagesflugplan aufbauen: welche Flüge finden heute statt. */
function dayKey(){ const d=clockDate();
  return d.getUTCFullYear()+"-"+d.getUTCMonth()+"-"+d.getUTCDate(); }
/** Baut den Tagesflugplan neu auf und übernimmt dabei den Stand bereits
    gestarteter oder abgerechneter Flüge, damit nichts doppelt zählt. */
function buildDaySchedule(){
  const wd=weekdayIdx();
  const sameDay = S.daySchedDay===dayKey();
  const prev={};
  if(sameDay) (S.daySched||[]).forEach(f=>prev[f.ac+"#"+f.i]={s:f.started, d:f.done, rev:f.rev, cost:f.cost, pax:f.pax, seats:f.seats});
  S.daySchedDay=dayKey();
  S.daySched=[];
  S.fleet.forEach(ac=>{
    if(ac.status!=="aktiv") return;
    if(charterBusy(ac.id)) return;
    if(blockActive("ac",ac.id)) return;
    if(blockActive("type",ac.type)) return;
    const sch=scheduleOf(ac);
    const legs=sch.week[wd].legs;
    if(!legs.length) return;
    legs.forEach(l=>{
      if(l.issues.length) return;
      const st=LEGSTATS[legKey(ac.id,wd,l.i)];
      const f=st?Math.max(st.flights,1):1;
      if(blockActive("region", AP[l.to]?AP[l.to].region:"") ||
         blockActive("region", AP[l.from]?AP[l.from].region:"")) return;
      if(blockActive("wx", l.from) || blockActive("wx", l.to)) return;
      const old=prev[ac.id+"#"+l.i];
      S.daySched.push({ac:ac.id, reg:ac.reg, i:l.i, day:wd, from:l.from, to:l.to, no:l.no,
        dep:l.dep, arr:l.arr, dist:l.dist,
        rev: old&&old.d ? old.rev : (st?st.rev/f:0),
        cost: old&&old.d ? old.cost : (st?st.cost/f:0),
        pax:  old&&old.d ? old.pax  : (st?st.pax/f:0),
        seats:old&&old.d ? old.seats: (st?st.seats/f:0),
        started: old?old.s:false, done: old?old.d:false});
    });
  });
  S.daySched.sort((a,b)=>a.dep-b.dep);
}
function charterBusy(acId){
  return (S.charters||[]).some(c=>c.ac===acId && c.until>(S.clock||0));
}
function tickerPush(kind, txt, atMin){
  S.ticker=S.ticker||[];
  S.ticker.unshift({k:kind, t:txt, at: atMin==null ? clockLabel().slice(11) : hhmm(atMin)});
  if(S.ticker.length>60) S.ticker.length=60;
  renderTicker();
}
function renderTicker(){
  const el=document.getElementById("tkl"); if(!el||!S) return;
  el.innerHTML=(S.ticker||[]).slice(0,14).map(x=>
    `<div class="tk ${x.k}"><span>${x.at}</span><b>${esc(x.t)}</b></div>`).join("")
    || `<div class="tk"><span>—</span><b>noch kein Betrieb</b></div>`;
}

/** Ein Zeitschritt in Spielminuten. */
function stepMinutes(dm){
  if(!S) return;
  let left=dm;
  while(left>0){
    const mod=minuteOfDay();
    const step=Math.min(left, 1440-mod);
    const target=mod+step;
    /* Flüge abarbeiten */
    (S.daySched||[]).forEach(f=>{
      if(!f.started && f.dep<=target){ f.started=true;
        tickerPush("dep", `${S.code} ${f.no} ${f.from}→${f.to}`, f.dep); }
      if(!f.done && f.arr<=target && f.arr<=1440){
        f.done=true;
        creditFlight(f);
      }
    });
    S.clock=(S.clock||MS_START)+step*60000;
    left-=step;
    if(minuteOfDay()===0 || (mod+step)>=1440) newDay();
  }
  renderHeader();
}
function creditFlight(f){
  if(f.cancelled){
    S.acc=S.acc||emptyAcc();
    S.acc.cancel=(S.acc.cancel||0)+1;
    tickerPush("arr", `${S.code} ${f.no} ${f.from}→${f.to} annulliert`, f.arr);
    return;
  }
  const net=f.rev-f.cost;
  S.cash+=net;
  const stx=LEGSTATS[legKey(f.ac,f.day,f.i)];
  if(stx && stx.curfew) S.curfewHits=(S.curfewHits||0)+1;
  /* Jeden abgeschlossenen Flug einzeln festhalten */
  const st=LEGSTATS[legKey(f.ac,f.day,f.i)];
  S.flightHistory=S.flightHistory||[];
  S.flightHistory.unshift({
    t:S.clock, no:f.no, reg:f.reg, ac:f.ac, day:f.day, from:f.from, to:f.to,
    dep:f.dep, arr:f.arr, dist:f.dist,
    pax:Math.round(f.pax), seats:Math.round(f.seats),
    lf: f.seats? f.pax/f.seats : 0, net,
    wx: st?st.wx||0:0, tag: st?st.tag:"",
    key: routeKey(f.from,f.to)
  });
  if(S.flightHistory.length>200) S.flightHistory.length=200;
  S.acc=S.acc||emptyAcc();
  S.acc.rev+=f.rev; S.acc.direct+=f.cost; S.acc.pax+=f.pax;
  S.acc.seats+=f.seats; S.acc.flights+=1;
  S.acc.rpk+=f.pax*f.dist; S.acc.ask+=f.seats*f.dist;
  tickerPush("arr", `${S.code} ${f.no} an ${f.to} · ${fmt(f.pax,0)} Pax · ${sgn(net)}`, f.arr);
}
function emptyAcc(){ return {rev:0,direct:0,pax:0,seats:0,flights:0,rpk:0,ask:0}; }

/** Tageswechsel: übernächtige Flüge gutschreiben, Plan neu aufbauen. */
function newDay(){
  (S.daySched||[]).forEach(f=>{ if(!f.done){ f.done=true; creditFlight(f); } });
  const d=clockDate();
  S.year=d.getUTCFullYear(); S.month=d.getUTCMonth();
  if(d.getUTCDate()===1) monthClose();
  /* Charteraufträge, die abgelaufen sind, abrechnen */
  (S.charters||[]).forEach(c=>{
    if(!c.paid && c.until<=S.clock){
      c.paid=true; S.cash+=c.pay; S.charterDone=(S.charterDone||0)+1;
      S.acc=S.acc||emptyAcc(); S.acc.charter=(S.acc.charter||0)+c.pay;
      logg(`Charter «${c.title}» ${c.from}–${c.to} geflogen, ${chf(c.pay)} CHF.`,"good");
      tickerPush("arr", `Charter ${c.from}→${c.to} abgeschlossen`);
    }
  });
  S.charters=(S.charters||[]).filter(c=>!c.paid);
  S.aiCounter=(S.aiCounter||0)+1;
  if(S.aiCounter >= (BAL.aiDays||30)){ S.aiCounter=0; competitorTurn(); }
  /* Wetterzellen ziehen weiter und schwächen sich allmählich ab */
  (S.weather||[]).forEach(z=>{
    z.lon += (z.dx||0); z.lat = clamp(z.lat+(z.dy||0), -55, 78);
    if(z.lon>180) z.lon-=360; if(z.lon<-180) z.lon+=360;
    z.int = clamp(z.int*rnd(0.94,1.03), 0.12, 1.0);
  });
  S.weather=(S.weather||[]).filter(z=>z.int>0.16);
  if(S.weather.length<2 && Math.random()<0.35) S.weather=S.weather.concat(rollWeather().slice(0,1));
  S.daySchedDay=null;
  recomputeWeek();
  buildDaySchedule();
  rollDisruptions();
  renderMap();
}

/** Monatsabschluss: Fixkosten, Personal, Ereignisse, Auswertung. */
function monthClose(){
  const A=S.acc||emptyAcc();
  const M={rev:A.rev, fuel:0, maint:0, crew:0, fees:0, direct:A.direct,
    lease:0, dep:0, interest:0, station:0, overhead:0, marketing:0,
    pax:A.pax, ask:A.ask, rpk:A.rpk, block:0, flights:A.flights,
    charter:A.charter||0, svcTotal:0, cancel:1-(S.crewFactor||1)};
  /* Direktkosten nach Art aufteilen, damit die Erfolgsrechnung lesbar bleibt */
  let wF=0,wM=0,wC=0,wG=0,wS=0,wB=0;
  S.routes.forEach(r=>{ const L=r.last; if(!L||!L.ok) return;
    wF+=L.fuelKg*S.fuel; wM+=L.maintC; wC+=L.crewC; wG+=L.fees; wS+=L.svc||0; wB+=L.blockH; });
  const wTot=wF+wM+wC+wG+wS;
  const scale = wTot>0 ? A.direct/wTot : 0;
  M.fuel=wF*scale; M.maint=wM*scale; M.crew=wC*scale; M.fees=wG*scale; M.svcTotal=wS*scale;
  M.block=wB*BAL.weeksPerMonth;

  M.crew += Object.values(S.pilots).reduce((s,v)=>s+v,0)*BAL.pilotPay + S.cabin*BAL.cabinPay;
  S.fleet.forEach(ac=>{
    const t=ACT[ac.type]; ac.age++;
    ac.hours += acWeeklyBlock(ac)*BAL.weeksPerMonth;
    if(ac.lease) M.lease += t.price*1e6*BAL.leaseRate; else M.dep += t.price*1e6/(BAL.depYears*12);
    ac.aog=clamp(0.015+ac.age/12*0.0035+(ac.hours/BAL.heavyCheckHrs)*0.02,0.01,0.20);
    if(ac.status==="wartung"){ ac.checkLeft--;
      if(ac.checkLeft<=0){ ac.status="aktiv"; ac.hours=0; logg(`${ac.reg} nach Grosscheck zurück im Einsatz.`,"good"); }
    } else if(ac.hours>BAL.heavyCheckHrs){
      ac.status="wartung";
      ac.checkLeft = hasUpgrade(ac.base,"hangar") ? 1 : 2;
      if(hasUpgrade(ac.base,"hangar")) ac.hours*=0;
      const c=t.price*1e6*0.03*(hasUpgrade(ac.base,"hangar")?0.68:1)*(BAL.aogMult||1); S.cash-=c;
      if((BAL.aogMult||1)>2) S.rep=clamp(S.rep-1.5,5,99);
      logg(`${ac.reg} zum Grosscheck am Boden, ${chf(c)} CHF.`,"warn");
      interrupt("Flugzeug am Boden", `<p><b>${ac.reg}</b> muss zum Grosscheck. Die Maschine fehlt ${ac.checkLeft} Monat${ac.checkLeft>1?"e":""} im Flugplan.</p>`);
    }
  });
  S.campaigns=(S.campaigns||[]).filter(c=>{
    if(c.left<=0) return false;
    S.cash-=c.cost; M.marketing+=c.cost;
    if(c.kind==="marke") S.rep=clamp(S.rep+1.6,5,99);
    c.left--;
    if(c.left<=0){ logg(`Marketingaktion «${c.name}» ausgelaufen.`,""); return false; }
    return true;
  });
  /* Terminkontrakte gegen den Monatsverbrauch verrechnen */
  let fuelKgMonth=0;
  S.routes.forEach(r=>{ if(r.last&&r.last.ok) fuelKgMonth+=r.last.fuelKg*BAL.weeksPerMonth; });
  M.hedge = settleHedges(fuelKgMonth);
  /* Vielfliegerprogramm */
  M.loyalty = loyaltyActive() ? LOYALTY_COST : 0;
  if(M.loyalty){ S.cash-=M.loyalty; S.rep=clamp(S.rep+0.25,5,99); }
  /* Dividenden aus Beteiligungen */
  M.dividend=0;
  Object.keys(S.holdings||{}).forEach(id=>{
    const x=rivalById(id); if(!x) return;
    const div=rivalValue(x)*holdings(id)*0.0035;
    M.dividend+=div; S.cash+=div;
  });
  M.station=S.bases.length*BAL.baseMonthly*1e6 + upgradeUpkeep();
  M.interest=S.debt*BAL.loanRate/12;
  if(S.bagFee) M.rev*=1.035;
  if(S.codeshare) M.rev*=0.96;
  M.overhead=M.rev*BAL.overhead;
  const fixed=M.crew - (wC*scale) + M.lease + M.dep + M.interest + M.station + M.overhead;
  S.cash -= (M.crew-(wC*scale)) + M.lease + M.interest + M.station + M.overhead;
  const costs=M.fuel+M.maint+M.crew+M.fees+M.svcTotal+M.lease+M.dep+M.interest+M.station
    +M.overhead+M.marketing+(M.loyalty||0);
  const profit=M.rev+M.charter+(M.hedge||0)+(M.dividend||0)-costs;

  let wxLoad=0, wn=0;
  S.routes.forEach(r=>{ if(r.last&&r.last.ok){ wxLoad+=r.last.wx*r.last.flights; wn+=r.last.flights; } });
  const wxAvg=wn?wxLoad/wn:0;
  const lfAll=M.ask?M.rpk/M.ask:0;
  S.punctuality=clamp(0.945 - wxAvg*0.20 - M.cancel*0.45 - Math.max(0,lfAll-0.90)*0.35, 0.52, 0.99);

  let dRep=0;
  if(S.routes.length){
    dRep += lfAll>0.90?-1.1 : lfAll>0.62?0.7 : -0.5;
    const avgAge=S.fleet.length?S.fleet.reduce((s,a)=>s+a.age,0)/S.fleet.length/12:0;
    dRep += avgAge<8?0.5 : avgAge>16?-0.7 : 0;
    dRep -= M.cancel*6;
    const cf=S.fleet.length?S.fleet.reduce((q,a)=>q+comfortOf(a),0)/S.fleet.length:1;
    dRep += (cf-1)*4;
    dRep += (S.punctuality-0.87)*6;
    dRep += avgServiceRep()*1.4;
    if(hasUpgrade(S.bases[0],"lounge")) dRep += 0.3;
  } else dRep-=0.3;
  S.rep=clamp(S.rep+dRep,5,99);

  S.pilotsTrain=S.pilotsTrain.filter(x=>{ x.m -= hasUpgrade(S.bases[0],"schule")?2:1;
    if(x.m<=0){ S.pilots[x.r]=(S.pilots[x.r]||0)+x.n;
      logg(`${x.n} Cockpitmitglieder mit Berechtigung ${RATING_NAME[x.r]||x.r} einsatzbereit.`,"good"); return false; }
    return true; });
  S.cabinTrain=S.cabinTrain.filter(x=>{ x.m -= hasUpgrade(S.bases[0],"schule")?2:1;
    if(x.m<=0){ S.cabin+=x.n; logg(`${x.n} Kabinenmitglieder einsatzbereit.`,"good"); return false; }
    return true; });
  S.orders=S.orders.filter(o=>{ o.left--;
    if(o.left<=0){
      const regs=[];
      for(let i=0;i<o.n;i++) regs.push(addAircraft(o.type,o.lease,o.base,0).reg);
      logg(`${o.n}× ${ACT[o.type].name} ausgeliefert nach ${o.base}.`,"good");
      interrupt("Auslieferung", `<p>${o.n}× <b>${esc(ACT[o.type].name)}</b> ist in ${o.base} eingetroffen: ${regs.join(", ")}.</p>
        <p class="dim">Die Maschinen stehen ohne Tagesplan am Boden. Unter «Flotte» einteilen.</p>`);
      return false; }
    return true; });

  updateRelations(M);
  S.curfewHits=Math.max(0,(S.curfewHits||0)-4);
  S.thinMonth=null;
  S.reviews=(makeReviews()).concat(S.reviews||[]).slice(0,80);
  rollWeather(); rollCharters(); rollUsed(); checkAchievements();
  if(S.strikeRisk && Math.random()<S.strikeRisk){
    S.strikeRisk=0; S.rep=clamp(S.rep-5,5,99); S.cash-=rnd(0.8,2.5)*1e6;
    logg("Streik des Kabinenpersonals. Zahlreiche Ausfälle und Entschädigungen.","bad");
    interrupt("Streik", "<p>Das Kabinenpersonal legt die Arbeit nieder. Zahlreiche Flüge fallen aus, Entschädigungen werden fällig.</p>");
  }
  const vol=BAL.fuelVol||0.035;
  let fMove=rnd(1-vol,1+vol*1.15);
  if(S.difficulty==="profi" && Math.random()<0.12) fMove*= (Math.random()<0.5?1.35:0.75);
  S.fuel=clamp(S.fuel*fMove*(S.fuelPenalty||1)/(S.lastFuelPenalty||1),0.40,3.2);
  S.lastFuelPenalty=S.fuelPenalty||1;
  S.economy=clamp(S.economy*rnd(0.985,1.017),0.72,1.28);
  randomEvent();

  S.history.push({y:S.year,m:S.month,rev:M.rev+M.charter,cost:costs,profit,cash:S.cash,
    pax:M.pax,lf:lfAll,rep:S.rep});
  if(S.history.length>240) S.history.shift();
  S.lastMonth=Object.assign({},M,{costs,profit,lf:lfAll});
  S.acc=emptyAcc();

  cloudAuto();
  checkScenario();
  maybeDilemma();
  if(S.pending){ setSpeed(0); setTimeout(showDilemma,220); }
  if(S.cash < 0 && !S.warnedCash){ S.warnedCash=true;
    interrupt("Liquidität kritisch", `<p>Der Kontostand ist auf <b class="neg">${chf(S.cash)} CHF</b> gefallen. Ohne Gegensteuer droht die Zahlungsunfähigkeit.</p>
      <p class="dim">Möglichkeiten: Kredit aufnehmen, defizitäre Flüge streichen, Personal anpassen oder eine Maschine verkaufen.</p>`); }
  if(S.cash > 0) S.warnedCash=false;
  if(S.cash < -25e6){
    setSpeed(0);
    logg("Zahlungsunfähigkeit. Der Flugbetrieb wird eingestellt.","bad");
    setTimeout(()=>modal("Betrieb eingestellt",

let lastFrame=0, minAcc=0;
function setSpeed(v){
  if(!S) return;
  S.speed=v;
  $$("#speedctl button").forEach(b=>b.classList.toggle("on", +b.dataset.sp===v));
}

/* Im Hintergrund wird angehalten: sonst würden beim Zurückkehren Wochen
   auf einen Schlag durchlaufen. */
document.addEventListener("visibilitychange",()=>{
  if(!S) return;
  if(document.hidden){ S.speedBefore=S.speed; setSpeed(0); }
  else { lastFrame=0; minAcc=0;
    if(S.speedBefore){ setSpeed(S.speedBefore); S.speedBefore=0; } }
});
  if(!lastFrame) lastFrame=ts;
  const dt=Math.min((ts-lastFrame)/1000, 0.25); lastFrame=ts;
  if(!S || !S.speed) return;
  minAcc += dt*60*S.speed;          // 1 Realsekunde = 1 Spielstunde bei 1×
  if(minAcc>=1){
    const dm=Math.floor(minAcc); minAcc-=dm;
    stepMinutes(Math.min(dm, 720));
    movePlanes();
  }
}

/* ================================================================= Karte */
/* Web-Mercator wie bei den gängigen Kartendiensten: Meridiane sind
   gleichmässig verteilt, Breitenkreise nach oben gestreckt. Das ist die
   Projektion, die man von Google Maps und Streckenkarten kennt. */
const MAPW=2000, LAT_TOP=83, LAT_BOT=-57;
const mercY = lat => Math.log(Math.tan(Math.PI/4 + rad(clamp(lat,-85.05,85.05))/2));
const MY_TOP = mercY(LAT_TOP), MY_BOT = mercY(LAT_BOT);
const MAPH = MAPW*(MY_TOP-MY_BOT)/(2*Math.PI);
let view={x:0,y:0,k:1}, showLabels=false;
const px = lon => (lon+180)/360*MAPW;
const py = lat => (MY_TOP - mercY(lat))/(MY_TOP-MY_BOT)*MAPH;

/* Zwei Farbwelten: das dunkle Nachtvorfeld und eine helle Tageskarte,
   die sich an gewohnten Kartendiensten orientiert. */
const MAP_STYLES = {
  nacht: {n:"Nachtkarte", sea0:"#12243f", sea1:"#070f1c", land:"#1e2c3f", coast:"#3a5170",
          border:"rgba(120,150,185,0.28)", grat:"#152743", equ:"#1d3450",
          label:"#a9bdd6", labelStroke:"#080e1a", night:0.45, dot:"#3f5a78"},
  tag:   {n:"Tageskarte", sea0:"#aadaff", sea1:"#8fc8f5", land:"#f3efe6", coast:"#c9c0ae",
          border:"rgba(150,140,120,0.55)", grat:"rgba(120,140,160,0.18)", equ:"rgba(120,140,160,0.35)",
          label:"#3d4a5a", labelStroke:"#ffffff", night:0.30, dot:"#8fa0b4"}
};
function mapStyle(){ return MAP_STYLES[(S&&S.mapStyle)||"nacht"]; }
function gcPath(A,B){
  const la1=rad(A.lat),lo1=rad(A.lon),la2=rad(B.lat),lo2=rad(B.lon);
  const dd=2*Math.asin(Math.sqrt(Math.sin((la2-la1)/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin((lo2-lo1)/2)**2));
  if(!dd) return "";
  const nn=clamp(Math.round(dd*40),12,80), segs=[]; let cur=[], prev=null;
  for(let i=0;i<=nn;i++){
    const t=i/nn, a=Math.sin((1-t)*dd)/Math.sin(dd), b=Math.sin(t*dd)/Math.sin(dd);
    const x=a*Math.cos(la1)*Math.cos(lo1)+b*Math.cos(la2)*Math.cos(lo2);
    const y=a*Math.cos(la1)*Math.sin(lo1)+b*Math.cos(la2)*Math.sin(lo2);
    const z=a*Math.sin(la1)+b*Math.sin(la2);
    const lat=Math.atan2(z,Math.sqrt(x*x+y*y))*180/Math.PI, lon=Math.atan2(y,x)*180/Math.PI;
    if(prev!==null&&Math.abs(lon-prev)>180){ segs.push(cur); cur=[]; }
    cur.push([lon,lat]); prev=lon;
  }
  if(cur.length) segs.push(cur);
  return segs.filter(s=>s.length>1)
    .map(s=>"M"+s.map(p=>px(p[0]).toFixed(1)+","+py(p[1]).toFixed(1)).join("L")).join(" ");
}

/* ============================================== Sonnenstand und Nachtzone */
function subsolar(){
  const d=clockDate();
  const doy=Math.floor((Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate())
    -Date.UTC(d.getUTCFullYear(),0,1))/86400000)+1;
  const decl = -23.44*Math.cos(rad(360/365*(doy+10)));
  const utcMin = d.getUTCHours()*60+d.getUTCMinutes();
  const lon = 180 - utcMin/4;
  return {lat:decl, lon:((lon+540)%360)-180};
}
/** Nachtzone als Polygon über die Karte. */
function nightPath(){
  const ss=subsolar();
  const decl=rad(ss.lat);
  if(Math.abs(ss.lat)<0.2) ss.lat=0.2;
  const pts=[];
  for(let i=0;i<=360;i+=3){
    const lon=-180+i;
    const H=rad(lon-ss.lon);
    // Breitengrad, an dem die Sonne genau am Horizont steht
    let lat = Math.atan(-Math.cos(H)/Math.tan(rad(ss.lat)))*180/Math.PI;
    pts.push([lon, clamp(lat,LAT_BOT,LAT_TOP)]);
  }
  const north = ss.lat < 0;   // Nordpol im Dunkeln, wenn die Sonne südlich steht
  let d="M"+pts.map(p=>px(p[0]).toFixed(1)+","+py(clamp(p[1],LAT_BOT,LAT_TOP)).toFixed(1)).join("L");
  d += north ? `L${MAPW},0 L0,0 Z` : `L${MAPW},${MAPH.toFixed(1)} L0,${MAPH.toFixed(1)} Z`;
  return d;
}
function isNight(a){
  const ss=subsolar();
  const h=Math.sin(rad(ss.lat))*Math.sin(rad(a.lat))
    + Math.cos(rad(ss.lat))*Math.cos(rad(a.lat))*Math.cos(rad(a.lon-ss.lon));
  return h < -0.05;
}
/* -------------------------------------------- Positionen im Grosskreis - */
function gcPoint(A,B,f){
  const la1=rad(A.lat),lo1=rad(A.lon),la2=rad(B.lat),lo2=rad(B.lon);
  const dd=2*Math.asin(Math.sqrt(Math.sin((la2-la1)/2)**2
    +Math.cos(la1)*Math.cos(la2)*Math.sin((lo2-lo1)/2)**2));
  if(!dd) return {lat:A.lat, lon:A.lon};
  const a=Math.sin((1-f)*dd)/Math.sin(dd), b=Math.sin(f*dd)/Math.sin(dd);
  const x=a*Math.cos(la1)*Math.cos(lo1)+b*Math.cos(la2)*Math.cos(lo2);
  const y=a*Math.cos(la1)*Math.sin(lo1)+b*Math.cos(la2)*Math.sin(lo2);
  const z=a*Math.sin(la1)+b*Math.sin(la2);
  return {lat:Math.atan2(z,Math.sqrt(x*x+y*y))*180/Math.PI,
          lon:Math.atan2(y,x)*180/Math.PI};
}
/** Zeichnet die aktuell in der Luft befindlichen Flüge. */
function movePlanes(){
  const host=document.getElementById("planes"); if(!host||!S) return;
  if(!animOn){ host.innerHTML=""; return; }
  const now=minuteOfDay();
  const live=(S.daySched||[]).filter(f=>f.started && !f.done && f.arr>f.dep);
  if(!live.length){ host.innerHTML=""; return; }
  const sc=(1/Math.max(view.k,1)*1.7).toFixed(2);
  host.innerHTML=live.map(f=>{
    const A=AP[f.from], B=AP[f.to]; if(!A||!B) return "";
    const t=clamp((now-f.dep)/(f.arr-f.dep),0,1);
    const p1=gcPoint(A,B,t), p2=gcPoint(A,B,Math.min(t+0.012,1));
    let x1=px(p1.lon), y1=py(p1.lat), x2=px(p2.lon), y2=py(p2.lat);
    if(Math.abs(x2-x1)>MAPW/2) x2=x1;
    const ang=Math.atan2(y2-y1,x2-x1)*180/Math.PI;
    const col = f.rev-f.cost>=0 ? "#5fcf95" : "#e2695f";
    return `<g class="plane" transform="translate(${x1.toFixed(1)},${y1.toFixed(1)}) rotate(${ang.toFixed(0)}) scale(${sc})">
      <path d="M0,-3 L7.6,0 L0,3 L2,0 Z" fill="${col}"/>
      <text x="9" y="3" font-family="IBM Plex Mono,monospace" font-size="7" fill="#b7c6d8">${S.code} ${f.no||""}</text></g>`;
  }).join("");
}

let ROUTE_PATHS=[], PLANES=[], animOn=true, wxOn=true, bordOn=true, hoverApt=null, showAllApts=true;
function renderMap(){
  const parts=[]; const MS=mapStyle();
  parts.push(`<defs>
    <radialGradient id="oc" cx="50%" cy="35%"><stop offset="0%" stop-color="${MS.sea0}"/><stop offset="100%" stop-color="${MS.sea1}"/></radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <radialGradient id="wxg"><stop offset="0%" stop-color="#ffffff" stop-opacity=".30"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity=".10"/><stop offset="100%" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
  </defs>`);
  parts.push(`<rect width="${MAPW}" height="${MAPH}" fill="url(#oc)"/>`);
  let g=""; for(let lon=-180;lon<=180;lon+=30) g+=`M${px(lon)},0V${MAPH.toFixed(0)}`;
  for(let lat=-40;lat<=80;lat+=20) g+=`M0,${py(lat).toFixed(1)}H${MAPW}`;
  parts.push(`<path class="grat" fill="none" style="stroke:${MS.grat}" d="${g}"/>
    <path class="grat" fill="none" style="stroke:${MS.equ}" d="M0,${py(0).toFixed(1)}H${MAPW}"/>`);
  /* Landflächen und Staatsgrenzen aus den Naturdaten */
  const ringPath=r=>{ let d="M"; for(let i=0;i<r.length;i+=2){
      d+=(i?"L":"")+px(r[i]).toFixed(1)+","+py(r[i+1]).toFixed(1); } return d; };
  parts.push(`<path class="land" style="fill:${MS.land};stroke:${MS.coast}"
    d="${LAND.map(r=>ringPath(r)+"Z").join("")}"/>`);
  if(bordOn) parts.push(`<path class="bord" fill="none" style="stroke:${MS.border}" d="${BORDERS.map(ringPath).join("")}"/>`);

  /* Wetterzonen */
  if(wxOn && S && S.weather) S.weather.forEach(z=>{
    const rx=z.r*MAPW/360;
    const ry=Math.abs(py(clamp(z.lat+z.r,-84,84))-py(clamp(z.lat-z.r,-84,84)))/2;
    parts.push(`<g class="wx"><ellipse cx="${px(z.lon).toFixed(1)}" cy="${py(z.lat).toFixed(1)}"
      rx="${rx.toFixed(1)}" ry="${ry.toFixed(1)}" fill="${WX_KINDS[z.k].col}" opacity="${(0.10+z.int*0.13).toFixed(2)}"/>
      <ellipse cx="${px(z.lon).toFixed(1)}" cy="${py(z.lat).toFixed(1)}" rx="${rx.toFixed(1)}" ry="${ry.toFixed(1)}"
      fill="none" stroke="${WX_KINDS[z.k].col}" stroke-width="1" stroke-dasharray="4 4" opacity=".45"/>
      <text x="${px(z.lon).toFixed(1)}" y="${(py(z.lat)-ry-3).toFixed(1)}" text-anchor="middle"
      font-family="IBM Plex Mono,monospace" font-size="8" fill="${WX_KINDS[z.k].col}" opacity=".85">${z.name}</text>
      <path d="M${px(z.lon).toFixed(1)},${py(z.lat).toFixed(1)} l${((z.dx||0)*2.4).toFixed(1)},${(-(z.dy||0)*2.4).toFixed(1)}"
      stroke="${WX_KINDS[z.k].col}" stroke-width="1.2" opacity=".7" marker-end=""/></g>`);
  });

  /* Nachtzone und Flughafenlichter */
  if(S){
    parts.push(`<path class="night" d="${nightPath()}" fill="rgba(2,6,18,${MS.night})" style="mix-blend-mode:multiply"/>`);
    APL.forEach(a=>{
      if(a.pax<12) return;
      if(!isNight(a)) return;
      const g=clamp(2+Math.sqrt(a.pax)*0.9,3,13);
      parts.push(`<circle class="night" cx="${px(a.lon).toFixed(1)}" cy="${py(a.lat).toFixed(1)}"
        r="${g.toFixed(1)}" fill="#ffd79a" opacity="${(0.06+Math.min(a.pax,90)/900).toFixed(3)}"/>`);
    });
  }
  ROUTE_PATHS=[];
  if(S) S.routes.forEach(r=>{
    const A=AP[r.from],B=AP[r.to]; if(!A||!B) return;
    const dark=(S.mapStyle||"nacht")!=="tag";
    const c = !r.last||!r.last.ok ? (dark?"#66809c":"#7b8ca0")
      : (r.last.profit>=0 ? (dark?"#5fcf95":"#1f9d55") : (dark?"#e2695f":"#cc3b30"));
    const d = gcPath(A,B); if(!d) return;
    const w = r.last&&r.last.ok ? clamp(0.7+r.last.flights/14,0.8,3.2) : 0.9;
    parts.push(`<path class="rte" fill="none" data-r="${r.key}" data-a="${r.from}" data-b="${r.to}"
      style="stroke:${c};stroke-width:${w.toFixed(2)}" d="${d}"/>`);
    ROUTE_PATHS.push({key:r.key, d, col:c, flights:r.last&&r.last.ok?r.last.flights:0});
  });

  const served=new Set();
  if(S){ S.routes.forEach(r=>{served.add(r.from);served.add(r.to);}); S.bases.forEach(b=>served.add(b)); }
  const rivalHubs=rivalHubSet();
  /* Alle Flughäfen als Punkte: das dichte Netz macht die Welt lesbar.
     Bernstein = eigene Station, Blau = eigenes Ziel, Rot = fremdes Drehkreuz,
     Graublau = unbedient. */
  APL.forEach(a=>{
    const isBase=S&&S.bases.includes(a.iata), isServed=served.has(a.iata);
    const isHub=rivalHubs.has(a.iata);
    if(!showAllApts && !isServed && !isHub && a.pax<3.5) return;
    const rr=clamp(1.1+Math.sqrt(a.pax)*0.42, 1.2, 6.4);
    const f=isBase?"var(--amber)":isServed?"#4aa8e0":isHub?"#d8544a":MS.dot;
    const op=isBase||isServed?1:isHub?0.85:0.62;
    parts.push(`<g class="apt" data-i="${a.iata}" data-hub="${isHub?1:0}">`
      +(isBase?`<circle class="halo" cx="${px(a.lon).toFixed(1)}" cy="${py(a.lat).toFixed(1)}" r="${(rr+3.4).toFixed(1)}"/>`:"")
      +`<circle cx="${px(a.lon).toFixed(1)}" cy="${py(a.lat).toFixed(1)}" r="${(rr+3).toFixed(1)}" fill="transparent"/>`
      +`<circle cx="${px(a.lon).toFixed(1)}" cy="${py(a.lat).toFixed(1)}" r="${rr.toFixed(1)}" fill="${f}" opacity="${op}"
         stroke="${MS.labelStroke}" stroke-opacity=".55" stroke-width=".4"/>`
      +((showLabels||isServed)?`<text class="aptlbl" style="fill:${MS.label};stroke:${MS.labelStroke}" x="${(px(a.lon)+rr+2).toFixed(1)}" y="${(py(a.lat)+2.4).toFixed(1)}">${a.iata}</text>`:"")
      +`</g>`);
  });
  parts.push(`<g id="planes"></g>`);

  const svg=$("#map");
  svg.setAttribute("viewBox",`0 0 ${MAPW} ${MAPH}`);
  svg.innerHTML=`<g id="cam" transform="translate(${view.x},${view.y}) scale(${view.k})">${parts.join("")}</g>`;
  bindMapHover();
  const ph=document.getElementById("planhint");
  if(ph){
    ph.classList.toggle("on", !!PLAN_FROM);
    ph.textContent = PLAN_FROM ? `Ziel wählen · ab ${PLAN_FROM} · Abbrechen` : "";
    ph.onclick=()=>mapPlanCancel();
  }
  buildPlanes();
}
function bindMapHover(){
  $$("#map .apt").forEach(el=>{
    el.addEventListener("click",e=>{e.stopPropagation();
      if(PLAN_FROM) mapPlanTo(el.dataset.i); else showAirport(el.dataset.i);});
    el.addEventListener("mouseenter",()=>highlight(el.dataset.i));
    el.addEventListener("mousemove",e=>{
      const a=AP[el.dataset.i], t=$("#tip"); t.style.display="block";
      const wx=wxAt(a);
      const hc=hubCarriers(a.iata);

      t.style.top=(e.clientY-r.top+12)+"px";

  });
}

/** Hebt das Netz eines Flughafens hervor und blendet den Rest ab. */
function highlight(iata){
  hoverApt=iata;
  const info=$("#mapinfo");

function applyCam(){ const c=document.getElementById("cam");
  if(c) c.setAttribute("transform",`translate(${view.x},${view.y}) scale(${view.k})`); }
(function(){
  const wrap=$("#mapwrap"); let drag=false,sx=0,sy=0,ox=0,oy=0;
  wrap.addEventListener("pointerdown",e=>{drag=true;sx=e.clientX;sy=e.clientY;ox=view.x;oy=view.y;
    wrap.classList.add("drag"); wrap.setPointerCapture(e.pointerId);});
  wrap.addEventListener("pointermove",e=>{ if(!drag)return;
    const s=MAPW/wrap.clientWidth; view.x=ox+(e.clientX-sx)*s; view.y=oy+(e.clientY-sy)*s; applyCam();});
  const stop=()=>{drag=false;wrap.classList.remove("drag");};
  wrap.addEventListener("pointerup",stop); wrap.addEventListener("pointercancel",stop);
  wrap.addEventListener("wheel",e=>{e.preventDefault();
    const r=wrap.getBoundingClientRect(), s=MAPW/r.width;
    zoomAt(e.deltaY<0?1.16:1/1.16,(e.clientX-r.left)*s,(e.clientY-r.top)*s);},{passive:false});
  $$("#maptools [data-z]").forEach(b=>b.addEventListener("click",()=>{
    if(b.dataset.z==="in") zoomAt(1.35,MAPW/2,MAPH/2);
    else if(b.dataset.z==="out") zoomAt(1/1.35,MAPW/2,MAPH/2);
    else { view={x:0,y:0,k:1}; applyCam(); }}));
  $("#btnLbl").addEventListener("click",()=>{showLabels=!showLabels;
    $("#btnLbl").textContent=showLabels?"Codes ausblenden":"Codes einblenden"; renderMap();});
  $("#btnAll").addEventListener("click",()=>{showAllApts=!showAllApts;
    $("#btnAll").textContent=showAllApts?"Nur wichtige Flughäfen":"Alle Flughäfen"; renderMap();});
  $("#btnAnim").addEventListener("click",()=>{animOn=!animOn;
    $("#btnAnim").textContent=animOn?"Flüge anhalten":"Flüge zeigen"; buildPlanes();});
  $("#btnWx").addEventListener("click",()=>{wxOn=!wxOn;
    $("#btnWx").textContent=wxOn?"Wetter aus":"Wetter ein"; renderMap();});
  $("#btnStyle").addEventListener("click",()=>{
    if(!S) return;
    S.mapStyle = S.mapStyle==="tag" ? "nacht" : "tag";
    $("#btnStyle").textContent = S.mapStyle==="tag" ? "Nachtkarte" : "Tageskarte";
    document.body.classList.toggle("lightmap", S.mapStyle==="tag");
    renderMap();});
  const MAPH_STEPS=["34%","52%","68%"]; let mapStep=0;
  const bms=$("#btnMapSize");
  if(bms) bms.addEventListener("click",()=>{
    mapStep=(mapStep+1)%MAPH_STEPS.length;
    document.documentElement.style.setProperty("--maph", MAPH_STEPS[mapStep]);
    bms.textContent = mapStep===2 ? "Karte kleiner" : "Karte grösser";
  });
  const stg=$("#sideToggle");
  if(stg) stg.addEventListener("click",()=>{
    const sd=$("#side"); sd.classList.toggle("hid");
    stg.textContent = sd.classList.contains("hid") ? "⤡" : "⤢";
  });
  $("#btnBord").addEventListener("click",()=>{bordOn=!bordOn;
    $("#btnBord").textContent=bordOn?"Grenzen aus":"Grenzen ein"; renderMap();});
  function zoomAt(f,mx,my){ const nk=clamp(view.k*f,0.8,16), rf=nk/view.k;
    view.x=mx-(mx-view.x)*rf; view.y=my-(my-view.y)*rf; view.k=nk; applyCam(); }
})();
function focusAirport(iata){
  const a=AP[iata]; if(!a) return;
  view.k=Math.max(view.k,3.0);
  view.x=MAPW/2-px(a.lon)*view.k; view.y=MAPH*0.42-py(a.lat)*view.k; applyCam();
}

/** Wachstumsaussicht eines Städtepaars aus Kaufkraft, Geschäft und Tourismus. */
function potential(A,B){
  const inc=(A.income+B.income)/2, biz=(A.biz+B.biz)/2, tour=(A.tourism+B.tourism)/2;
  const size=Math.log10(Math.max(A.pax*B.pax,1));
  const emerging = (inc<0.9 ? 0.35 : 0) + (A.region!==B.region ? 0.12 : 0);
  return clamp(0.30*(biz-1) + 0.42*(tour-1) + emerging + 0.05*(size-2), -0.5, 1.2);
}
function trendIcon(v){
  if(v>0.42) return `<span class="pos" title="starkes Wachstum erwartet">▲▲</span>`;
  if(v>0.16) return `<span class="pos" title="Wachstum erwartet">▲</span>`;
  if(v>-0.06) return `<span class="dim" title="stabil">▬</span>`;
  return `<span class="neg" title="rückläufig">▼</span>`;
}
let ANA_SORT={col:"val", dir:-1};
function analyseDialog(){

      const m=marketDemand(A,B,S.month);
      const fake={key:routeKey(b,B.iata), from:b<B.iata?b:B.iata, to:b<B.iata?B.iata:b,
        comp:competitorBase(A,B), fare:1};
      const rr=(findRoute(b,B.iata)||fake);
      const rl=rivalsOn(rr).map(v=>{const x=rivalById(v.id);
        return {name:x?x.name:v.id, model:x?x.model:"", f:v.flights/7};}).sort((x,y)=>y.f-x.f);
      rows.push({from:b, to:B.iata, city:B.city, country:B.country, d:m.d, daily:m.daily,
        comp:rr.comp/7, served:!!findRoute(b,B.iata), pot:potential(A,B),
        val:m.weekly*baseFare(m.d,"eco"), rivals:rl});});});
  const cols=[
    {k:"pair", t:"Paar",       r:false, v:x=>x.from+x.to},
    {k:"city", t:"Ziel",       r:false, v:x=>x.city},
    {k:"d",    t:"km",         r:true,  v:x=>x.d},
    {k:"daily",t:"Pax/Tag",    r:true,  v:x=>x.daily},
    {k:"comp", t:"Konkurrenz", r:true,  v:x=>x.comp},
    {k:"pot",  t:"Trend",      r:true,  v:x=>x.pot},
    {k:"val",  t:"Markt/Wo",   r:true,  v:x=>x.val}
  ];
  const draw=()=>{
    const c=cols.find(y=>y.k===ANA_SORT.col)||cols[6];
    const sorted=[...rows].sort((a,b)=>{
      const va=c.v(a), vb=c.v(b);
      if(typeof va==="string") return ANA_SORT.dir*va.localeCompare(vb);
      return ANA_SORT.dir*(va-vb);
    }).slice(0,90);
    $("#anal").innerHTML=`<table class="tbl"><tr>${cols.map(y=>
      `<th class="${y.r?"r":""}" data-c="${y.k}" style="cursor:pointer;user-select:none">${y.t}${
        ANA_SORT.col===y.k?(ANA_SORT.dir<0?" ▾":" ▴"):""}</th>`).join("")}</tr>
      ${sorted.map(x=>`<tr${x.served?' style="opacity:.55"':''}>
        <td>${x.from}–${x.to}</td>
        <td>${esc(x.city)}${x.served?" ✓":""}<br><span class="dim" style="font-size:10px">${
          x.rivals.length?x.rivals.slice(0,3).map(v=>esc(v.name)+" "+fmt(v.f,1)).join(" · "):"keine bekannte Konkurrenz"}</span></td>
        <td class="r">${fmt(x.d)}</td><td class="r">${fmt(x.daily,0)}</td>
        <td class="r">${fmt(x.comp,1)}</td><td class="r">${trendIcon(x.pot)}</td>
        <td class="r">${chf(x.val)}</td></tr>`).join("")}</table>`;
    $("#anal").querySelectorAll("th[data-c]").forEach(th=>th.onclick=()=>{
      const k=th.dataset.c;
      if(ANA_SORT.col===k) ANA_SORT.dir*=-1; else { ANA_SORT.col=k; ANA_SORT.dir=(k==="pair"||k==="city")?1:-1; }
      draw();});
  };
  modal("Marktanalyse",
    `<p class="dim">Nachfrage pro Tag über alle Anbieter, beide Richtungen zusammen. Unter dem Zielnamen stehen die Gesellschaften, die dort tatsächlich fliegen, mit Flügen pro Tag. Spaltenköpfe sind sortierbar.</p>
     <p class="dim" style="font-size:11px">Trend: ▲▲ starkes Wachstum, ▲ Wachstum, ▬ stabil, ▼ rückläufig — abgeleitet aus Kaufkraft, Geschäfts- und Tourismusindex.</p>
     <div id="anal" style="max-height:60vh;overflow:auto"></div>`);
  draw();
}

function timelineHTML(ac, day){

  const legs = day==null ? sch.legs : sch.week[day].legs;
  const base=AP[day==null?ac.base:sch.pos[day]] || AP[ac.base];
  const cf=curfewOf(base);
  let bars="";
  if(cf){
    const seg=(s0,e0)=>{ s0=clamp(s0,0,span); e0=clamp(e0,0,span);
      if(e0>s0) bars+=`<div class="cf" style="left:${(s0/span*100).toFixed(2)}%;width:${((e0-s0)/span*100).toFixed(2)}%"></div>`; };
    if(cf[0]<cf[1]){ seg(cf[0],cf[1]); seg(cf[0]+1440,cf[1]+1440); }
    else { seg(0,cf[1]); seg(cf[0],1440+cf[1]); }
  }
  for(let hh=0;hh<=27;hh+=3) bars+=`<div class="hr" style="left:${(hh*60/span*100).toFixed(2)}%"></div>`;
  const cols=["#f2a93b","#4aa8e0","#5fcf95","#9b8cf0","#e2695f","#e0c33a","#2aa8c4"];
  legs.forEach((l,i)=>{

    bars+=`<div class="lg" title="${l.from}–${l.to} ${hhmmD(l.dep)}–${hhmmD(l.arr)}"
      style="left:${(clamp(l.dep,0,span)/span*100).toFixed(2)}%;width:${(Math.min(l.block,span-l.dep)/span*100).toFixed(2)}%;
      background:${bad?"#e2695f":cols[i%cols.length]}">${l.block/span*100>6?l.to:""}</div>`;
  });
  return `<div class="tl">${bars}</div>
    <div class="tlx"><span>00</span><span>06</span><span>12</span><span>18</span><span>24</span><span>27</span></div>`;
}

/** Entfernt defizitäre oder gesperrte Flüge und schliesst den Umlauf wieder. */
function trimPlan(id){
  const ac=S.fleet.find(x=>x.id===id); if(!ac) return;
  const p=ensurePlan(ac);
  let dropped=0;
  for(let d=0;d<7;d++){
    const sch=scheduleOf(ac), legs=sch.week[d].legs;
    const drop=new Set();
    legs.forEach(l=>{
      if(l.issues.length) drop.add(l.i);
      const st=LEGSTATS[legKey(ac.id,d,l.i)];
      if(st && st.profit<0) drop.add(l.i);
    });
    if(!drop.size) continue;
    const w=p.week[d], dests=[], nums=[];
    w.dests.forEach((x,i)=>{ if(!drop.has(i)){ dests.push(x); nums.push(w.nums[i]); } });
    w.dests=dests; w.nums=nums; dropped+=drop.size;
  }
  if(!dropped){ toast("Alle Flüge tragen sich — nichts zu streichen."); return; }
  ensurePlan(ac);
  logg(`${ac.reg}: ${dropped} Flüge aus dem Wochenplan gestrichen.`,"warn");
  render();
}

      $("#plist").innerHTML=cand.map(x=>{

        w.dests.push(c.dataset.i); ensurePlan(ac); draw(); });
    };
    $("#pq").oninput=fillList; fillList();

  /** Füllt einen Tag mit ertragreichen Zielen, ohne die Grenzen zu sprengen. */
  function autoFill(ac, d){
    const t=ACT[ac.type], p=ensurePlan(ac), w=p.week[d];
    let guard=0;
    while(guard++<12){
      const sch=scheduleOf(ac), dayS=sch.week[d];
      const last = dayS.legs.length ? dayS.legs[dayS.legs.length-1].to : sch.pos[d];
      const from=AP[last];
      let best=null;
      reachable(last).slice(0,14).forEach(x=>{
        const bm=blockMinutes(t,x.m.d);
        const dep = dayS.legs.length ? dayS.legs[dayS.legs.length-1].arr+turnAt(t,last) : w.start;
        const arr=dep+bm;
        const home=distKm(x.B, AP[ac.base]);
        const back=blockMinutes(t,home);
        const needBack = x.B.iata===ac.base ? 0 : back;
        if(dayS.blockSum+bm+needBack > t.block*60) return;
        if(arr + (needBack?turnAt(t,x.B.iata)+needBack:0) - w.start > BAL.maxDuty) return;
        if(inCurfew(from,dep)||inCurfew(x.B,arr)) return;
        const score=x.m.daily/(bm/60);
        if(!best||score>best.score) best={x,score};
      });
      if(!best) break;
      w.dests.push(best.x.B.iata); ensurePlan(ac);
      if(best.x.B.iata!==ac.base){
        const s2=scheduleOf(ac).week[d];
        const l=s2.legs[s2.legs.length-1];
        const backM=blockMinutes(t,distKm(AP[l.to],AP[ac.base]));
        if(!inCurfew(AP[l.to],l.arr+turnAt(t,l.to)) && !inCurfew(AP[ac.base],l.arr+turnAt(t,l.to)+backM)){
          w.dests.push(ac.base); ensurePlan(ac);
        } else { w.dests.pop(); w.nums.pop(); break; }
      }
    }
  }
  draw();
}

        <span class="dim">(Frachtraum ${fmt(cargoCap({type:ac.type, combi}),1)} t)</span></label>

      if(ac.wifi){ toast("Bereits eingebaut."); return; }

      $("#mBody").innerHTML=body(); wire(); };
    ["biz","prem","first"].forEach(k=>{ const el=$("#r_"+k); if(!el) return;

            toast(`In diesem Szenario dürfen höchstens ${fmt(lim*100,0)}% der Sitze Economy sein.`);
            return; } }
        if(combi!==(ac.combi||0)){ ac.combi=combi; }
        if(JSON.stringify(cab)!==before){
          const c=t.price*1e6*0.012;
          if(S.cash<c){toast("Zu wenig Liquidität.");return;}
          S.cash-=c; ac.cab=cab; delete ac.layout;
          const s3=seatsOf(ac);
          logg(`${ac.reg} umgebaut: ${s3.eco} Eco${s3.prem?", "+s3.prem+" Prem":""}${s3.biz?", "+s3.biz+" Biz":""}${s3.first?", "+s3.first+" First":""}.`,"");
        }
        $("#veil").classList.remove("on"); render();}}]);
  wire();
}

function sellAircraft(id,lease){
  const ac=S.fleet.find(x=>x.id===id);
  const v = lease ? -ACT[ac.type].price*1e6*0.02 : acValue(ac)*0.93;
  S.cash+=v; S.fleet=S.fleet.filter(x=>x.id!==ac.id);
  logg(lease?`${ac.reg} an den Leasinggeber zurückgegeben.`:`${ac.reg} für ${chf(v)} CHF verkauft.`,"");
  render();
}

function portfolioValue(){
  let v=0; Object.keys(S.holdings||{}).forEach(id=>{ const x=rivalById(id);
    if(x) v+=rivalValue(x)*holdings(id); });
  return v;
}
function creditLimit(){
  const earn=S.history.slice(-6).reduce((s,h)=>s+Math.max(0,h.profit),0);
  return Math.max(30e6, fleetValue()*0.62+earn*4);
}
/* ================================================ Kleine Infografiken ====
   Zahlen sind schneller zu erfassen, wenn sie eine Form haben. */
function donut(pct, size, label, col){
  const r=size/2-3.5, c=2*Math.PI*r, v=clamp(pct,0,1);
  const color=col||(v>0.88?"#e0c33a":v>0.62?"#5fcf95":v>0.45?"#e0a13a":"#e2695f");
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" class="donut">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="rgba(140,170,200,.18)" stroke-width="4"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="4"
      stroke-linecap="round" stroke-dasharray="${(c*v).toFixed(1)} ${c.toFixed(1)}"
      transform="rotate(-90 ${size/2} ${size/2})"/>
    <text x="${size/2}" y="${(size/2+size*0.11).toFixed(1)}" text-anchor="middle"
      font-family="IBM Plex Mono,monospace" font-size="${(size*0.30).toFixed(1)}"
      fill="currentColor">${label!=null?label:fmt(v*100,0)}</text></svg>`;
}
/** Gestapelter Balken für Marktanteile. */
function stackBar(parts, h){
  const tot=parts.reduce((a,x)=>a+x.v,0)||1;
  return `<div class="stack" style="height:${h||10}px">${parts.map(x=>
    `<i style="width:${(x.v/tot*100).toFixed(2)}%;background:${x.c}" title="${esc(x.n||"")}"></i>`).join("")}</div>`;
}
function stackLegend(parts){
  const tot=parts.reduce((a,x)=>a+x.v,0)||1;
  return `<div class="slg">${parts.map(x=>
    `<span><i style="background:${x.c}"></i>${esc(x.n||"")} ${fmt(x.v/tot*100,1)}%</span>`).join("")}</div>`;
}

function sparkline(){
  const h=S.history.slice(-24); if(h.length<2) return "";
  const W=360, H=76, pad=6;
  const vals=h.map(x=>x.profit);
  const mn=Math.min(0,...vals), mx=Math.max(0,...vals), rg=(mx-mn)||1;
  const X=i=>pad+i*(W-2*pad)/(h.length-1);
  const Y=v=>H-pad-((v-mn)/rg)*(H-2*pad);
  const pts=vals.map((v,i)=>X(i).toFixed(1)+","+Y(v).toFixed(1));
  const line="M"+pts.join("L");
  const area=line+"L"+X(h.length-1).toFixed(1)+","+Y(mn).toFixed(1)+"L"+X(0).toFixed(1)+","+Y(mn).toFixed(1)+"Z";
  const last=vals[vals.length-1];
  const col=last>=0?"#5fcf95":"#e2695f";
  const id="sp"+Math.random().toString(36).slice(2,7);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none" style="display:block">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${col}" stop-opacity=".38"/>
      <stop offset="100%" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
    <line x1="${pad}" y1="${Y(0).toFixed(1)}" x2="${W-pad}" y2="${Y(0).toFixed(1)}"
      stroke="rgba(140,170,200,.28)" stroke-width="1" stroke-dasharray="3 3"/>
    <path d="${area}" fill="url(#${id})"/>
    <path d="${line}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${X(h.length-1).toFixed(1)}" cy="${Y(last).toFixed(1)}" r="3.4" fill="${col}"/>
  </svg>
  <div class="row" style="justify-content:space-between;font-size:10px;color:var(--dim);margin-top:3px">
    <span>${String(h[0].m+1).padStart(2,"0")}/${h[0].y}</span>
    <span class="${cls(last)}">${sgn(last)}</span>
    <span>${String(h[h.length-1].m+1).padStart(2,"0")}/${h[h.length-1].y}</span></div>`;
}

      [{t:"Abbrechen",f:()=>$("#veil").classList.remove("on")},
       {t:"Tilgen",p:true,f:()=>{const a=(+$("#amt").value||0)*1e6;
          if(a<=0||a>S.debt||a>S.cash){toast("Betrag nicht möglich.");return;}
          S.cash-=a; S.debt-=a; logg(`${chf(a)} CHF getilgt.`,"good");
          $("#veil").classList.remove("on"); render();}}]);};

function portfolioValue(){
  let v=0; Object.keys(S.holdings||{}).forEach(id=>{ const x=rivalById(id);
    if(x) v+=rivalValue(x)*holdings(id); });
  return v;
}
function creditLimit(){
  const earn=S.history.slice(-6).reduce((s,h)=>s+Math.max(0,h.profit),0);
  return Math.max(30e6, fleetValue()*0.62+earn*4);
}
function sparkline(){
  const hs=S.history.slice(-24); if(hs.length<2) return "";
  const W=380,H=70,pad=4, vals=hs.map(x=>x.profit);
  const mn=Math.min(0,...vals), mx=Math.max(0,...vals), rg=(mx-mn)||1;
  const pts=vals.map((v,i)=>[pad+i*(W-2*pad)/(vals.length-1), H-pad-((v-mn)/rg)*(H-2*pad)]);
  const zero=H-pad-((0-mn)/rg)*(H-2*pad);
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:70px">
    <line x1="0" y1="${zero}" x2="${W}" y2="${zero}" stroke="#2b415e"/>
    <polyline fill="none" stroke="var(--amber)" stroke-width="1.6"
      points="${pts.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ")}"/>
    ${pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="1.6" fill="var(--amber)"/>`).join("")}
  </svg><div class="dim mono" style="font-size:10px;text-align:right">Monatsergebnis, letzte ${hs.length} Monate</div>`;
}

function charterDialog(jobId){
  const j=(S.charterJobs||[]).find(x=>x.id===jobId); if(!j) return;
  const A=AP[j.from], B=AP[j.to];
  const fit=S.fleet.filter(ac=>{
    const t=ACT[ac.type], s=seatsOf(ac);
    return ac.status==="aktiv" && s.total>=j.pax && !acCanFly(ac,A,B)
      && !charterBusy(ac.id);
  });
  let sel=null;
  const body=()=>fit.map(ac=>`<div class="choice ${sel===ac.id?'on':''}" data-a="${ac.id}">
      <div><div class="t">${ac.reg} · ${esc(ACT[ac.type].name)}</div>
        <div class="d">${seatsOf(ac).total} Sitze · Basis ${ac.base} · fällt ${j.days} Tage aus dem Linienplan</div></div>
      <div class="mono">${fmt(j.days,0)} Tage</div></div>`).join("")
    || `<div class="dim" style="padding:10px">Kein passendes Flugzeug — zu wenig Sitze, Reichweite oder Piste, oder bereits im Charter.</div>`;
  modal(`Charter: ${j.title}`,
    `<p class="dim">${esc(j.desc)} · ${j.from} → ${j.to} · ${fmt(j.dist)} km · ${j.pax} Passagiere · ${chf(j.pay)} CHF</p>
     <label class="f">Flugzeug zuteilen</label><div id="chl">${body()}</div>`,
    [{t:"Abbrechen",f:()=>$("#veil").classList.remove("on")},
     {t:"Auftrag annehmen",p:true,f:()=>{ if(!sel){toast("Bitte ein Flugzeug wählen.");return;}
        $("#veil").classList.remove("on"); acceptCharter(jobId,sel);}}]);
  $("#chl").onclick=e=>{const c=e.target.closest(".choice"); if(!c)return;
    sel=c.dataset.a; $("#chl").innerHTML=body();};
}

    container.querySelectorAll("#tl button").forEach(b=>b.onclick=()=>{
      L.tail=b.dataset.t; L.tailImg=null; L.tailImgManuell=true; upd();});
    container.querySelectorAll("#st button").forEach(b=>b.onclick=()=>{L.stripe=b.dataset.s;upd();});

    container.querySelectorAll("#ti button").forEach(b=>b.onclick=()=>{L.titles=b.dataset.i;upd();});

/* Freier Editor: Ebenen per Zeigegerät auf dem Rumpf platzieren. */
function brandFree(box){
  S.livery.layers=S.livery.layers||[];
  const types=Array.from(new Set(S.fleet.map(a=>a.type)));
  S.editType = types.includes(S.editType) ? S.editType : (types[0]||"a20n");
  const L=S.livery;
  const draw=()=>{

    box.innerHTML=`
      <div class="row" style="margin-bottom:7px">
        <label class="f" style="margin:0">Muster</label>
        <select id="etype" style="width:auto;flex:1">${(types.length?types:["at72","a20n","b789","a359"]).map(t=>
          `<option value="${t}" ${t===S.editType?"selected":""}>${esc(ACT[t].name)}</option>`).join("")}</select></div>
