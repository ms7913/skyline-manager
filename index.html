<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#080e1a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Skyline">
<meta name="description" content="Skyline Manager — Airline-Simulation in Echtzeit">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>SKYLINE MANAGER — Airline-Simulation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080e1a; --bg2:#0c1524; --panel:#101a2d; --panel2:#152238;
  --line:#203148; --line2:#2b415e;
  --txt:#dfe7f2; --dim:#8598b2; --dim2:#5d7089;
  --amber:#f2a93b; --amber-d:#8a5f18;
  --blue:#4aa8e0; --green:#5fcf95; --red:#e2695f;
  --r:4px;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --disp:"Barlow Condensed","Helvetica Neue Condensed",Impact,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--body);font-size:13px;
  line-height:1.45;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:12px;color:var(--txt);background:var(--panel2);
  border:1px solid var(--line2);border-radius:var(--r);padding:6px 11px;cursor:pointer;transition:.12s}
button:hover:not(:disabled){background:#1c2f4c;border-color:var(--amber-d)}
button:disabled{opacity:.35;cursor:not-allowed}
button.primary{background:var(--amber);color:#0d1119;border-color:var(--amber);font-weight:600}
button.primary:hover:not(:disabled){filter:brightness(1.12)}
button.sm{padding:3px 8px;font-size:11px}
button.ghost{background:transparent}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
select,input[type=text],input[type=number],input[type=time],textarea{font-family:var(--mono);font-size:12px;
  background:#0a1322;color:var(--txt);border:1px solid var(--line2);border-radius:var(--r);padding:5px 7px;width:100%}
input.tiny{width:70px;padding:3px 6px;text-align:right}
input[type=range]{width:100%;accent-color:var(--amber)}
input[type=color]{width:100%;height:32px;padding:2px;background:#0a1322;border:1px solid var(--line2);border-radius:var(--r);cursor:pointer}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.dim{color:var(--dim)} .pos{color:var(--green)} .neg{color:var(--red)} .amb{color:var(--amber)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:#22374f;border-radius:5px}

#top{height:54px;display:flex;align-items:stretch;background:linear-gradient(180deg,#0e1a2c,#080f1c);
  border-bottom:1px solid var(--line2)}
#brand{display:flex;align-items:center;gap:10px;padding:0 15px;border-right:1px solid var(--line)}
#brandMark{width:30px;height:30px;flex:0 0 30px}
#brand h1{font-family:var(--disp);font-size:20px;letter-spacing:.13em;margin:0;font-weight:600;
  text-transform:uppercase;white-space:nowrap}
#brand h1 small{display:block;font-size:9px;letter-spacing:.28em;color:var(--dim2);font-weight:500}
.hstat{padding:0 12px;display:flex;flex-direction:column;justify-content:center;
  border-right:1px solid var(--line);min-width:90px}
.hstat b{font-family:var(--mono);font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.hstat span{font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--dim2)}
#clockbox{margin-left:auto;display:flex;align-items:center;gap:8px;padding:0 13px}
#datebox{font-family:var(--mono);font-size:13px;line-height:1.25;letter-spacing:.06em;color:var(--amber);
  background:#060c16;border:1px solid var(--line2);padding:4px 11px;border-radius:var(--r);text-align:right;white-space:nowrap}
#datebox small{display:block;font-size:10px;color:var(--dim);letter-spacing:.14em}
#speedctl{display:flex;gap:2px}
#speedctl button{padding:6px 9px;font-family:var(--mono);font-size:12px;min-width:36px}
#speedctl button.on{background:var(--amber);color:#0d1119;border-color:var(--amber);font-weight:600}
#speedctl #btnJump{min-width:44px;color:var(--blue);border-color:var(--line2)}
#speedctl #btnJump.busy{background:var(--blue);color:#0d1119}
#speedctl select{padding:5px 6px;font-size:11px;width:auto;min-width:112px}
#nextEv{font-family:var(--mono);font-size:10px;color:var(--dim2);text-align:right;
  width:100%;margin-top:3px;letter-spacing:.04em}
#ticker{position:absolute;right:12px;top:12px;width:260px;max-height:42%;overflow:hidden;
  background:rgba(8,14,26,.9);border:1px solid var(--line2);border-radius:var(--r);
  padding:7px 9px;font-family:var(--mono);font-size:10.5px;backdrop-filter:blur(3px)}
#ticker h5{margin:0 0 5px;font-family:var(--disp);font-size:12px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--amber);font-weight:600}
#ticker .tk{display:flex;gap:6px;padding:2px 0;border-bottom:1px solid #16243a;color:var(--dim)}
#ticker .tk b{color:var(--txt);font-weight:500}
#ticker .tk.dep{border-left:2px solid var(--blue);padding-left:5px}
#ticker .tk.arr{border-left:2px solid var(--green);padding-left:5px}
.night{pointer-events:none}

#app{display:flex;height:calc(100% - 54px)}
#stage{flex:1;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 0%,#122140 0%,#080e1a 62%)}
#side{width:460px;flex:0 0 460px;border-left:1px solid var(--line2);background:var(--panel);display:flex;flex-direction:column}
@media(max-width:1220px){#side{width:380px;flex-basis:380px}}
@media(max-width:880px){
  #stage{position:absolute;inset:0 0 var(--sideh,56%) 0;height:auto;min-height:140px}
  #side{position:absolute;left:0;right:0;bottom:0;top:auto;height:var(--sideh,56%);width:auto;
    border-radius:14px 14px 0 0;padding-bottom:0}
  #sideToggle{display:none}
  #tabs{order:2;position:sticky;bottom:0;z-index:5;border-bottom:none;
    border-top:1px solid var(--line2);background:rgba(9,15,26,.94);
    flex-wrap:nowrap;padding:2px 2px calc(2px + env(safe-area-inset-bottom))}
  #tabs button{flex:1 1 0;min-width:0;border-radius:0;font-size:9.5px;letter-spacing:.04em;
    padding:7px 2px;display:flex;flex-direction:column;align-items:center;gap:2px}
  #tabs button .ic{font-size:16px;line-height:1}
  #tabs button.on{background:transparent;color:var(--amber);border-bottom:none}
  #tabs button.on .ic{transform:translateY(-1px)}
  #side{display:flex;flex-direction:column}
  #pane{order:1;flex:1}
  .fleetgrid{grid-template-columns:1fr}
  #brand h1{font-size:16px}
  #top{height:auto;min-height:52px;flex-wrap:wrap;padding-top:env(safe-area-inset-top)}
  .hstat{min-width:0;flex:1 1 22%;padding:2px 6px;border-right:1px solid var(--line);border-top:1px solid var(--line)}
  .hstat b{font-size:12.5px} .hstat span{font-size:8px;letter-spacing:.1em}
  #brand{flex:1 1 100%;border-right:none;padding:6px 12px}
  #clockbox{flex:1 1 100%;justify-content:space-between;padding:4px 12px 6px}
  #ticker{display:none}
  #sheetlist .choice{padding:11px 10px}
  #legend{font-size:9px;padding:6px 8px;max-width:44%}
  #maptools{gap:4px;left:8px;bottom:8px}
  #maptools button{padding:7px 9px;font-size:11px}
  #tabs button{font-size:12.5px;padding:9px 8px;min-width:58px}
  #pane{padding:11px;padding-bottom:calc(14px + env(safe-area-inset-bottom))}
  button{min-height:34px} button.sm{min-height:30px}
  select,input[type=text],input[type=number],input[type=time],textarea{font-size:16px;padding:8px}
  #modal{max-height:94vh}
  #modal .mf button{flex:1 1 auto}
  .grid3{grid-template-columns:repeat(2,1fr)}
  table.tbl{font-size:10.5px} table.tbl td,table.tbl th{padding:4px 4px}
}
@media(max-width:880px) and (orientation:landscape){
  #app{flex-direction:row} #stage{height:auto;flex:1}
  #side{width:52%;flex:0 0 52%;border-top:none;border-left:1px solid var(--line2)}
}
#mapsize{position:absolute;right:12px;top:12px;display:none}
@media(max-width:880px){#mapsize{display:block}}
#mapwrap{position:absolute;inset:0;cursor:grab}
#mapwrap.drag{cursor:grabbing}
#map{width:100%;height:100%;display:block;touch-action:none}
.land{fill:#1e2c3f;stroke:#3a5170;stroke-width:.6;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.bord{fill:none;stroke-width:.5;vector-effect:non-scaling-stroke}
.apt.dim1{opacity:.25}
.rte.dim1{opacity:.10}
.rte.hi{stroke-width:2.1;opacity:1}
.wx{pointer-events:none}
.plane{pointer-events:none}
body.lightmap #mapinfo,body.lightmap #tip,body.lightmap #legend,body.lightmap #ticker{background:rgba(252,251,248,.94);color:#22303f;border-color:#c9c0ae}
body.lightmap #tip span,body.lightmap #legend div,body.lightmap #ticker .tk{color:#5a6a7a}
body.lightmap #ticker .tk b{color:#22303f}
body.lightmap #maptools button{background:rgba(252,251,248,.92);color:#22303f;border-color:#c9c0ae}
body.lightmap #mapinfo h4{color:#a8620d}
#planhint{position:absolute;left:50%;top:12px;transform:translateX(-50%);display:none;
  background:rgba(242,169,59,.94);color:#0d1119;border-radius:var(--r);padding:7px 13px;
  font-family:var(--disp);font-size:13px;letter-spacing:.08em;text-transform:uppercase;
  box-shadow:0 6px 20px rgba(0,0,0,.45);z-index:7;cursor:pointer}
#planhint.on{display:block}
#mapinfo{position:absolute;left:12px;top:12px;background:rgba(8,14,26,.92);border:1px solid var(--line2);
  border-radius:var(--r);padding:9px 12px;font-size:11px;max-width:270px;backdrop-filter:blur(3px);display:none}
#mapinfo h4{margin:0 0 5px;font-family:var(--disp);font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--amber)}
#mapinfo .l{font-family:var(--mono);font-size:10.5px;color:var(--dim);display:flex;justify-content:space-between;gap:10px}
.grat{stroke:#152743;stroke-width:.5;fill:none;vector-effect:non-scaling-stroke}
.apt{cursor:pointer}
.apt .halo{fill:none;stroke:var(--amber);stroke-width:1.2;vector-effect:non-scaling-stroke;opacity:.85}
.aptlbl{font-family:var(--mono);font-size:7px;paint-order:stroke;
  stroke-width:2px;pointer-events:none;letter-spacing:.04em}
.rte{fill:none;stroke-width:1.1;vector-effect:non-scaling-stroke;opacity:.9;stroke-linecap:round}
#maptools{position:absolute;left:12px;bottom:12px;display:flex;gap:5px;flex-wrap:wrap;max-width:calc(100% - 24px)}
#maptools button{background:rgba(8,14,26,.9);backdrop-filter:blur(3px)}
#legend{position:absolute;right:12px;bottom:12px;background:rgba(8,14,26,.9);border:1px solid var(--line);
  border-radius:var(--r);padding:8px 10px;font-size:10px;color:var(--dim);backdrop-filter:blur(3px)}
#legend i{display:inline-block;width:14px;height:2px;vertical-align:middle;margin-right:6px}
#tip{position:absolute;pointer-events:none;background:#060c16;border:1px solid var(--amber-d);
  border-radius:var(--r);padding:6px 9px;font-family:var(--mono);font-size:11px;display:none;z-index:5;
  white-space:nowrap;box-shadow:0 6px 20px rgba(0,0,0,.6)}

#tabs{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--line2);background:rgba(9,15,26,.55);
  padding:2px 2px 0;gap:1px}
#tabs button{border:none;border-radius:3px 3px 0 0;background:transparent;padding:8px 10px;font-family:var(--disp);
  font-size:13.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);flex:1 1 auto;
  border-bottom:2px solid transparent;white-space:nowrap;min-width:66px}
#tabs button .badge{display:inline-block;min-width:16px;height:16px;line-height:16px;
  padding:0 4px;margin-left:5px;border-radius:9px;background:var(--red);color:#fff;
  font-family:var(--mono);font-size:10px;font-weight:600;text-align:center;vertical-align:middle}
#tabs button.on .badge{background:var(--red)}
@media(max-width:880px){
  #tabs button .ic{position:relative}
  #tabs button .badge{position:absolute;top:-5px;left:9px;margin:0;font-size:9px;
    min-width:14px;height:14px;line-height:14px}
}
.mailrow{display:flex;gap:9px;align-items:flex-start;padding:9px 10px;border-bottom:1px solid var(--line);
  cursor:pointer;transition:background .15s}
.mailrow:hover{background:#16243a}
.mailrow.un{background:rgba(74,168,224,.07)}
.mailrow.un .ms{font-weight:600;color:var(--txt)}
.mailrow .mi{flex:0 0 22px;text-align:center;font-size:14px}
.mailrow .ms{flex:1;font-size:12.5px;color:var(--dim)}
.mailrow .mp{font-size:10.5px;color:var(--dim2);margin-top:2px}
.mailrow .md{font-family:var(--mono);font-size:9.5px;color:var(--dim2);white-space:nowrap}
.undot{width:7px;height:7px;border-radius:50%;background:var(--blue);display:inline-block;margin-right:5px}
#tabs button .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--red);
  margin-left:4px;vertical-align:middle}
#tabs button:hover{background:#122240;color:var(--txt)}
#tabs button.on{color:var(--amber);border-bottom-color:var(--amber);background:#0e1a2c}
#pane{flex:1;overflow-y:auto;padding:14px}

h2.sec{font-family:var(--disp);font-size:15px;letter-spacing:.14em;text-transform:uppercase;margin:0 0 9px;
  color:var(--amber);font-weight:600;display:flex;align-items:center;gap:8px}
h2.sec::after{content:"";flex:1;height:1px;background:var(--line2)}
h3.sub{font-family:var(--disp);font-size:13px;letter-spacing:.13em;text-transform:uppercase;margin:16px 0 7px;
  color:var(--dim);font-weight:600}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin-bottom:9px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:2.5px 0;font-size:12px}
.kv span:first-child{color:var(--dim)}
.kv span:last-child{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.tile{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px}
.tile b{display:block;font-family:var(--mono);font-size:15px;font-variant-numeric:tabular-nums}
.tile span{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim2)}
.empty{border:1px dashed var(--line2);border-radius:var(--r);padding:20px 14px;text-align:center;color:var(--dim)}
.empty b{display:block;font-family:var(--disp);font-size:16px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--txt);margin-bottom:5px}
.row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.pill{font-family:var(--mono);font-size:10px;padding:1.5px 6px;border:1px solid var(--line2);border-radius:20px;
  color:var(--dim);white-space:nowrap}
.pill.ok{color:var(--green);border-color:#2c5a42}
.pill.warn{color:var(--amber);border-color:var(--amber-d)}
.pill.bad{color:var(--red);border-color:#63302c}
.bar{height:6px;background:#0a1322;border-radius:3px;overflow:hidden;margin-top:4px;display:flex}
.bar i{display:block;height:100%;background:var(--amber)}
label.f{display:block;margin:8px 0 3px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim2)}

.strip{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--amber);
  border-radius:0 var(--r) var(--r) 0;padding:9px 11px;margin-bottom:7px;cursor:pointer}
.strip:hover{background:#192943}
.strip.loss{border-left-color:var(--red)}
.strip .hdr{display:flex;align-items:baseline;gap:8px;font-family:var(--mono);font-size:14px;letter-spacing:.06em}
.strip .hdr em{font-style:normal;color:var(--dim2)}
.strip .meta{display:flex;gap:11px;flex-wrap:wrap;font-family:var(--mono);font-size:10.5px;color:var(--dim);margin-top:4px}

table.tbl{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:11.5px;font-variant-numeric:tabular-nums}
table.tbl th{text-align:left;font-family:var(--body);font-size:9px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--dim2);font-weight:600;padding:5px 6px;border-bottom:1px solid var(--line2)}
table.tbl td{padding:5px 6px;border-bottom:1px solid #16243a}
table.tbl tr:hover td{background:#152238}
table.tbl th.r,table.tbl td.r{text-align:right}

.planebox{background:linear-gradient(180deg,#33465f 0%,#25364c 55%,#1b2a3c 100%);border:1px solid var(--line);border-radius:var(--r);
  padding:2px 4px;margin-bottom:8px;overflow:hidden}
.planebox svg{display:block;width:100%;height:auto}

/* Tagesband */
.tl{position:relative;height:28px;background:#0a1322;border:1px solid var(--line2);border-radius:3px;overflow:hidden;margin-top:5px}
.tl .cf{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(45deg,#3a1d1d,#3a1d1d 4px,#2a1616 4px,#2a1616 8px)}
.tl .lg{position:absolute;top:4px;height:20px;border-radius:2px;display:flex;align-items:center;
  justify-content:center;font-family:var(--mono);font-size:9px;color:#0d1119;overflow:hidden;white-space:nowrap}
.tl .hr{position:absolute;top:0;bottom:0;width:1px;background:#1b2c44}
.tlx{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9px;color:var(--dim2);margin-top:2px}
.legrow{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:4px 0;
  border-bottom:1px solid #16243a;font-family:var(--mono);font-size:11.5px}
.daysel{display:flex;gap:3px}
.daysel button{padding:3px 0;width:30px;text-align:center;font-family:var(--mono);font-size:10.5px}
.daysel button.on{background:var(--amber);color:#0d1119;border-color:var(--amber);font-weight:600}
.wk{margin:6px 0}
.wkrow{display:flex;align-items:center;gap:7px;padding:2px 4px;border-radius:3px;cursor:pointer}
.wkrow:hover{background:#16243a}
.wkrow.on{background:#1b2e4b;outline:1px solid var(--amber)}
.wkd{font-family:var(--mono);font-size:10.5px;width:20px;color:var(--dim)}
.wkp{font-family:var(--mono);font-size:10px;width:30px;color:var(--dim2)}
.wkh{font-family:var(--mono);font-size:10px;width:38px;text-align:right;color:var(--dim)}

#log{font-family:var(--mono);font-size:11px}
#log .e{padding:6px 8px;border-left:2px solid var(--line2);margin-bottom:5px;background:#0d1728}
#log .e.good{border-left-color:var(--green)}
#log .e.bad{border-left-color:var(--red)}
#log .e.warn{border-left-color:var(--amber)}
#log .e time{color:var(--dim2);margin-right:8px}

#veil{position:fixed;inset:0;background:rgba(3,7,14,.86);display:none;z-index:40;align-items:center;
  justify-content:center;padding:16px;backdrop-filter:blur(2px)}
#veil.on{display:flex}
#modal{background:var(--panel);border:1px solid var(--line2);border-radius:var(--r);max-width:720px;width:100%;
  max-height:92vh;overflow-y:auto;box-shadow:0 24px 60px rgba(0,0,0,.7)}
#modal .mh{padding:13px 16px;border-bottom:1px solid var(--line2);display:flex;align-items:center;
  justify-content:space-between;position:sticky;top:0;background:var(--panel);z-index:1}
#modal .mh h3{font-family:var(--disp);font-size:17px;letter-spacing:.13em;text-transform:uppercase;margin:0;
  color:var(--amber);font-weight:600}
#modal .mb{padding:16px}
#modal .mf{padding:12px 16px;border-top:1px solid var(--line2);display:flex;gap:8px;justify-content:flex-end;
  position:sticky;bottom:0;background:var(--panel);flex-wrap:wrap}
.choice{border:1px solid var(--line2);border-radius:var(--r);padding:8px 10px;margin-bottom:6px;cursor:pointer;
  display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--panel2)}
.choice:hover{border-color:var(--amber-d)}
.choice.on{border-color:var(--amber);background:#1b2e4b}
.choice .t{font-family:var(--mono);font-size:12.5px}
.choice .d{font-size:10.5px;color:var(--dim)}
.swatches{display:flex;gap:5px;flex-wrap:wrap}
.swatches i{width:24px;height:24px;border-radius:var(--r);border:1px solid rgba(0,0,0,.5);cursor:pointer;display:block}
.swatches i.on{outline:2px solid var(--txt);outline-offset:1px}
.opts{display:flex;gap:5px;flex-wrap:wrap}
.segbar{display:flex;gap:0;margin-bottom:10px;border:1px solid var(--line2);border-radius:var(--r);overflow:hidden}
.segbar button{flex:1;border:none;border-radius:0;background:transparent;padding:8px 10px;
  font-family:var(--disp);font-size:13.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.segbar button.on{background:var(--amber);color:#0d1119;font-weight:600}
.segbar button+button{border-left:1px solid var(--line2)}
.opts button.on{background:var(--amber);color:#0d1119;border-color:var(--amber);font-weight:600}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<div id="top">
  <div id="brand"><div id="brandMark"></div>
    <h1 id="brandName">Skyline<small id="brandline">Manager</small></h1></div>
  <div class="hstat"><b id="hCash" class="num">–</b><span>Liquidität</span></div>
  <div class="hstat"><b id="hProfit" class="num">–</b><span>Ergebnis/Mt</span></div>
  <div class="hstat"><b id="hFleet" class="num">–</b><span>Flotte</span></div>
  <div class="hstat"><b id="hRoutes" class="num">–</b><span>Strecken</span></div>
  <div class="hstat"><b id="hPax" class="num">–</b><span>Pax lfd. Monat</span></div>
  <div class="hstat"><b id="hRep" class="num">–</b><span>Ruf</span></div>
  <div id="clockbox">
    <div id="datebox">—</div>
    <div id="speedctl">
      <button data-sp="0" title="Pause">❚❚</button>
      <button data-sp="1" class="on">1×</button>
      <button data-sp="5">5×</button>
      <button data-sp="20">20×</button>
      <button id="btnJump" title="Zeit überspringen">▶▶</button>
      <select id="jumpMode" title="Wie weit springen">
        <option value="event">bis Ereignis</option>
        <option value="day">bis morgen</option>
        <option value="week">eine Woche</option>
        <option value="month">bis Monatsende</option>
      </select>
    </div>
    <div id="nextEv"></div>
  </div>
</div>
<div id="app">
  <div id="stage">
    <div id="mapwrap"><svg id="map"></svg></div><div id="tip"></div>
    <div id="maptools">
      <button data-z="in">Zoom +</button><button data-z="out">Zoom −</button>
      <button data-z="reset">Ansicht zurücksetzen</button>
      <button id="btnLbl">Codes einblenden</button><button id="btnAll">Alle Flughäfen</button>
      <button id="btnAnim">Flüge anhalten</button><button id="btnWx">Wetter aus</button>
      <button id="btnStyle">Tageskarte</button><button id="btnBord">Grenzen aus</button></div>
    <div id="mapinfo"></div>
    <div id="planhint"></div>
    <div id="ticker"><h5>Flugbetrieb</h5><div id="tkl"></div></div>
    <div id="mapsize"><button id="btnMapSize">Karte grösser</button></div>
    <button id="sideToggle" title="Bedienfeld ein- und ausblenden">⤢</button>
    <div id="legend">
      <div><i style="background:var(--green)"></i>Strecke rentabel</div>
      <div><i style="background:var(--red)"></i>Strecke defizitär</div>
      <div><i style="background:var(--amber);height:8px;width:8px;border-radius:50%"></i>Eigene Station</div>
      <div><i style="background:#4aa8e0;height:8px;width:8px;border-radius:50%"></i>Eigenes Ziel</div>
      <div><i style="background:#d8544a;height:8px;width:8px;border-radius:50%"></i>Fremdes Drehkreuz</div>
      <div style="margin-top:4px;color:var(--dim2)">Auf einen Flughafen zeigen hebt sein Netz hervor</div></div>
  </div>
  <div id="side">
    <div id="tabs">
      <button data-t="ops" class="on">Lage</button><button data-t="net">Netz</button>
      <button data-t="fleet">Flotte</button><button data-t="market">Markt</button>
      <button data-t="fin">Finanzen</button><button data-t="staff">Personal</button>
      <button data-t="charter">Charter</button><button data-t="guest">Gäste</button>
      <button data-t="ach">Erfolge</button><button data-t="brand">Marke</button>
      <button data-t="log">Meldungen</button><button data-t="data">Daten</button></div>
    <div id="pane"></div>
  </div>
</div>
<div id="veil"><div id="modal">

  for(let tries=0;tries<400;tries++){

/* ================================================ Freiform-Lackierung ===
   Ebenen werden im Einheitsraum des Flugzeugs gespeichert (x von 0 bis 1000
   entlang des Rumpfs, y in Vielfachen des Rumpfradius). Damit passen sie
   auf jedes Muster, unabhängig von dessen Länge. */
function layerSVG(l, r){
  const sc=(l.scale==null?1:l.scale), rot=l.rot||0, col=l.color||"#ffffff";
  const inner = (()=>{
    switch(l.type){
      case "rect":   return `<rect x="${-(l.w||60)/2}" y="${-(l.h||14)/2}" width="${l.w||60}" height="${l.h||14}" rx="${l.rx||2}" fill="${col}" opacity="${l.op==null?1:l.op}"/>`;
      case "circle": return `<circle cx="0" cy="0" r="${l.r||18}" fill="${col}" opacity="${l.op==null?1:l.op}"/>`;
      case "line":   return `<rect x="${-(l.w||120)/2}" y="${-(l.h||4)/2}" width="${l.w||120}" height="${l.h||4}" fill="${col}" opacity="${l.op==null?1:l.op}"/>`;
      case "text":   return `<text x="0" y="0" text-anchor="middle" dominant-baseline="middle"
                       font-family="${l.font==="mono"?"IBM Plex Mono,monospace":l.font==="serif"?"Georgia,serif":"Barlow Condensed,sans-serif"}"
                       font-size="${l.size||30}" font-weight="700" letter-spacing="${l.ls||1}"
                       fill="${col}">${esc(l.text||"TEXT")}</text>`;
      case "decal":  { const D=DECALS[l.id]; return D ? `<g transform="scale(${(l.dsc||1.6).toFixed(2)})">${D.f(col)}</g>` : ""; }
      case "img":    { const wI=l.iw||64, hI=l.ih||64;
                       return `<image href="${esc(l.url||"")}" x="${-wI/2}" y="${-hI/2}" width="${wI}" height="${hI}"
                         preserveAspectRatio="xMidYMid meet" opacity="${l.op==null?1:l.op}"/>`; }
      default: return "";
    }
  })();
  return `<g transform="translate(${(l.x||500).toFixed(1)},${((l.y||0)*r).toFixed(1)}) rotate(${rot}) scale(${sc})">${inner}</g>`;
}
/** Ungefähre Bildgrösse einer Ebene, für Treffererkennung im Editor. */
function layerBox(l){
  const sc=(l.scale==null?1:l.scale);
  switch(l.type){
    case "rect":   return {w:(l.w||60)*sc, h:(l.h||14)*sc};
    case "circle": return {w:(l.r||18)*2*sc, h:(l.r||18)*2*sc};
    case "line":   return {w:(l.w||120)*sc, h:Math.max((l.h||4)*sc,14)};
    case "text":   return {w:((l.text||"TEXT").length*(l.size||30)*0.55)*sc, h:(l.size||30)*sc};
    case "decal":  return {w:24*(l.dsc||1.6)*sc, h:24*(l.dsc||1.6)*sc};
    case "img":    return {w:(l.iw||64)*sc, h:(l.ih||64)*sc};
    default: return {w:30,h:30};
  }
}

/* ================================================= Ordner durchsuchen ====
   Auf GitHub Pages lässt sich der Inhalt eines Ordners über die öffentliche
   API abfragen. Dadurch findet das Spiel auch Dateien, deren Namen es nicht
   erraten kann — etwa eigene Aufkleber. Klappt das nicht, wird auf eine
   Datei index.json im selben Ordner zurückgegriffen, und sonst auf das
   Abklappern bekannter Namen. */
function repoInfo(){
  try{
    const h=location.hostname, p=location.pathname;
    if(!/\.github\.io$/i.test(h)) return null;
    const owner=h.replace(/\.github\.io$/i,"");
    const seg=p.split("/").filter(Boolean);
    const repo=seg.length?seg[0]:(owner+".github.io");
    return {owner, repo};
  }catch(e){ return null; }
}
const FOLDER_CACHE={};
async function listFolder(path){
  if(FOLDER_CACHE[path]) return FOLDER_CACHE[path];
  const key="skyline.dir."+path;
  try{
    const raw=localStorage.getItem(key);
    if(raw){ const c=JSON.parse(raw);
      if(c.t && Date.now()-c.t < 86400000){ FOLDER_CACHE[path]=c.f; return c.f; } }
  }catch(e){}
  let files=[];
  const ri=repoInfo();
  if(ri){
    try{
      const r=await fetch(`https://api.github.com/repos/${ri.owner}/${ri.repo}/contents/${path}`,
        {headers:{"Accept":"application/vnd.github+json"}});
      if(r.ok){
        const j=await r.json();
        if(Array.isArray(j)) files=j.filter(x=>x.type==="file").map(x=>x.name);
      }
    }catch(e){}
  }
  if(!files.length){
    try{
      const r=await fetch(path.replace(/\/?$/,"/")+"index.json");
      if(r.ok){ const j=await r.json(); if(Array.isArray(j)) files=j; }
    }catch(e){}
  }
  FOLDER_CACHE[path]=files;
  try{ localStorage.setItem(key, JSON.stringify({t:Date.now(), f:files})); }catch(e){}
  return files;
}

/* ============================================ Dateinamen zuordnen ========
   Vorlagen tragen selten die Musterkennung im Namen. Das Spiel liest deshalb
   die Ordnerliste und ordnet jede Datei über Suchmuster dem passenden Muster
   zu — «A320_NEO_Pratt__Whitney_white_sm.jpg» landet bei a20n, «Q400_white.jpg»
   bei dh8d. Reicht eine Vorlage nicht genau, wird die nächstliegende genommen;
   das ist bei einer Seitenansicht unkritisch. */
const ASSET_MATCH = {
  at72:[/atr[\s_-]*(42|72)/i, /\batr\b/i],
  dh8d:[/q[\s_-]*400/i, /dash[\s_-]*8/i, /dhc[\s_-]*8/i],
  cr9: [/crj[\s_-]*900/i, /crj[\s_-]*1000/i, /crj[\s_-]*(700|550)/i, /\bcrj\b/i],
  e175:[/erj[\s_-]*19[05](?![\s_-]*e2)/i, /\be1?7[05]\b/i, /embraer[\s_-]*17[05]/i, /erj[\s_-]*145/i],
  e29e:[/e19[05][\s_-]*e2/i, /erj[\s_-]*190[\s_-]*e2/i, /\be2\b/i],
  bcs1:[/cs[\s_-]*100/i, /a?220[\s_-]*100/i],
  bcs3:[/cs[\s_-]*300/i, /a?220[\s_-]*300/i],
  b737:[/737[\s_-]*(700|800)/i, /737[\s_-]*ng/i],
  a20n:[/a?320[\s_-]*neo/i, /a?319[\s_-]*neo/i, /\ba?320\b/i],
  b38m:[/737[\s_-]*max[\s_-]*8/i, /max[\s_-]*8/i, /737[\s_-]*max/i],
  a21n:[/a?321[\s_-]*neo(?![\s_-]*(lr|xlr))/i, /a?321[\s_-]*neo/i, /\ba?321\b/i],
  a21x:[/a?321[\s_-]*(x?lr)/i, /a?321[\s_-]*neo[\s_-]*lr/i, /\bxlr\b/i, /a?321[\s_-]*neo/i],
  b752:[/757[\s_-]*(200|300)/i, /\b757\b/i],
  b763:[/767[\s_-]*300/i, /767[\s_-]*400/i, /\b767\b/i],
  a339:[/a?330[\s_-]*900/i, /a?330[\s_-]*800/i, /a?330[\s_-]*neo/i, /a?330[\s_-]*(300|200)/i],
  b788:[/787[\s_-]*8/i, /787[\s_-]*10/i],
  b789:[/787[\s_-]*9/i, /787[\s_-]*10/i],
  a359:[/a?350[\s_-]*900/i, /a?350(?![\s_-]*1000)/i, /a?350[\s_-]*1000/i],
  a35k:[/a?350[\s_-]*1000/i, /a?350[\s_-]*900/i],
  b77w:[/777[\s_-]*(300|200)/i, /777[\s_-]*8/i, /\b777f\b/i],
  b779:[/777[\s_-]*9/i, /777[\s_-]*8/i],
  a388:[/a?380/i]
};
/** Sucht die beste Datei für ein Muster aus der Ordnerliste. */
function matchAssetFile(id, files){
  const pats=ASSET_MATCH[id]; if(!pats) return null;
  const imgs=files.filter(f=>/\.(jpe?g|png|webp)$/i.test(f));
  /* Eigene Ebenen haben Vorrang und werden anderswo behandelt */
  const plain=imgs.filter(f=>!/-(base|mask|tail|shade)\.png$/i.test(f));
  const named=plain.find(f=>new RegExp("^"+id+"\\.(jpe?g|png|webp)$","i").test(f));
  if(named) return named;
  for(const p of pats){
    const hits=plain.filter(f=>p.test(f));
    if(hits.length){
      /* «white» bevorzugen, danach die kürzeste Bezeichnung */
      hits.sort((a,b)=>{
        const wa=/white/i.test(a)?0:1, wb=/white/i.test(b)?0:1;
        if(wa!==wb) return wa-wb;
        const ba=/blueprint|line[\s_-]*draw|drawing/i.test(a)?1:0;
        const bb=/blueprint|line[\s_-]*draw|drawing/i.test(b)?1:0;
        if(ba!==bb) return ba-bb;
        return a.length-b.length;
      });
      return hits[0];
    }
  }
  return null;
}

/* ================================================= Externe Grafikpakete ==
   Das Spiel durchsucht beim Start den Ordner graphics/AircraftTemplates/ und
   verwendet, was es dort findet. Nichts muss von Hand eingetragen werden.
   Daneben gibt es graphics/misc/ für alles Übrige — Logo, Startbild und
   eigene Aufkleber für den Lackierungseditor.

   Erkannt werden je Muster, in dieser Reihenfolge:

     <id>.jpg  oder  <id>.png     eine rohe Seitenansicht, weisses Flugzeug
                                  auf hellem Grund. Das Spiel stellt sie frei
                                  und erzeugt die Masken selbst.
     <id>-base.png                bereits freigestelltes Flugzeug mit Alpha.
     <id>-mask.png                Farbmaske (freiwillig, sonst abgeleitet)
     <id>-tail.png                Leitwerksmaske (freiwillig)
     <id>-shade.png               Schatten und Glanzlichter (freiwillig)

   <id> ist die Musterkennung aus AIRCRAFT_ROWS: a20n, b789, at72 und so fort.
   Bildgrösse, Nase, Mittellinie und Rumpfradius misst das Spiel selbst aus. */
const ASSET_DIR = "graphics/AircraftTemplates/";
const MISC_DIR  = "graphics/misc/";
const ASSET_MAX_W = 1400;          // grössere Vorlagen werden verkleinert
let   PLANE_ASSETS = {};           // wird beim Suchlauf gefüllt
const ASSET_LAYERS = {};           // Bilddaten und Blob-Adressen je Muster
const ASSET_STATE  = {};           // "da" | "fehlt" | "prüft"
let   ASSET_SCAN   = {running:false, done:false, found:0, checked:0};

function assetsFor(id){
  const a=PLANE_ASSETS[id];
  return (a && ASSET_STATE[id]==="da") ? a : null;
}
function assetUrl(id, kind){
  const L=ASSET_LAYERS[id];
  return (L && L.url && L.url[kind]) || "";
}
/** Lädt ein Bild und meldet, ob es vorhanden ist. */
function tryImage(url){
  return new Promise(res=>{
    const img=new Image();
    img.onload =()=>res(img.naturalWidth?img:null);
    img.onerror=()=>res(null);
    img.src=url;
  });
}
function canvasFromImage(img){
  const sc=Math.min(1, ASSET_MAX_W/img.naturalWidth);
  const c=document.createElement("canvas");
  c.width=Math.round(img.naturalWidth*sc); c.height=Math.round(img.naturalHeight*sc);
  c.getContext("2d").drawImage(img,0,0,c.width,c.height);
  return c;
}
/** Weisses Bild in eine Deckungsmaske umwandeln. */
function maskToAlpha(src){
  const c=document.createElement("canvas"); c.width=src.width; c.height=src.height;
  const ctx=c.getContext("2d");
  const im=src.getContext("2d").getImageData(0,0,src.width,src.height);
  const d=im.data;
  for(let i=0;i<d.length;i+=4){ const v=d[i]; d[i]=255; d[i+1]=255; d[i+2]=255; d[i+3]=v; }
  ctx.putImageData(im,0,0);
  return c;
}
function blobUrl(cv){
  try{ return cv.toDataURL("image/png"); }catch(e){ return ""; }
}
/** Untersucht ein Muster: welche Dateien liegen da, und wie ist das Bild aufgebaut. */
async function probeAsset(id, fileName){
  ASSET_STATE[id]="prüft";
  let baseCv=null, url={}, derived=false;

  const preBase=await tryImage(ASSET_DIR+id+"-base.png");
  if(preBase){
    baseCv=canvasFromImage(preBase);
    url.base=ASSET_DIR+id+"-base.png";
  } else {
    let raw=null;
    if(fileName) raw=await tryImage(ASSET_DIR+fileName);
    if(!raw) raw=await tryImage(ASSET_DIR+id+".jpg");
    if(!raw) raw=await tryImage(ASSET_DIR+id+".png");
    if(!raw){ ASSET_STATE[id]="fehlt"; return false; }
    /* Rohe Vorlage: Hintergrund vom Rand her freistellen */
    baseCv=prepCutout(canvasFromImage(raw), 42);
    url.base=blobUrl(baseCv);
    derived=true;
  }

  const box=prepBounds(baseCv);
  if(box.w<20||box.h<10){ ASSET_STATE[id]="fehlt"; return false; }
  const an=prepAnchor(baseCv, box);

  /* Farbmaske: eigene Datei bevorzugt, sonst aus dem Bild ableiten */
  const mImg=await tryImage(ASSET_DIR+id+"-mask.png");
  if(mImg){ url.mask=ASSET_DIR+id+"-mask.png"; }
  else {
    const m=maskToAlpha(prepMask(baseCv, 110, null));
    url.mask=blobUrl(m);
    ASSET_LAYERS[id]=Object.assign(ASSET_LAYERS[id]||{}, {maskCv:m});
    derived=true;
  }

  /* Leitwerk: eigene Datei, sonst aus dem hinteren Bereich über der Mittellinie */
  const tImg=await tryImage(ASSET_DIR+id+"-tail.png");
  if(tImg){ url.tail=ASSET_DIR+id+"-tail.png"; }
  else {
    const region={x0:Math.round(box.x0+box.w*0.72), x1:box.x1, y0:box.y0, y1:an.yc};
    const t=maskToAlpha(prepMask(baseCv, 110, region));
    url.tail=blobUrl(t);
    ASSET_LAYERS[id]=Object.assign(ASSET_LAYERS[id]||{}, {tailCv:t});
  }

  const sImg=await tryImage(ASSET_DIR+id+"-shade.png");
  if(sImg) url.shade=ASSET_DIR+id+"-shade.png";

  ASSET_LAYERS[id]=Object.assign(ASSET_LAYERS[id]||{}, {baseCv, url, box, anchor:an});
  PLANE_ASSETS[id]={base:1, mask:1, tail:1, shade:!!sImg,
    w:baseCv.width, h:baseCv.height,
    x0:an.x0, yc:an.yc, r:an.r, unit:an.unit, derived, file:fileName||null};
  ASSET_STATE[id]="da";
  return true;
}
/** Durchsucht den Ordner. Das Ergebnis wird gemerkt, damit spätere Starts
    nur noch die tatsächlich vorhandenen Dateien anfassen. */
async function scanAssets(force){
  if(ASSET_SCAN.running) return;
  ASSET_SCAN={running:true, done:false, found:0, checked:0};
  let candidates=ACTL.map(t=>t.id);
  if(!force){
    try{
      const raw=localStorage.getItem("skyline.assets");
      if(raw){ const c=JSON.parse(raw);
        if(c.t && Date.now()-c.t < 7*86400000 && Array.isArray(c.ids)){
          candidates = c.ids.length ? c.ids : [];
          if(!c.ids.length){ ASSET_SCAN={running:false,done:true,found:0,checked:0};
            if(typeof renderPane==="function" && tab==="data") renderPane();
            return; }
        }
      }
    }catch(e){}
  }
  /* Ordnerliste holen und die Dateinamen zuordnen */
  let fileMap={};
  try{
    const files=await listFolder(ASSET_DIR.replace(/\/$/,""));
    if(files.length){
      ACTL.forEach(t=>{ const f=matchAssetFile(t.id, files); if(f) fileMap[t.id]=f; });
      if(Object.keys(fileMap).length) candidates=Object.keys(fileMap);
    }
  }catch(e){}
  const found=[];
  for(let i=0;i<candidates.length;i+=4){
    const batch=candidates.slice(i,i+4);
    const res=await Promise.all(batch.map(id=>probeAsset(id, fileMap[id]).catch(()=>false)));
    res.forEach((ok,j)=>{ if(ok) found.push(batch[j]); });
    ASSET_SCAN.checked+=batch.length;
    ASSET_SCAN.found=found.length;
    if(tab==="data" && typeof renderPane==="function") renderPane();
  }
  try{ localStorage.setItem("skyline.assets", JSON.stringify({t:Date.now(), ids:found})); }catch(e){}
  ASSET_SCAN.running=false; ASSET_SCAN.done=true;
  if(found.length && typeof render==="function") render();
  else if(tab==="data" && typeof renderPane==="function") renderPane();
}
function forgetAssets(){
  try{ localStorage.removeItem("skyline.assets"); }catch(e){}
  Object.keys(PLANE_ASSETS).forEach(k=>delete PLANE_ASSETS[k]);
  Object.keys(ASSET_STATE).forEach(k=>delete ASSET_STATE[k]);
  Object.keys(ASSET_LAYERS).forEach(k=>delete ASSET_LAYERS[k]);
  scanAssets(true);
}

/* ============================================ Canvas-Renderpipeline =====
   Drei Ebenen wie in der Spezifikation: neutrale Basis, Farbmaske und
   Schattierung. Die Basis stammt aus prozeduraler Vektorgrafik; sie liesse
   sich später ohne Änderung der Pipeline durch fotografische Assets
   ersetzen — die Maske muss dann Fenster und Triebwerkseinläufe aussparen. */
const PLANE_IMG_CACHE = {};
function svgToImage(svg, key){
  if(PLANE_IMG_CACHE[key]) return PLANE_IMG_CACHE[key];
  const img=new Image();
  const p=new Promise(res=>{ img.onload=()=>res(img); img.onerror=()=>res(null); });
  img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg);
  PLANE_IMG_CACHE[key]={img, p};
  return PLANE_IMG_CACHE[key];
}
/** Erzeugt eine einzelne Ebene als SVG-Zeichenkette. */
function planeLayerSVG(typeId, kind, wear){
  const t=ACT[typeId]; if(!t) return "";
  const P=planeGeom(t.shape), f=P.f, r=P.r, L=P.L, T=-f.finTop*L;
  const sc=0.42+0.58*clamp(t.len/2.04,0.32,1);
  const VW=1240, VH=t.shape==="dd"?300:280, yc=t.shape==="dd"?172:165, x0=40;
  const id="L"+kind+typeId;
  const open=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${VW} ${VH}" width="${VW}" height="${VH}">`;
  const g=`<g transform="translate(${x0},${yc}) scale(${sc.toFixed(3)})">`;

  if(kind==="mask"){
    /* Lackierbare Flächen als geschlossene Silhouette. Fenster und
       Triebwerkseinläufe bleiben dunkel, weil die Farbe multiplizierend
       aufgelegt wird — ein Ausstanzen ist dafür nicht nötig. */
    return open+`${g}
      <path d="${P.fus}" fill="#fff"/><path d="${P.dorsal}" fill="#fff"/>
      <path d="${P.fin}" fill="#fff"/><path d="${P.hstab}" fill="#fff"/>
      <path d="${P.wing}" fill="#fff"/>${P.tip?`<path d="${P.tip}" fill="#fff"/>`:""}
      </g></svg>`;
  }
  if(kind==="shade"){
    return open+`<defs>
      <linearGradient id="${id}s" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"  stop-color="#ffffff" stop-opacity="${(0.30*(1-0.7*wear)).toFixed(2)}"/>
        <stop offset="14%" stop-color="#ffffff" stop-opacity="${(0.52*(1-0.7*wear)).toFixed(2)}"/>
        <stop offset="30%" stop-color="#ffffff" stop-opacity="${(0.10*(1-0.7*wear)).toFixed(2)}"/>
        <stop offset="52%" stop-color="#000000" stop-opacity=".02"/>
        <stop offset="78%" stop-color="#000000" stop-opacity=".16"/>
        <stop offset="100%" stop-color="#000000" stop-opacity=".38"/></linearGradient>
      <clipPath id="${id}c">${g}<path d="${P.fus}"/></g></clipPath></defs>
      <g clip-path="url(#${id}c)"><rect width="${VW}" height="${VH}" fill="url(#${id}s)"/></g></svg>`;
  }
  /* kind === "base": neutrales Flugzeug mit allen Details */
  return open+planeSVG(typeId, Object.assign({}, DEFAULT_LIVERY,
    {c1:"#f3f6f9", c2:"#d8dee6", body:"weiss", tail:"leer", stripe:"keine",
     glyph:"ring", decals:[], layers:[]}),
    {wear, titles:false, gear:true}).replace(/^<svg[^>]*>/,"").replace(/<\/svg>$/,"")+"</svg>";
}
/** Zeichnet ein Flugzeug in ein Canvas: Basis, Farbmaske, Ebenen, Schattierung.
    Liegt ein Grafikpaket im Ordner assets/planes/, wird dieses verwendet,
    sonst die eigene Vektorzeichnung. */
function renderPlaneCanvas(cv, typeId, liv, opts){
  const o=Object.assign({wear:0}, opts||{});
  const t=ACT[typeId]; if(!t||!cv) return;
  const A=assetsFor(typeId);
  const VW=A?(A.w||1600):1240, VH=A?(A.h||520):(t.shape==="dd"?300:280);
  const dpr=Math.min(window.devicePixelRatio||1, 2);
  const cssW=cv.clientWidth||600;
  cv.width=Math.round(cssW*dpr); cv.height=Math.round(cssW*VH/VW*dpr);
  const ctx=cv.getContext("2d");
  const k=cv.width/VW;
  const L0=liv||DEFAULT_LIVERY;
  const wq=Math.round(o.wear*4)/4;
  const body=BODY_COLS[L0.body]||L0.c1;

  const tint=(img,col)=>{
    const off=document.createElement("canvas");
    off.width=VW; off.height=VH;
    const oc=off.getContext("2d");
    oc.drawImage(img,0,0,VW,VH);
    oc.globalCompositeOperation="source-in";
    oc.fillStyle=col; oc.fillRect(0,0,VW,VH);
    return off;
  };

  if(A){
    /* Fertige Zeichnungen: Ebenen liegen bereits als Bild oder Canvas vor */
    const LY=ASSET_LAYERS[typeId]||{};
    const need=[];
    const get=(kind, cvKey)=>{
      if(LY[cvKey]) return Promise.resolve(LY[cvKey]);
      const u=assetUrl(typeId,kind);
      if(!u) return Promise.resolve(null);
      return tryImage(u);
    };
    Promise.all([
      LY.baseCv?Promise.resolve(LY.baseCv):get("base","baseCv"),
      get("mask","maskCv"), get("tail","tailCv"),
      A.shade?get("shade","shadeCv"):Promise.resolve(null)
    ]).then(([bi,mi,ti,si])=>{
      if(!bi){ ASSET_STATE[typeId]="fehlt"; renderPlaneCanvas(cv,typeId,liv,opts); return; }
      ctx.clearRect(0,0,cv.width,cv.height);
      ctx.save(); ctx.scale(k,k);
      ctx.drawImage(bi,0,0,VW,VH);
      if(mi){ ctx.globalCompositeOperation="multiply";
        ctx.drawImage(tint(mi, body),0,0,VW,VH);
        ctx.globalCompositeOperation="source-over"; }
      if(ti){ ctx.globalCompositeOperation="multiply";
        ctx.drawImage(tint(ti, L0.c1),0,0,VW,VH);
        ctx.globalCompositeOperation="source-over"; }
      ctx.restore();
      const ov=svgToImage(assetOverlaySVG(typeId, L0, VW, VH), "ao"+typeId+liveryKey(L0));
      ov.p.then(oi=>{
        if(oi){ ctx.save(); ctx.scale(k,k); ctx.drawImage(oi,0,0,VW,VH); ctx.restore(); }
        if(si){ ctx.save(); ctx.scale(k,k); ctx.globalCompositeOperation="multiply";
          ctx.drawImage(si,0,0,VW,VH); ctx.globalCompositeOperation="source-over"; ctx.restore(); }
        if(wq>0.02){ ctx.save(); ctx.scale(k,k); ctx.globalAlpha=wq*0.30;
          ctx.fillStyle="#2b2620"; ctx.fillRect(VW*0.45,0,VW*0.55,VH); ctx.restore(); }
      });
    });
    return;
  }

  /* Eigene Vektorzeichnung in drei Ebenen */
  const base=svgToImage(planeLayerSVG(typeId,"base",wq), "b"+typeId+wq);
  const mask=svgToImage(planeLayerSVG(typeId,"mask",0),  "m"+typeId);
  const shade=svgToImage(planeLayerSVG(typeId,"shade",wq),"s"+typeId+wq);
  Promise.all([base.p, mask.p, shade.p]).then(([bi,mi,si])=>{
    ctx.clearRect(0,0,cv.width,cv.height);
    ctx.save(); ctx.scale(k,k);
    if(bi) ctx.drawImage(bi,0,0,VW,VH);
    if(mi){ ctx.globalCompositeOperation="multiply";
      ctx.drawImage(tint(mi, body),0,0,VW,VH);
      ctx.globalCompositeOperation="source-over"; }
    ctx.restore();
    const ov=svgToImage(planeSVG(typeId, L0, {wear:0, titles:true, gear:false,
      bodyNone:true, noDetails:true, allowAssets:false}), "o"+typeId+liveryKey(L0));
    ov.p.then(oi=>{
      if(oi){ ctx.save(); ctx.scale(k,k); ctx.drawImage(oi,0,0,VW,VH); ctx.restore(); }
      if(si){ ctx.save(); ctx.scale(k,k); ctx.globalCompositeOperation="multiply";
        ctx.drawImage(si,0,0,VW,VH); ctx.globalCompositeOperation="source-over"; ctx.restore(); }
    });
  });
}
function liveryKey(L0){
  return [L0.c1,L0.c2,L0.body,L0.tail,L0.stripe,L0.glyph,L0.titles,
    (L0.decals||[]).join("."),(L0.layers||[]).length,
    JSON.stringify(L0.layers||[]).length].join("_");
}
/** Beschriftung, Signet und freie Ebenen über einem Grafikpaket. */
function assetOverlaySVG(typeId, L0, VW, VH){
  const A=PLANE_ASSETS[typeId]||{};
  const r=(A.r||VH*0.11);                 // Bezugsradius für die Ebenenkoordinaten
  const x0=(A.x0!=null?A.x0:VW*0.03), yc=(A.yc!=null?A.yc:VH*0.55);
  const scale=(A.unit!=null?A.unit:(VW*0.94)/1000);
  const title=((typeof S!=="undefined"&&S&&S.name)?S.name:"Skyline").toUpperCase().slice(0,18);
  const dark=lum(BODY_COLS[L0.body]||L0.c1)>0.5;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${VW} ${VH}" width="${VW}" height="${VH}">
    <g transform="translate(${x0},${yc}) scale(${scale.toFixed(4)})">
      ${(L0.layers||[]).map(l=>layerSVG(l,r/scale)).join("")}
      <text x="135" y="${(-r/scale*1.30).toFixed(1)}" font-family="Barlow Condensed,sans-serif"
        font-size="${(r/scale*0.95).toFixed(1)}" font-weight="700"
        letter-spacing="${(r/scale*0.10).toFixed(1)}"
        fill="${dark?L0.c1:"#eef3f8"}">${esc(title)}</text>
    </g></svg>`;
}

function planeGeom(shape){
  const f=FAM[shape]||FAM.nb, L=1000, r=f.r*L, P={f,r,L}, T=-f.finTop*L;
  P.fus = `M0,${n1(r*0.34)} C${n1(0.008*L)},${n1(-r*0.30)} ${n1(0.038*L)},${n1(-r)} ${n1(0.092*L)},${n1(-r)}`
    + ` L${n1(0.700*L)},${n1(-r)}`
    + ` C${n1(0.812*L)},${n1(-r)} ${n1(0.905*L)},${n1(-r*1.06)} ${n1(0.997*L)},${n1(-r*f.tailUp)}`
    + ` L${n1(L)},${n1(-r*(f.tailUp-0.34))}`
    + ` C${n1(0.928*L)},${n1(-r*0.02)} ${n1(0.866*L)},${n1(r*0.76)} ${n1(0.755*L)},${n1(r)}`
    + ` L${n1(0.102*L)},${n1(r)} C${n1(0.048*L)},${n1(r)} ${n1(0.012*L)},${n1(r*0.82)} 0,${n1(r*0.34)} Z`;
  P.dorsal = `M${n1(f.dors*L)},${n1(-r*0.99)} C${n1((f.dors+0.030)*L)},${n1(-r*1.10)} ${n1((f.finLE-0.012)*L)},${n1(-r*1.20)} ${n1(f.finLE*L)},${n1(-r*1.28)} L${n1((f.finLE+0.012)*L)},${n1(-r*1.02)} Z`;
  P.fin = `M${n1(f.finLE*L)},${n1(-r*1.22)} L${n1(f.finTipLE*L)},${n1(T*0.972)}`
    + ` C${n1((f.finTipLE+0.022)*L)},${n1(T*1.012)} ${n1((f.finTipTE-0.020)*L)},${n1(T*1.012)} ${n1(f.finTipTE*L)},${n1(T*0.975)}`
    + ` L${n1(f.finTE*L)},${n1(-r*1.36)} L${n1((f.finLE+0.034)*L)},${n1(-r*1.06)} Z`;
  P.hstab = f.ttail
    ? `M${n1((f.finTipLE+0.010)*L)},${n1(T*0.985)} L${n1((f.finTipTE+0.075)*L)},${n1(T*1.03)} L${n1((f.finTipTE+0.078)*L)},${n1(T*0.985)} L${n1((f.finTipLE+0.045)*L)},${n1(T*0.925)} Z`
    : `M${n1(0.888*L)},${n1(-r*0.86)} L${n1(1.052*L)},${n1(-r*2.05)} L${n1(1.062*L)},${n1(-r*1.60)} L${n1(0.952*L)},${n1(-r*0.30)} Z`;
  const wl=f.wingLE*L, wte=f.wingTE*L, wtl=f.wingTipLE*L, wtt=f.wingTipTE*L, dy=r*f.wingDrop;

    ? `M${n1(wl)},${n1(-r*0.96)} L${n1(wtl)},${n1(dy)} L${n1(wtt)},${n1(dy*0.93)} L${n1(wte)},${n1(-r*0.70)} Z`
    : `M${n1(wl)},${n1(-r*0.10)} L${n1(wtl)},${n1(dy)} L${n1(wtt)},${n1(dy*1.20)} L${n1(wte)},${n1(r*0.46)} Z`;

function nacellePath(x,y,len,h,fill,line,shadeCol,chrome){
  const rr=h/2; chrome=chrome||"#c3ccd6";
  return `<g><path d="M${n1(x)},${n1(y)}
      C${n1(x-len*0.04)},${n1(y-rr*0.62)} ${n1(x+len*0.05)},${n1(y-rr)} ${n1(x+len*0.18)},${n1(y-rr)}
      L${n1(x+len*0.76)},${n1(y-rr*0.94)} C${n1(x+len*0.94)},${n1(y-rr*0.88)} ${n1(x+len*1.02)},${n1(y-rr*0.50)} ${n1(x+len*1.05)},${n1(y-rr*0.22)}
      L${n1(x+len*1.05)},${n1(y+rr*0.22)} C${n1(x+len*1.02)},${n1(y+rr*0.50)} ${n1(x+len*0.94)},${n1(y+rr*0.88)} ${n1(x+len*0.76)},${n1(y+rr*0.94)}
      L${n1(x+len*0.18)},${n1(y+rr)} C${n1(x+len*0.05)},${n1(y+rr)} ${n1(x-len*0.04)},${n1(y+rr*0.62)} ${n1(x)},${n1(y)} Z"
      fill="${fill}" stroke="${line}" stroke-width="1.4"/>
    <ellipse cx="${n1(x+len*0.055)}" cy="${n1(y)}" rx="${n1(len*0.055)}" ry="${n1(rr*0.99)}" fill="${chrome}"/>
    <ellipse cx="${n1(x+len*0.078)}" cy="${n1(y)}" rx="${n1(len*0.040)}" ry="${n1(rr*0.84)}" fill="#151d27"/>
    <ellipse cx="${n1(x+len*0.10)}" cy="${n1(y)}" rx="${n1(len*0.030)}" ry="${n1(rr*0.50)}" fill="#2c3742" opacity=".9"/>
    <path d="M${n1(x+len*0.86)},${n1(y-rr*0.62)} L${n1(x+len*1.06)},${n1(y-rr*0.18)} L${n1(x+len*1.06)},${n1(y+rr*0.18)} L${n1(x+len*0.86)},${n1(y+rr*0.62)} Z" fill="#39424e" opacity=".55"/></g>`;
}
/** Vollständige Seitenansicht in der Hausbemalung. */
function planeSVG(typeId, liv, opts){
  const t = ACT[typeId]; if(!t) return "";
  const L0 = liv || DEFAULT_LIVERY;
  const o = Object.assign({gear:true, titles:true, wear:0, bodyNone:false, noDetails:false,
    allowAssets:true}, opts||{});
  if(o.allowAssets && assetsFor(typeId)) return planeAssetSVG(typeId, L0, o);
  const wear = clamp(o.wear||0, 0, 1);
  const P = planeGeom(t.shape), f=P.f, r=P.r, L=P.L, T=-f.finTop*L;
  const body = BODY_COLS[L0.body] || L0.c1;
  const bodyFill = o.bodyNone ? "none" : body;
  const dark = lum(body)>0.5;
  const line = dark ? "rgba(0,0,0,0.30)" : "rgba(255,255,255,0.16)";
  const strut = dark ? "#3d4854" : "#202934";
  const winCol = dark ? "#2a3743" : "#0d141d";
  const id = "p"+Math.random().toString(36).slice(2,9);
  const sc = 0.42 + 0.58*clamp(t.len/2.04,0.32,1);      // Grössenverhältnis der Muster
  const VW = 1240, VH = t.shape==="dd" ? 300 : 280;
  const yc = t.shape==="dd" ? 172 : 165, x0 = 40;

  // Triebwerke
  const eY = y => r*y;
  const pylon = (ex,ey)=>`<path d="M${n1(ex+f.engL*0.62*L)},${n1(ey-r*f.engH*0.42)} L${n1(ex+f.engL*1.10*L)},${n1(r*0.10)} L${n1(ex+f.engL*1.34*L)},${n1(r*0.26)} L${n1(ex+f.engL*0.95*L)},${n1(ey-r*f.engH*0.38)} Z" fill="${strut}"/>`;
  let eng;
  if(t.shape==="prop"){
    const ex=f.engX*L, ey=eY(f.engY);
    eng = nacellePath(ex,ey,f.engL*L,r*f.engH,body,line,line,`url(#${id}cr)`)
      + `<ellipse cx="${n1(ex-4)}" cy="${n1(ey)}" rx="4" ry="${n1(r*1.38)}" fill="${L0.c1}" opacity=".22"/>`
      + `<rect x="${n1(ex-7)}" y="${n1(ey-r*1.38)}" width="5" height="${n1(r*2.76)}" rx="2.5" fill="${strut}"/>`;
  } else if(t.shape==="rjt"){
    eng = nacellePath(f.engX*L, eY(f.engY), f.engL*L, r*f.engH, body, line, line, `url(#${id}cr)`);
  } else if(t.shape==="dd"){
    eng = pylon(0.250*L,eY(1.14))+nacellePath(0.250*L,eY(1.14),0.112*L,r*0.88,body,line,line,`url(#${id}cr)`)
        + pylon(0.322*L,eY(1.42))+nacellePath(0.322*L,eY(1.42),0.118*L,r*0.94,body,line,line,`url(#${id}cr)`);
  } else {
    eng = pylon(f.engX*L,eY(f.engY))+nacellePath(f.engX*L,eY(f.engY),f.engL*L,r*f.engH,body,line,line,`url(#${id}cr)`);
  }
  // Fenster und Türen
  let wins="", step=0.0170*L;
  for(let x=0.108*L;x<0.795*L;x+=step)
    wins+=`<rect x="${n1(x)}" y="${n1(-r*0.48)}" width="${n1(r*0.30)}" height="${n1(r*0.36)}" rx="${n1(r*0.14)}" fill="${winCol}" opacity=".9"/>`;
  if(f.rows>1) for(let x=0.118*L;x<0.715*L;x+=step)
    wins+=`<rect x="${n1(x)}" y="${n1(-r*0.90)}" width="${n1(r*0.27)}" height="${n1(r*0.33)}" rx="${n1(r*0.13)}" fill="${winCol}" opacity=".9"/>`;
  let doors="";
  [0.112,0.300,0.618,0.812].forEach(dx=>doors+=`<rect x="${n1(dx*L)}" y="${n1(-r*0.74)}" width="${n1(r*0.36)}" height="${n1(r*1.30)}" rx="${n1(r*0.12)}" fill="rgba(0,0,0,0.05)" stroke="${line}" stroke-width="1"/>`);

  // Rumpfbemalung
  const grad = (a,b,x1,x2)=>`<linearGradient id="${a}" x1="${x1}" y1="0" x2="${x2}" y2="1">${b}</linearGradient>`;
  let defs="", strip="";
  const c1=L0.c1, c2=L0.c2;
  if(L0.stripe==="linie")
    strip = `<rect x="${n1(0.05*L)}" y="${n1(r*0.02)}" width="${n1(0.90*L)}" height="${n1(r*0.13)}" fill="${c1}"/>`;
  else if(L0.stripe==="band")
    strip = `<path d="M${n1(0.03*L)},${n1(r*0.06)} L${n1(0.95*L)},${n1(-r*0.10)} L${n1(0.95*L)},${n1(r*0.46)} L${n1(0.03*L)},${n1(r*0.56)} Z" fill="${c1}"/>`;
  else if(L0.stripe==="kiel")
    strip = `<path d="M0,${n1(r*0.30)} L${n1(0.92*L)},${n1(r*0.05)} L${n1(L)},${n1(r*1.2)} L0,${n1(r*1.2)} Z" fill="${c1}"/>`;
  else if(L0.stripe==="schwung"){
    strip = `<path d="M0,${n1(r*0.55)} C${n1(0.34*L)},${n1(r*0.30)} ${n1(0.58*L)},${n1(-r*0.15)} ${n1(1.02*L)},${n1(-r*1.15)}

    defs += grad(id+"sw", `<stop offset="0%" stop-color="${mix(c1,c2,0.35)}"/><stop offset="100%" stop-color="${c1}"/>`,0,1);
  } else if(L0.stripe==="verlauf"){
    strip = `<rect x="0" y="${n1(-r*1.2)}" width="${n1(L*1.02)}" height="${n1(r*2.4)}" fill="url(#${id}vl)"/>`;

      <stop offset="0%" stop-color="${c1}" stop-opacity="0"/><stop offset="52%" stop-color="${c1}" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="${c1}" stop-opacity="0.95"/></linearGradient>`;
  } else if(L0.stripe==="split")
    strip = `<path d="M${n1(0.46*L)},${n1(-r*1.2)} L${n1(1.02*L)},${n1(-r*1.2)} L${n1(1.02*L)},${n1(r*1.3)} L${n1(0.36*L)},${n1(r*1.3)} Z" fill="${c1}"/>`;

  // Leitwerksbemalung
  let tail="";
  if(L0.tailImg){
    /* Fertiges Leitwerksbild hat Vorrang vor den gezeichneten Mustern. Es

    tail = `<image href="${esc(L0.tailImg)}" x="${n1(0.585*L)}" y="${n1(T*1.30)}"

  }
  else if(L0.tail==="vollton") tail = `<rect x="${n1(0.60*L)}" y="${n1(T*1.2)}" width="${n1(0.55*L)}" height="${n1(-T*1.6)}" fill="${c1}"/>`;

    defs += grad(id+"tg", `<stop offset="0%" stop-color="${mix(c1,c2,0.55)}"/><stop offset="62%" stop-color="${c1}"/><stop offset="100%" stop-color="${shade(c1,-0.28)}"/>`,0,1);
  }
  else if(L0.tail==="diagonale") tail = `<path d="M${n1(f.finLE*L)},${n1(-r*1.2)} L${n1(1.02*L)},${n1(T*1.15)} L${n1(1.02*L)},${n1(-r*1.2)} Z" fill="${c1}"/>`;
  else if(L0.tail==="bogen") tail = `<path d="M${n1(f.finLE*L)},${n1(-r*1.2)} C${n1(0.83*L)},${n1(T*0.30)} ${n1(0.88*L)},${n1(T*1.05)} ${n1(1.02*L)},${n1(T*1.15)} L${n1(1.02*L)},${n1(-r*1.2)} Z" fill="${c1}"/>`;
  else if(L0.tail==="gold"){
    tail = `<rect x="${n1(0.60*L)}" y="${n1(T*1.2)}" width="${n1(0.55*L)}" height="${n1(-T*1.6)}" fill="url(#${id}gd)"/>`;
    defs += `<linearGradient id="${id}gd" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#f9ecb4"/><stop offset="38%" stop-color="#e0b64a"/>
      <stop offset="68%" stop-color="#b98b22"/><stop offset="100%" stop-color="#7d5a12"/></linearGradient>`;
  }
  else if(L0.tail==="retro") tail = [0,1,2,3].map(i=>
      `<rect x="${n1(0.60*L)}" y="${n1(T*(0.98-i*0.20))}" width="${n1(0.55*L)}" height="${n1(-T*0.15)}"
       fill="${i%2?c2:c1}" opacity="${1-i*0.10}"/>`).join("");
  else if(L0.tail==="streifen") tail = [0,1,2].map(i=>
      `<rect x="${n1(0.60*L)}" y="${n1(T*(0.92-i*0.26))}" width="${n1(0.55*L)}" height="${n1(-T*0.14)}" fill="${c1}" opacity="${1-i*0.24}"/>`).join("");

  const glyphCol = L0.tail==="leer" ? c1 : c2;
  const gs = (-T)*0.44, gx = (f.finTipLE-0.055)*L, gy = T*0.88;
  const titleRaw = ((typeof S!=="undefined"&&S&&S.name)?S.name:"Skyline").toUpperCase();
  const title = titleRaw.length>18 ? titleRaw.slice(0,18) : titleRaw;
  const titleCol = (L0.stripe==="split"||L0.stripe==="kiel")
      ? (lum(c1)>0.55?"#101820":"#f2f5f8")
      : (dark ? (lum(c1)>0.72?shade(c1,-0.4):c1) : "#eef3f8");
  const titleSize = L0.titles==="klein" ? r*0.62 : r*0.95;

  return `<svg viewBox="0 0 ${VW} ${VH}" width="100%" preserveAspectRatio="xMidYMid meet" role="img"
   aria-label="${esc(t.name)} in der Hausbemalung">
   <defs>${defs}
     <filter id="${id}wr"><feColorMatrix type="saturate" values="${(1-wear*0.55).toFixed(2)}"/>
       <feComponentTransfer><feFuncR type="linear" slope="${(1-wear*0.16).toFixed(2)}"/>
         <feFuncG type="linear" slope="${(1-wear*0.15).toFixed(2)}"/>
         <feFuncB type="linear" slope="${(1-wear*0.19).toFixed(2)}"/></feComponentTransfer></filter>
     <linearGradient id="${id}gr" x1="0.55" y1="0" x2="1" y2="0.4">
       <stop offset="0%" stop-color="#3a3226" stop-opacity="0"/>
       <stop offset="100%" stop-color="#2e2820" stop-opacity="${(wear*0.5).toFixed(2)}"/></linearGradient>
     <linearGradient id="${id}sh" x1="0" y1="0" x2="0" y2="1">

       <stop offset="30%" stop-color="#ffffff" stop-opacity="${(0.10*(1-0.7*wear)).toFixed(2)}"/>

       <stop offset="85%" stop-color="#000000" stop-opacity="0"/>
       <stop offset="100%" stop-color="#000000" stop-opacity=".30"/></linearGradient>
     <linearGradient id="${id}cr" x1="0" y1="0" x2="0" y2="1">
       <stop offset="0%" stop-color="#f4f8fb"/><stop offset="42%" stop-color="#aab6c4"/>
       <stop offset="58%" stop-color="#5c6a7a"/><stop offset="100%" stop-color="#9aa8b8"/></linearGradient>
     <clipPath id="${id}cf"><path d="${P.fus}"/></clipPath>
     <clipPath id="${id}ct"><path d="${P.fin}"/></clipPath>
   </defs>
   <g transform="translate(${x0},${yc}) scale(${sc.toFixed(3)})" ${wear>0.02?`filter="url(#${id}wr)"`:""}>
     ${o.gear?`<g>${(function(){
        const wh=(x,y,rr2)=>`<circle cx="${n1(x)}" cy="${n1(y)}" r="${n1(rr2)}" fill="#18212c"/><circle cx="${n1(x)}" cy="${n1(y)}" r="${n1(rr2*0.40)}" fill="#59667a"/>`;
        const gl=r*1.85, s=[];

        s.push(wh(f.gearN*L, r*0.90+gl*0.72, r*0.30));

        else s.push(wh(mx, r*0.90+gl*0.80, r*0.34));

     <path d="${P.hstab}" fill="${bodyFill}" stroke="${line}" stroke-width="1.4"/>

     <g transform="translate(${n1(gx)},${n1(gy)}) scale(${(gs/24).toFixed(3)})">${glyphSVG(L0.glyph, glyphCol, L0.code)}</g>
     <path d="${P.fus}" fill="${bodyFill}" stroke="${line}" stroke-width="1.5"/>
     <g clip-path="url(#${id}cf)">
       ${strip}${o.noDetails?"":wins}${o.noDetails?"":doors}
       ${wear>0.02?`<rect x="${n1(0.45*L)}" y="${n1(-r*1.2)}" width="${n1(0.6*L)}" height="${n1(r*2.4)}" fill="url(#${id}gr)"/>`:""}
       ${o.noDetails?"":`<rect x="${n1(-0.1*L)}" y="${n1(-r*3)}" width="${n1(1.3*L)}" height="${n1(r*6)}" fill="url(#${id}sh)"/>
       <rect x="${n1(-0.1*L)}" y="${n1(-r)}" width="${n1(1.3*L)}" height="${n1(r*2)}" fill="url(#${id}cy)"/>`}
       ${wear>0.25?`<g opacity="${(wear*0.5).toFixed(2)}">
         <path d="M${n1(f.gearMain*L)},${n1(r*0.45)} L${n1(f.gearMain*L+0.16*L)},${n1(r*0.62)} L${n1(f.gearMain*L+0.16*L)},${n1(r*0.95)} L${n1(f.gearMain*L)},${n1(r*0.95)} Z" fill="#241f18"/>
         <path d="M${n1(f.gearN*L)},${n1(r*0.55)} L${n1(f.gearN*L+0.10*L)},${n1(r*0.70)} L${n1(f.gearN*L+0.10*L)},${n1(r*0.95)} L${n1(f.gearN*L)},${n1(r*0.95)} Z" fill="#241f18"/></g>`:""}
     </g>
     <path d="${P.wing}" fill="${bodyFill}" stroke="${line}" stroke-width="1.4"/>
     ${P.tip?`<path d="${P.tip}" fill="${bodyFill}" stroke="${line}" stroke-width="1.2"/>`:""}
     ${o.noDetails?"":eng}
     ${o.noDetails||wear<=0.35?"":`<ellipse cx="${n1(f.engX*L+f.engL*L*0.9)}" cy="${n1(r*(f.engY||1))}" rx="${n1(f.engL*L*0.5)}" ry="${n1(r*0.55)}" fill="#2b2620" opacity="${(wear*0.35).toFixed(2)}"/>`}
     ${o.noDetails?"":`<g fill="${winCol}">
       <path d="M${n1(0.030*L)},${n1(-r*0.44)} C${n1(0.045*L)},${n1(-r*0.74)} ${n1(0.062*L)},${n1(-r*0.82)} ${n1(0.079*L)},${n1(-r*0.80)}
         L${n1(0.083*L)},${n1(-r*0.36)} C${n1(0.062*L)},${n1(-r*0.30)} ${n1(0.045*L)},${n1(-r*0.22)} ${n1(0.030*L)},${n1(-r*0.44)} Z"/>
       <path d="M${n1(0.087*L)},${n1(-r*0.79)} L${n1(0.101*L)},${n1(-r*0.74)} L${n1(0.099*L)},${n1(-r*0.38)} L${n1(0.087*L)},${n1(-r*0.36)} Z"/>
     </g>
     <path d="M${n1(0.030*L)},${n1(-r*0.44)} C${n1(0.045*L)},${n1(-r*0.74)} ${n1(0.062*L)},${n1(-r*0.82)} ${n1(0.079*L)},${n1(-r*0.80)}"
       stroke="#ffffff" stroke-opacity=".35" stroke-width="0.9" fill="none"/>`}
     ${(L0.layers||[]).map(l=>layerSVG(l,r)).join("")}
     ${(L0.decals||[]).map(k=>{const D=DECALS[k]; if(!D) return "";
        return `<g transform="translate(${n1(D.x*L)},${n1(r*D.y)}) scale(${(D.s*r/13).toFixed(3)})">${D.f(L0.c1)}</g>`;}).join("")}
     ${o.titles?`<text x="${n1(0.135*L)}" y="${n1(-r*1.30)}" textLength="${n1(Math.min(0.42*L, String(title).length*r*0.46))}" lengthAdjust="spacingAndGlyphs" font-family="Barlow Condensed,sans-serif"
        font-size="${n1(titleSize)}" font-weight="700" letter-spacing="${n1(r*0.10)}"
        fill="${titleCol}">${esc(title)}</text>`:""}
     <text x="${n1(0.72*L)}" y="${n1(r*0.78)}" font-family="IBM Plex Mono,monospace" font-size="${n1(r*0.36)}"
       fill="${dark?"rgba(0,0,0,0.45)":"rgba(255,255,255,0.4)"}">${esc(L0.code||"")}-${esc((typeId||"").toUpperCase().slice(0,4))}</text>
   </g></svg>`;
}

/** Darstellung aus einem Grafikpaket: die PNG-Ebenen werden über
    SVG-Masken eingefärbt, damit sie in Listen genauso aussehen wie im
    Editor auf dem Canvas. */
function planeAssetSVG(typeId, L0, o){
  const A=PLANE_ASSETS[typeId]||{};
  const VW=A.w||1600, VH=A.h||520;
  const id="A"+Math.random().toString(36).slice(2,9);
  const body=BODY_COLS[L0.body]||L0.c1;
  const wear=clamp(o.wear||0,0,1);

      ${A.tail?`<rect width="${VW}" height="${VH}" fill="${L0.c1}" mask="url(#${id}t)" style="mix-blend-mode:multiply"/>`:""}

  const cols=52, size=5.4, gap=1.2;
  const rows=Math.ceil(cells.length/cols), W=cols*(size+gap), H=Math.max(rows*(size+gap),8);

    role="img" aria-label="Sitzplan mit ${seats.total} Sitzen">${out}</svg>`;

const WX_KINDS = {

  schnee: {name:"Schneefall",    col:"#9fc4e0", sev:0.85, mon:[11,0,1,2]},

};
const WX_SPOTS = [
  {n:"Nordatlantik", lat:56, lon:-14}, {n:"Nordsee", lat:56, lon:3},
  {n:"Britische Inseln", lat:53, lon:-3}, {n:"Alpenraum", lat:46.6, lon:9},

  {n:"Sahara", lat:26, lon:12}, {n:"Golfregion", lat:25, lon:52},
  {n:"Südostasien", lat:12, lon:104}, {n:"Ostasien", lat:33, lon:120},
  {n:"Australien Ost", lat:-30, lon:150}
];
function rollWeather(){
  const mon=S?S.month:0, out=[];
  const kinds=Object.keys(WX_KINDS).filter(k=>WX_KINDS[k].mon.includes(mon));
  const cnt=2+Math.floor(Math.random()*3);
  /* Zonen bevorzugt dort, wo eigene Flughäfen liegen — sonst bliebe das
     Wetter folgenlose Dekoration. */
  const mine=[];
  if(S){ S.bases.forEach(b=>AP[b]&&mine.push(AP[b]));
    S.routes.forEach(r=>{ if(AP[r.from]) mine.push(AP[r.from]); if(AP[r.to]) mine.push(AP[r.to]); }); }
  const pool=WX_SPOTS.map(sp=>{
    let near=0;
    mine.forEach(a=>{ const dy=a.lat-sp.lat, dx=(a.lon-sp.lon)*Math.cos(rad(a.lat));
      if(Math.sqrt(dx*dx+dy*dy)<26) near++; });
    return {sp, w: 1 + Math.min(near,12)*1.6};
  });
  for(let i=0;i<cnt && pool.length;i++){
    let tot=pool.reduce((a,x)=>a+x.w,0), roll=Math.random()*tot, idx=0;
    for(let j=0;j<pool.length;j++){ roll-=pool[j].w; if(roll<=0){ idx=j; break; } }
    const sp=pool.splice(idx,1)[0].sp;
    const k=pick(kinds.length?kinds:["sturm"]);
    out.push({k, name:WX_KINDS[k].name, spot:sp.n, lat:sp.lat, lon:sp.lon,
      r:rnd(9,20), int:rnd(0.45,1.0),
      dx:rnd(-3.2,4.6), dy:rnd(-1.1,1.1)});   // Zugbahn pro Tag
  }
  if(S) S.weather=out;
  return out;
}
/** Wetterlast eines Flughafens: 0 = klar, 1 = Zentrum einer schweren Zone. */
function wxAt(a){
  if(!S||!S.weather||!a) return 0;
  let w=0;
  S.weather.forEach(z=>{
    const dLat=a.lat-z.lat, dLon=(a.lon-z.lon)*Math.cos(rad((a.lat+z.lat)/2));
    const dist=Math.sqrt(dLat*dLat+dLon*dLon);
    if(dist<z.r) w=Math.max(w,(1-dist/z.r)*z.int*WX_KINDS[z.k].sev);
  });
  return clamp(w,0,1);
}
function wxOnLeg(leg){
  const A=AP[leg.from], B=AP[leg.to];
  const a=wxAt(A), b=wxAt(B);
  let mid=0;
  if(A&&B){ const m=gcPoint(A,B,0.5); mid=wxAt({lat:m.lat, lon:m.lon}); }
  return clamp(Math.max(a,b,mid)*0.62+((a+b+mid)/3)*0.38, 0, 1);
}

/* ==================================================== Umsteigeverkehr ===
   Landet an einer eigenen Station kurz vor dem Abflug ein Zubringer,
   bringt der abgehende Flug zusätzliche Buchungen. */
function transferBonus(map){
  const arrivals={};
  Object.values(map).forEach(list=>list.forEach(e=>{
    if(!S.bases.includes(e.leg.to)) return;
    (arrivals[e.leg.to]=arrivals[e.leg.to]||[]).push(e);
  }));
  Object.values(map).forEach(list=>list.forEach(e=>{
    e.transfer=0;
    if(!S.bases.includes(e.leg.from)) return;
    const feeds=arrivals[e.leg.from]||[];
    let n=0;
    feeds.forEach(f=>{
      if(f.ac.id===e.ac.id && f.leg.i===e.leg.i-1) return;
      const gap=e.leg.dep-f.leg.arr;
      if(gap>=35 && gap<=240) n += (f.leg.dist>1500?1.8:1);
    });
    e.transfer = clamp(n*0.055*(S.codeshare?1.5:1), 0, 0.30);
  }));
}

function cabinOf(ac){

function seatsOf(ac){
  const t=ACT[ac.type], U=seatUnits(t), c=cabinOf(ac);
  const out={biz:Math.max(0,c.biz|0), prem:Math.max(0,c.prem|0), first:Math.max(0,c.first|0), eco:0};
  const used = out.biz*U.biz + out.prem*U.prem + out.first*U.first;
  out.eco = Math.max(0, Math.floor(t.maxSeats - used));
  out.total = out.eco+out.prem+out.biz+out.first;
  return out;
}
/** Komfortwert der Kabine: mehr Platz je Sitz hebt Ruf und Ertrag. */
function comfortOf(ac){
  const t=ACT[ac.type], U=seatUnits(t), s=seatsOf(ac);
  const prem = (s.biz*U.biz + s.prem*U.prem + s.first*U.first)/t.maxSeats;
  const dens = s.total/t.maxSeats;
  return clamp(0.86 + prem*0.85 + (1-dens)*0.20, 0.86, 1.22);
}

/* ============================================================ Nachfrage
   Gravitationsmodell, geeicht an realen Städtepaaren. Die Zahl ist die
   Gesamtnachfrage beider Richtungen aller Anbieter, in Passagieren. */
/* Bahnkonkurrenz: zwischen gut vernetzten Festlandsländern verliert der
   Kurzstreckenflug massiv an Nachfrage. Inseln und Überseemärkte sind davon
   ausgenommen — deshalb trägt Zürich–London mehr Verkehr als Zürich–Paris. */
const RAIL_LAND = new Set(["Schweiz","Schweiz/Frankreich","Deutschland","Frankreich","Österreich",
  "Italien","Belgien","Niederlande","Spanien","Tschechien","Polen","Ungarn","Luxemburg",
  "Slowenien","Slowakei","Portugal"]);
function railFactor(a,b,d){
  const both = RAIL_LAND.has(a.country) && RAIL_LAND.has(b.country);
  if(!both) return d<350 ? 0.75 : 1;
  if(d>=1100) return 1;
  return 0.35 + 0.65*(d/1100);
}
function marketDemand(a,b,monthIdx){
  const d=distKm(a,b);
  let base = BAL.demandK*Math.pow(a.pax,0.62)*Math.pow(b.pax,0.62)/(1+Math.pow(d/1000,BAL.decay));
  const inc=(a.income+b.income)/2, tour=(a.tourism+b.tourism)/2, biz=(a.biz+b.biz)/2;
  let f = Math.pow(inc,0.9)*(0.55*tour+0.45*biz)*railFactor(a,b,d);
  if(a.region!==b.region) f*=BAL.interReg;
  if(d>13000) f*=0.85;
  const seas = 1+(SEASON[monthIdx==null?0:monthIdx]-1)*(0.4+0.75*tour);
  const flat = base*f;
  return {d, weekly: flat*seas*(S?S.economy:1), daily: flat*seas*(S?S.economy:1)/7, base:flat, inc, tour, biz};
}
/* Nachfrage je Buchungsklasse. Innereuropäisch ist der Business-Anteil klein
   und Premium Economy gibt es praktisch nicht — beides erst ab der Mittelstrecke. */
function classShares(m){
  const d=m.d;
  if(d<1600){
    const biz=clamp(0.012+0.030*m.biz, 0.010, 0.070);
    return {first:0, biz, prem:0, eco:1-biz};
  }
  if(d<4000){
    const biz=clamp(0.018+0.040*m.biz, 0.018, 0.100);
    const prem=biz*0.30;
    return {first:0, biz, prem, eco:1-biz-prem};
  }
  const biz=clamp(0.030+0.055*m.biz+0.020, 0.040, 0.150);
  const prem=biz*0.55;
  const first=d>7000 ? biz*0.10 : 0;
  return {first, biz, prem, eco:1-biz-prem-first};
}
function baseFare(dist,klass){
  const y = BAL.yieldBase*Math.pow(1000/Math.max(dist,120),BAL.yieldTaper);
  const eco = BAL.fareFix + dist*y;
  const m = klass==="biz"?BAL.mulBiz : klass==="prem"?BAL.mulPrem : klass==="first"?BAL.mulFirst : 1;
  return eco*m;
}
/** Flüge der Konkurrenz pro Woche, beide Richtungen zusammen. */
function competitorBase(a,b){
  const m=marketDemand(a,b,null);
  const typical = m.d<2500 ? 175 : m.d<6500 ? 250 : 300;
  return clamp(m.base*BAL.incumbent/typical, 2, 1400);
}

/* ================================================= Flugplan und Sperrzeiten
   Jedes Flugzeug hat einen Tagesumlauf: eine Startzeit, eine Kette von Zielen
   ab der Heimatbasis und die Wochentage, an denen der Umlauf fliegt. */
function blockMinutes(t, d){ return Math.round((d/t.speed + BAL.taxiHours)*60); }
/** Abfertigungszeit eines Musters an einem bestimmten Flughafen. */
function turnAt(t, iata){
  return Math.max(15, t.turn - (hasUpgrade(iata,"boden") ? 10 : 0));
}
/* Der Wochenplan: für jeden Wochentag eine eigene Kette von Zielen mit eigener
   Startzeit. Ein Tag beginnt dort, wo der Vortag geendet hat — nur so lassen
   sich Langstrecken abbilden, bei denen Hin- und Rückflug an verschiedenen
   Tagen liegen. */
function emptyDay(){ return {start:390, dests:[], nums:[]}; }
function ensurePlan(ac){
  if(!ac.plan) ac.plan={};
  const p=ac.plan;
  /* Aus der alten Fassung mit einem Umlauf und Wochentagsmaske übernehmen */
  if(!Array.isArray(p.week)){
    const old={start:p.start!=null?p.start:390, dests:Array.isArray(p.dests)?p.dests.slice():[],
      nums:Array.isArray(p.nums)?p.nums.slice():[]};
    const mask=Array.isArray(p.days)?p.days:[1,1,1,1,1,1,1];
    p.week=[0,1,2,3,4,5,6].map(d=> mask[d]
      ? {start:old.start, dests:old.dests.slice(), nums:old.nums.slice()}
      : emptyDay());
    delete p.start; delete p.dests; delete p.days; delete p.nums;
  }
  for(let d=0;d<7;d++){
    const w=p.week[d]||(p.week[d]=emptyDay());
    if(!Array.isArray(w.dests)) w.dests=[];
    if(!Array.isArray(w.nums)) w.nums=[];
    if(w.start==null) w.start=390;
    w.nums.length=w.dests.length;   // nur noch für eigene Überschreibungen
  }
  return p;
}
const dayPlan = (ac,d)=> ensurePlan(ac).week[d];
/* Flugnummern gehören zur Strecke, nicht zum Wochentag: LX 318 fliegt jeden
   Tag Zürich–Paris. Vergeben wird einmal je Richtung; der Rückflug bekommt
   die nächsthöhere Nummer. Die Zuordnung bleibt im Spielstand erhalten. */
let PAIR_OPS={sig:null, map:null};
/** Reihenfolge der Umläufe auf einer Strecke — damit die zweite Tagesfrequenz
    eine eigene Nummer bekommt, so wie LX 316, 318 und 320 nach London. */
function pairOperators(){
  const sig=S.fleet.map(a=>(a.plan&&a.plan.week?a.plan.week.map(w=>(w.dests||[]).join(",")).join("|"):"")).join("#");
  if(PAIR_OPS.sig===sig) return PAIR_OPS.map;
  const map={};
  S.fleet.forEach(ac=>{
    const pl=ac.plan; if(!pl||!Array.isArray(pl.week)) return;
    const pos=weekPositions(ac);
    const seen=new Set();
    for(let d=0;d<7;d++){
      let cur=pos[d]; const local={};
      (pl.week[d].dests||[]).forEach(dest=>{
        const k=cur+">"+dest;
        local[k]=(local[k]||0)+1;
        const tag=ac.id+"#"+(local[k]-1);
        if(!seen.has(k+"|"+tag)){ seen.add(k+"|"+tag); (map[k]=map[k]||[]).push(tag); }
        cur=dest;
      });
    }
  });
  PAIR_OPS={sig, map};
  return map;
}
function flightNumFor(from, to, tag){
  S.flightNums=S.flightNums||{};
  const ops=pairOperators()[from+">"+to]||[];
  const slot=Math.max(0, ops.indexOf(tag));
  const key=from+">"+to+(slot?"#"+slot:""), rev=to+">"+from+(slot?"#"+slot:"");
  if(S.flightNums[key]) return S.flightNums[key];
  const used=new Set(Object.values(S.flightNums));
  const back=S.flightNums[rev];
  if(back && !used.has(back+1) && back%2===0){
    S.flightNums[key]=back+1; return back+1;
  }
  let cand=Math.max(S.flightStart||100,100);
  if(cand%2) cand++;
  while(used.has(cand)||used.has(cand+1)) cand+=2;
  S.flightNums[key]=cand;
  return cand;
}
/** Nummern, die zu keiner geplanten Strecke mehr gehören, wieder freigeben. */
function pruneFlightNumbers(){
  if(!S.flightNums) return;
  const live=new Set();
  const ops=pairOperators();
  Object.keys(ops).forEach(k=>ops[k].forEach((t,i)=>live.add(i?k+"#"+i:k)));
  Object.keys(S.flightNums).forEach(k=>{ if(!live.has(k)) delete S.flightNums[k]; });
}
/** Wo steht die Maschine zu Beginn jedes Wochentags? */
function weekPositions(ac){
  const p=ensurePlan(ac);
  let pos=ac.base;
  /* zweimal umlaufen, damit sich die Kette über den Wochenwechsel einpendelt */
  for(let pass=0;pass<2;pass++){
    for(let d=0;d<7;d++){
      const w=p.week[d];
      if(w.dests.length) pos=w.dests[w.dests.length-1];
    }
  }
  const start=[]; let cur=pos;
  for(let d=0;d<7;d++){
    start[d]=cur;
    const w=p.week[d];
    if(w.dests.length) cur=w.dests[w.dests.length-1];
  }
  return start;
}
/** Umlauf eines einzelnen Wochentags mit Zeiten und Prüfungen. */
function scheduleDay(ac, d, fromCode){
  const t=ACT[ac.type], w=dayPlan(ac,d);
  const legs=[], warn=[];
  let cur=AP[fromCode||ac.base], time=w.start, blockSum=0;
  if(!cur) return {legs, warn:["Standort unbekannt"], duty:0, blockSum:0, endsAt:fromCode};
  const local={};
  w.dests.forEach((code,i)=>{
    const to=AP[code];
    if(!to){ warn.push(`Ziel ${code} unbekannt`); return; }
    const pk=cur.iata+">"+to.iata;
    local[pk]=(local[pk]||0)+1;
    const tag=ac.id+"#"+(local[pk]-1);
    const dist=distKm(cur,to), bm=blockMinutes(t,dist);
    const dep=time, arr=dep+bm;
    const leg={i, day:d, from:cur.iata, to:to.iata, dep, arr, block:bm, dist, issues:[],
      no: w.nums[i] || flightNumFor(cur.iata, to.iata, tag)};
    if(dist>t.range*0.97) leg.issues.push("Reichweite");
    if(cur.runway<t.runway) leg.issues.push(`Piste ${cur.iata}`);
    if(to.runway<t.runway) leg.issues.push(`Piste ${to.iata}`);
    if(inCurfew(cur,dep)) leg.issues.push(`Start ${cur.iata} in Sperrzeit`);
    if(inCurfew(to,arr)) leg.issues.push(`Landung ${to.iata} in Sperrzeit`);
    legs.push(leg);
    blockSum+=bm;
    time=arr+turnAt(t,to.iata);
    cur=to;
  });
  const duty=legs.length?legs[legs.length-1].arr-legs[0].dep:0;
  if(blockSum>t.block*60) warn.push(`${DAYS[d]}: Blockzeit ${(blockSum/60).toFixed(1)} h über dem Tageslimit von ${t.block} h`);
  if(duty>BAL.maxDuty) warn.push(`${DAYS[d]}: Dienstzeit ${(duty/60).toFixed(1)} h über ${BAL.maxDuty/60} h`);
  legs.forEach(l=>{ if(l.issues.length) warn.push(`${DAYS[d]} ${l.from}–${l.to}: ${l.issues.join(", ")}`); });
  return {legs, warn, duty, blockSum, endsAt: legs.length?legs[legs.length-1].to:(fromCode||ac.base)};
}
/** Der ganze Wochenplan. */
function scheduleOf(ac){
  const pos=weekPositions(ac);
  const week=[], warn=[];
  let blockWeek=0, flights=0;
  for(let d=0;d<7;d++){
    const sd=scheduleDay(ac,d,pos[d]);
    week.push(sd); warn.push(...sd.warn);
    blockWeek+=sd.blockSum; flights+=sd.legs.length;
  }
  const endsHome = pos[0]===ac.base;
  if(!endsHome) warn.push(`Der Wochenplan endet in ${pos[0]}, nicht an der Basis ${ac.base}`);
  return {week, pos, warn, blockWeek, flights, endsHome,
    legs: week.reduce((a,x)=>a.concat(x.legs),[])};
}
const planDays = ac => scheduleOf(ac).week.reduce((s,x)=>s+(x.legs.length?1:0),0);
/** Alle Flüge der Woche, gruppiert nach Städtepaar. */
function weeklyLegs(){
  const map={};
  S.fleet.forEach(ac=>{
    if(ac.status!=="aktiv") return;
    const sch=scheduleOf(ac);
    sch.legs.forEach(l=>{
      if(l.issues.length) return;
      const key=routeKey(l.from,l.to);
      (map[key]=map[key]||[]).push({ac, leg:l, days:1});
    });
  });
  transferBonus(map);
  return map;
}
const routeKey = (a,b)=> a<b ? a+"-"+b : b+"-"+a;
function findRoute(a,b){ const k=routeKey(a,b); return S.routes.find(r=>r.key===k); }
function ensureRoute(a,b){
  let r=findRoute(a,b);
  if(!r){ r={key:routeKey(a,b), from:a<b?a:b, to:a<b?b:a, fare:1.0,
      comp:competitorBase(AP[a],AP[b]), months:0, last:null};
    S.routes.push(r); }
  return r;
}
function syncRoutes(){
  const map=weeklyLegs();
  Object.keys(map).forEach(k=>{ const [a,b]=k.split("-"); ensureRoute(a,b); });
  S.routes = S.routes.filter(r=>map[r.key] || r.keep);
  return map;
}
function airportMovements(){
  const map=weeklyLegs(), out={};
  Object.values(map).forEach(list=>list.forEach(e=>{
    out[e.leg.from]=(out[e.leg.from]||0)+1;
    out[e.leg.to]=(out[e.leg.to]||0)+1;
  }));
  return out;
}
function acWeeklyBlock(ac){ return scheduleOf(ac).blockWeek/60; }
function acCanFly(ac,A,B){
  const t=ACT[ac.type], d=distKm(A,B);
  if(d>t.range*0.97) return "Reichweite";
  if(A.runway<t.runway||B.runway<t.runway) return "Piste";
  return null;
}
const acValue = ac => ACT[ac.type].price*1e6*Math.max(Math.pow(0.93,ac.age/12),0.14);
const fleetValue = ()=> S.fleet.reduce((s,ac)=>s+(ac.lease?0:acValue(ac)),0);

/* ----------------------------------------------- Musterberechtigungen --- */
function pilotNeed(){
  const need={};
  S.fleet.filter(a=>a.status==="aktiv").forEach(ac=>{
    const t=ACT[ac.type];
    const crews=Math.ceil(Math.max(acWeeklyBlock(ac),1)/BAL.dutyPerCrewWeek);
    need[t.rating]=(need[t.rating]||0)+crews*2;
  });
  return need;
}
function cabinNeed(){
  let n=0;
  S.fleet.filter(a=>a.status==="aktiv").forEach(ac=>{
    const t=ACT[ac.type];
    n += Math.ceil(Math.max(acWeeklyBlock(ac),1)/BAL.dutyPerCrewWeek)*t.cabin;
  });
  return n;
}
function pilotFactors(){
  const need=pilotNeed(), f={};
  for(const r in need) f[r]= need[r] ? clamp((S.pilots[r]||0)/need[r],0,1) : 1;
  return f;
}
function slotFactors(){
  const use=airportMovements(), f={};
  for(const k in use){ const tot=slotsTotal(AP[k]); f[k]= use[k]>tot ? tot/use[k] : 1; }
  return f;
}


/* ==================================================== Charteraufträge ===
   Einzelaufträge mit gutem Ertrag, die eine Maschine für einige Tage
   aus dem Linienbetrieb nehmen. */
const CHARTER_THEMES = [
  {t:"Fussball-Nationalmannschaft", d:"Mannschaft, Betreuerstab und Ausrüstung", pax:150, pay:1.55},
  {t:"Sinfonieorchester", d:"Musikerinnen, Musiker und Instrumente", pax:110, pay:1.45},
  {t:"Kongressdelegation", d:"Geschlossene Gruppe eines Grosskonzerns", pax:130, pay:1.70},
  {t:"Pilgerreise", d:"Reisegruppe mit festem Termin", pax:220, pay:1.30},
  {t:"Pauschalreiseveranstalter", d:"Ferienflug für ein Reisebüro", pax:170, pay:1.25},
  {t:"Filmproduktion", d:"Team und Technik einer Serienproduktion", pax:90, pay:1.80},
  {t:"Regierungsdelegation", d:"Staatsbesuch mit Presse", pax:100, pay:2.10},
  {t:"Skiteam", d:"Wintersportler mit Material", pax:80, pay:1.60},
  {t:"Hilfsorganisation", d:"Fachkräfte und Material für einen Einsatz", pax:120, pay:1.35},
  {t:"Kreuzfahrtreederei", d:"Passagierwechsel für ein Schiff", pax:260, pay:1.28}
];
function rollCharters(){
  S.charterJobs=(S.charterJobs||[]).filter(j=>--j.left>0);
  if(!S.bases.length) return;
  let n=Math.floor(rnd(0,2.6));
  if(!(S.charterJobs||[]).length) n=Math.max(n,1);
  for(let i=0;i<n;i++){
    const from=pick(S.bases), A=AP[from];
    const cands=APL.filter(b=>b.iata!==from && distKm(A,b)>350 && distKm(A,b)<9000);
    if(!cands.length) continue;
    const B=pick(cands), th=pick(CHARTER_THEMES);
    const d=distKm(A,B);
    const pax=Math.round(th.pax*rnd(0.8,1.2));
    const pay=Math.round((BAL.fareFix+d*BAL.yieldBase*Math.pow(1000/Math.max(d,120),BAL.yieldTaper))
      *pax*2*th.pay*rnd(0.9,1.15)/1000)*1000;
    S.charterJobs.push({id:"CH"+Date.now().toString(36)+i+Math.floor(Math.random()*99),
      from, to:B.iata, title:th.t, desc:th.d, pax, pay, dist:d,
      days: d>4000?4:2, left: 1+Math.floor(rnd(0,2))});
  }
}
function charterFactors(){ return {}; }   // Charter blockt die Maschine im Tagesplan
function acceptCharter(jobId, acId){
  const j=(S.charterJobs||[]).find(x=>x.id===jobId); if(!j) return;
  const ac=S.fleet.find(x=>x.id===acId); if(!ac) return;
  S.charters=S.charters||[];
  S.charters.push({job:j.id, ac:acId, from:j.from, to:j.to, title:j.title,
