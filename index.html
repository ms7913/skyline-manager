        <button class="sm" data-add="circle">Kreis</button>
        <button class="sm" data-add="line">Linie</button>
        <button class="sm" data-add="text">Text</button>
        ${Object.entries(DECALS).map(([k,v])=>`<button class="sm" data-adddec="${k}">${v.n}</button>`).join("")}
        ${MISC.decals.map((x,i)=>`<button class="sm" data-addimg="${i}">${esc(x.name)}</button>`).join("")}
        ${MISC.logo?`<button class="sm" data-addlogo="1">Bildmarke</button>`:""}
      </div>
      ${MISC.decals.length||MISC.logo?"":`<p class="dim" style="font-size:10.5px;margin:-2px 0 6px">Eigene Aufkleber lassen sich unter <span class="mono">${MISC_DIR}decals/</span> ablegen; eine Bildmarke als <span class="mono">${MISC_DIR}logo.png</span>.</p>`}
      <p class="dim" style="font-size:11px">Element anklicken und ziehen. Die Werte darunter gelten für die gewählte Ebene.</p>
      <h3 class="sub">Ebenen (${L.layers.length})</h3>
      <div id="elist">${L.layers.length?L.layers.map((l,i)=>
        `<div class="choice ${i===EDIT_SEL?'on':''}" data-l="${i}">
          <div><div class="t">${l.type==="decal"?esc(DECALS[l.id]?DECALS[l.id].n:l.id):l.type==="text"?esc(l.text||"TEXT"):l.type}</div>
            <div class="d">x ${fmt(l.x,0)} · y ${fmt(l.y,2)} · ${fmt((l.scale==null?1:l.scale)*100,0)}% · ${fmt(l.rot||0,0)}°</div></div>
          <span class="pill" style="background:${l.color};width:16px;height:16px;padding:0;border-radius:3px"></span></div>`).join("")
        :`<div class="dim" style="padding:8px">Noch keine Ebenen. Oben ein Element hinzufügen.</div>`}</div>
      ${sel?`<h3 class="sub">Gewählte Ebene</h3>
        <label class="f">Grösse <span class="mono">${fmt((sel.scale==null?1:sel.scale)*100,0)}%</span></label>
        <input type="range" id="esc" min="20" max="400" value="${Math.round((sel.scale==null?1:sel.scale)*100)}">
        <label class="f">Drehung <span class="mono">${fmt(sel.rot||0,0)}°</span></label>
        <input type="range" id="erot" min="-180" max="180" value="${Math.round(sel.rot||0)}">
        <label class="f">Deckkraft <span class="mono">${fmt((sel.op==null?1:sel.op)*100,0)}%</span></label>
        <input type="range" id="eop" min="10" max="100" value="${Math.round((sel.op==null?1:sel.op)*100)}">
        <label class="f">Farbe</label>
        <div class="swatches" id="ecol">${PALETTE.concat(ACCENTS).map(c=>
          `<i data-c="${c}" style="background:${c}" class="${sel.color===c?'on':''}"></i>`).join("")}</div>
        <input type="color" id="ecolp" value="${sel.color||"#ffffff"}" style="margin-top:6px">
        ${sel.type==="text"?`<label class="f">Text</label><input type="text" id="etxt" value="${esc(sel.text||"")}" maxlength="24">
          <label class="f">Schrift</label><div class="opts" id="efont">
            ${[["disp","Schmal"],["mono","Technisch"],["serif","Serif"]].map(([k,v])=>
              `<button class="sm ${(sel.font||"disp")===k?'on':''}" data-f="${k}">${v}</button>`).join("")}</div>
          <label class="f">Schriftgrad <span class="mono">${fmt(sel.size||30,0)}</span></label>
          <input type="range" id="esize" min="10" max="80" value="${Math.round(sel.size||30)}">`:""}
        <div class="row" style="margin-top:8px">
          <button class="sm" id="edup">Duplizieren</button>
          <button class="sm" id="efront">Nach vorn</button>
          <button class="sm" id="edel">Löschen</button></div>`:""}
      <div class="row" style="margin-top:10px">
        <button class="sm" id="eclear">Alle Ebenen löschen</button>
        <button class="sm" id="eapply">Auf Flotte anwenden</button></div>`;
    paint();
    wire();
  };
  const paint=()=>{
    const cv=$("#ecv"); if(!cv) return;
    renderPlaneCanvas(cv, S.editType, L, {wear:0});
    /* Auswahlrahmen als Overlay */
    const t=ACT[S.editType], VW=1240, VH=t.shape==="dd"?300:280;
    const P=planeGeom(t.shape), sc=0.42+0.58*clamp(t.len/2.04,0.32,1);
    const x0=40, yc=t.shape==="dd"?172:165;
    const ov=$("#eov"); ov.setAttribute("viewBox",`0 0 ${VW} ${VH}`);
    ov.innerHTML = EDIT_SEL>=0 && L.layers[EDIT_SEL] ? (()=>{
      const l=L.layers[EDIT_SEL], b=layerBox(l);
      const cx=x0+l.x*sc, cy=yc+(l.y*P.r)*sc;
      return `<rect x="${cx-b.w*sc/2-4}" y="${cy-b.h*sc/2-4}" width="${b.w*sc+8}" height="${b.h*sc+8}"
        fill="none" stroke="#f2a93b" stroke-width="1.6" stroke-dasharray="5 4"/>`;
    })() : "";
  };
  const toUnit=(ev)=>{
    const cv=$("#ecv"), rect=cv.getBoundingClientRect();
    const t=ACT[S.editType], VW=1240, VH=t.shape==="dd"?300:280;
    const P=planeGeom(t.shape), sc=0.42+0.58*clamp(t.len/2.04,0.32,1);
    const x0=40, yc=t.shape==="dd"?172:165;
    const px2=(ev.clientX-rect.left)/rect.width*VW;
    const py2=(ev.clientY-rect.top)/rect.height*VH;
    return {x:(px2-x0)/sc, y:(py2-yc)/sc/P.r};
  };
  const hit=(u)=>{
    const P=planeGeom(ACT[S.editType].shape);
    for(let i=L.layers.length-1;i>=0;i--){
      const l=L.layers[i], b=layerBox(l);
      if(Math.abs(u.x-l.x)<Math.max(b.w/2,14) && Math.abs((u.y-l.y)*P.r)<Math.max(b.h/2,12)) return i;
    }
    return -1;
  };
  const wire=()=>{
    $("#etype").onchange=e=>{S.editType=e.target.value; draw();};
    box.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{
      const ty=b.dataset.add;
      L.layers.push({type:ty, x:500, y:-0.2, scale:1, rot:0, color:L.c2||"#ffffff",
        text: ty==="text"?(S.name||"AIRLINE").toUpperCase():undefined, size:30, op:1});
      EDIT_SEL=L.layers.length-1; draw();});
    box.querySelectorAll("[data-addimg]").forEach(b=>b.onclick=()=>{
      const x=MISC.decals[+b.dataset.addimg]; if(!x) return;
      const sc=90/Math.max(x.w,x.h);
      L.layers.push({type:"img", url:x.url, iw:Math.round(x.w*sc), ih:Math.round(x.h*sc),
        x:600, y:-0.3, scale:1, rot:0, op:1});
      EDIT_SEL=L.layers.length-1; draw();});
    const bl=box.querySelector("[data-addlogo]");
    if(bl) bl.onclick=()=>{
      const sc=90/Math.max(MISC.logo.w,MISC.logo.h);
      L.layers.push({type:"img", url:MISC.logo.url, iw:Math.round(MISC.logo.w*sc),
        ih:Math.round(MISC.logo.h*sc), x:820, y:-0.7, scale:1, rot:0, op:1});
      EDIT_SEL=L.layers.length-1; draw();};
    box.querySelectorAll("[data-adddec]").forEach(b=>b.onclick=()=>{
      L.layers.push({type:"decal", id:b.dataset.adddec, x:600, y:-0.3, scale:1, rot:0,
        color:L.c1||"#c8102e", dsc:1.6, op:1});
      EDIT_SEL=L.layers.length-1; draw();});
    box.querySelectorAll("#elist .choice").forEach(c=>c.onclick=()=>{EDIT_SEL=+c.dataset.l; draw();});
    const sel=EDIT_SEL>=0?L.layers[EDIT_SEL]:null;
    if(sel){
      $("#esc").oninput=e=>{sel.scale=+e.target.value/100; paint();};
      $("#esc").onchange=draw;
      $("#erot").oninput=e=>{sel.rot=+e.target.value; paint();};
      $("#erot").onchange=draw;
      $("#eop").oninput=e=>{sel.op=+e.target.value/100; paint();};
      $("#eop").onchange=draw;
      box.querySelectorAll("#ecol i").forEach(i=>i.onclick=()=>{sel.color=i.dataset.c; draw();});
      $("#ecolp").oninput=e=>{sel.color=e.target.value; paint();};
      $("#ecolp").onchange=draw;
      const tx=$("#etxt"); if(tx) tx.oninput=e=>{sel.text=e.target.value; paint();};
      const sz=$("#esize"); if(sz){ sz.oninput=e=>{sel.size=+e.target.value; paint();}; sz.onchange=draw; }
      box.querySelectorAll("#efont button").forEach(b=>b.onclick=()=>{sel.font=b.dataset.f; draw();});
      $("#edel").onclick=()=>{L.layers.splice(EDIT_SEL,1); EDIT_SEL=-1; draw(); render();};
      $("#edup").onclick=()=>{const c=Object.assign({},sel); c.x+=40; c.y+=0.25;
        L.layers.push(c); EDIT_SEL=L.layers.length-1; draw();};
      $("#efront").onclick=()=>{const c=L.layers.splice(EDIT_SEL,1)[0]; L.layers.push(c);
        EDIT_SEL=L.layers.length-1; draw();};
    }
    $("#eclear").onclick=()=>{L.layers=[]; EDIT_SEL=-1; draw(); render();};
    $("#eapply").onclick=()=>{ applyBrand(); render(); toast("Bemalung auf die Flotte übernommen."); };
    /* Ziehen auf dem Canvas */
    const cv=$("#ecv");
    let drag=null;
    cv.addEventListener("pointerdown",e=>{
      const u=toUnit(e), i=hit(u);
      EDIT_SEL=i;
      if(i>=0){ drag={i, dx:L.layers[i].x-u.x, dy:L.layers[i].y-u.y}; cv.setPointerCapture(e.pointerId); }
      draw();
    });
    cv.addEventListener("pointermove",e=>{
      if(!drag) return;
      const u=toUnit(e), l=L.layers[drag.i];
      l.x=clamp(u.x+drag.dx, -40, 1080); l.y=clamp(u.y+drag.dy, -3.2, 2.6);
      paint();
    });
    const stop=()=>{ if(drag){ drag=null; draw(); } };
    cv.addEventListener("pointerup",stop); cv.addEventListener("pointercancel",stop);
  };
  draw();
}

/* ====================================================== Wolkenspeicher ===
   Spielstände liegen bei Firebase, damit derselbe Stand am Rechner und am
   Telefon offen ist. Angesprochen wird die REST-Schnittstelle direkt — kein
   SDK, keine zusätzlichen Ladezeiten, die Einzeldatei bleibt intakt.
   Die Zugangsdaten des eigenen Firebase-Projekts trägt man einmal ein;
   sie liegen im Browser und wandern nie in den Spielstand. */
const CLOUD = {
  cfg:null, tok:null, uid:null, mail:null, exp:0, busy:false, last:null
};
function cloudLoadCfg(){
  try{ const raw=localStorage.getItem("skyline.cloud");
    if(raw) CLOUD.cfg=JSON.parse(raw); }catch(e){}
  try{ const raw=localStorage.getItem("skyline.session");
    if(raw){ const s0=JSON.parse(raw);
      if(s0.exp>Date.now()){ Object.assign(CLOUD,s0); } } }catch(e){}
}
function cloudSaveCfg(){
  try{ localStorage.setItem("skyline.cloud", JSON.stringify(CLOUD.cfg||{})); }catch(e){}
}
function cloudSaveSession(){
  try{ localStorage.setItem("skyline.session",
    JSON.stringify({tok:CLOUD.tok, uid:CLOUD.uid, mail:CLOUD.mail, exp:CLOUD.exp, refresh:CLOUD.refresh})); }catch(e){}
}
function cloudReady(){ return !!(CLOUD.cfg && CLOUD.cfg.apiKey && CLOUD.cfg.projectId); }
function cloudSignedIn(){ return !!(CLOUD.tok && CLOUD.uid && CLOUD.exp>Date.now()); }

async function idtRequest(path, body){
  const r=await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:${path}?key=${encodeURIComponent(CLOUD.cfg.apiKey)}`,
    {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
  const j=await r.json();
  if(!r.ok) throw new Error((j.error&&j.error.message)||"Anmeldung fehlgeschlagen");
  return j;
}
async function cloudSignIn(mail, pw, isNew){
  const j=await idtRequest(isNew?"signUp":"signInWithPassword",
    {email:mail, password:pw, returnSecureToken:true});
  CLOUD.tok=j.idToken; CLOUD.uid=j.localId; CLOUD.mail=mail;
  CLOUD.refresh=j.refreshToken;
  CLOUD.exp=Date.now()+(+j.expiresIn||3600)*1000-60000;
  cloudSaveSession();
  return j;
}
async function cloudRefresh(){
  if(!CLOUD.refresh) throw new Error("Bitte neu anmelden");
  const r=await fetch(`https://securetoken.googleapis.com/v1/token?key=${encodeURIComponent(CLOUD.cfg.apiKey)}`,
    {method:"POST", headers:{"Content-Type":"application/x-www-form-urlencoded"},
     body:"grant_type=refresh_token&refresh_token="+encodeURIComponent(CLOUD.refresh)});
  const j=await r.json();
  if(!r.ok) throw new Error("Sitzung abgelaufen, bitte neu anmelden");
  CLOUD.tok=j.id_token; CLOUD.uid=j.user_id; CLOUD.refresh=j.refresh_token;
  CLOUD.exp=Date.now()+(+j.expires_in||3600)*1000-60000;
  cloudSaveSession();
}
async function cloudToken(){
  if(!cloudSignedIn()) await cloudRefresh();
  return CLOUD.tok;
}
/** Spielstand für die Übertragung eindampfen und komprimieren. */
async function packSave(){
  const lean=Object.assign({}, S);
  lean.flightHistory=(S.flightHistory||[]).slice(0,40);
  lean.ticker=(S.ticker||[]).slice(0,10);
  lean.reviews=(S.reviews||[]).slice(0,30);
  lean.log=(S.log||[]).slice(0,60);
  const json=JSON.stringify(lean);
  if(typeof CompressionStream==="undefined") return {enc:"plain", data:json};
  const cs=new CompressionStream("gzip");
  const blob=await new Response(new Blob([json]).stream().pipeThrough(cs)).blob();
  const buf=new Uint8Array(await blob.arrayBuffer());
  let bin=""; for(let i=0;i<buf.length;i+=8192) bin+=String.fromCharCode.apply(null, buf.subarray(i,i+8192));
  return {enc:"gzip", data:btoa(bin)};
}
async function unpackSave(enc, data){
  if(enc!=="gzip") return JSON.parse(data);
  const bin=atob(data); const buf=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) buf[i]=bin.charCodeAt(i);
  const ds=new DecompressionStream("gzip");
  const txt=await new Response(new Blob([buf]).stream().pipeThrough(ds)).text();
  return JSON.parse(txt);
}
function fsUrl(slot){
  return `https://firestore.googleapis.com/v1/projects/${encodeURIComponent(CLOUD.cfg.projectId)}`
    +`/databases/(default)/documents/skyline/${encodeURIComponent(CLOUD.uid)}/saves/${encodeURIComponent(slot||"aktuell")}`;
}
async function cloudPush(slot, silent){
  if(!cloudReady()) { if(!silent) toast("Zuerst die Firebase-Zugangsdaten hinterlegen."); return; }
  if(CLOUD.busy) return;
  CLOUD.busy=true;
  try{
    const tok=await cloudToken();
    const {enc,data}=await packSave();
    const body={fields:{
      enc:{stringValue:enc}, data:{stringValue:data},
      airline:{stringValue:S.name||""}, code:{stringValue:S.code||""},
      datum:{stringValue:clockLabel()},
      cash:{doubleValue:Math.round(S.cash)},
      flotte:{integerValue:String(S.fleet.length)},
      gespeichert:{timestampValue:new Date().toISOString()},
      version:{integerValue:"6"}
    }};
    const r=await fetch(fsUrl(slot), {method:"PATCH",
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+tok},
      body:JSON.stringify(body)});
    if(!r.ok){ const j=await r.json().catch(()=>({}));
      throw new Error((j.error&&j.error.message)||("HTTP "+r.status)); }
    CLOUD.last=new Date();
    if(!silent) toast("Spielstand in der Cloud gesichert.");
  }catch(e){ if(!silent) toast("Cloud-Fehler: "+e.message); }
  finally{ CLOUD.busy=false; if(tab==="data") renderPane(); }
}
async function cloudPull(slot){
  if(!cloudReady()){ toast("Zuerst die Firebase-Zugangsdaten hinterlegen."); return; }
  try{
    const tok=await cloudToken();
    const r=await fetch(fsUrl(slot), {headers:{"Authorization":"Bearer "+tok}});
    if(r.status===404){ toast("In der Cloud liegt noch kein Spielstand."); return; }
    if(!r.ok) throw new Error("HTTP "+r.status);
    const j=await r.json();
    const f=j.fields||{};
    const d=await unpackSave(f.enc?f.enc.stringValue:"plain", f.data.stringValue);
    if(!d||!d.name||!Array.isArray(d.bases)) throw new Error("Kein gültiger Spielstand");
    adoptSave(d);
    toast(`${S.name} aus der Cloud geladen — ${monthLabel()}`);
  }catch(e){ toast("Cloud-Fehler: "+e.message); }
}
async function cloudList(){
  if(!cloudReady()||!cloudSignedIn()) return [];
  try{
    const tok=await cloudToken();
    const r=await fetch(fsUrl("").replace(/\/$/,""), {headers:{"Authorization":"Bearer "+tok}});
    if(!r.ok) return [];
    const j=await r.json();
    return (j.documents||[]).map(doc=>{
      const f=doc.fields||{}, nm=doc.name.split("/").pop();
      return {slot:nm, airline:f.airline?f.airline.stringValue:"",
        datum:f.datum?f.datum.stringValue:"", cash:f.cash?+f.cash.doubleValue:0,
        gespeichert:f.gespeichert?f.gespeichert.timestampValue:""};
    });
  }catch(e){ return []; }
}

/* ============================================ Grafikpaket vorbereiten ====
   Nimmt eine fertige Seitenansicht (weisses Flugzeug auf weissem Grund),
   trennt den Hintergrund heraus, erzeugt die Farbmaske und bestimmt den
   Bezugspunkt für Beschriftung und freie Ebenen. Heraus kommen die PNG und
   die Konfigurationszeile für PLANE_ASSETS. */
const PREP = {img:null, w:0, h:0, base:null, mask:null, tail:null, box:null, anchor:null};

/** Hintergrund vom Rand her wegnehmen: nur was mit dem Bildrand verbunden
    ist, gilt als Hintergrund. So bleibt der weisse Rumpf erhalten. */
function prepCutout(src, tol){
  const w=src.width, h=src.height;
  const c=document.createElement("canvas"); c.width=w; c.height=h;
  const ctx=c.getContext("2d");
  ctx.drawImage(src,0,0);
  const im=ctx.getImageData(0,0,w,h), d=im.data;
  const seen=new Uint8Array(w*h);
  const stack=[];
  const push=(x,y)=>{ if(x<0||y<0||x>=w||y>=h) return;
    const i=y*w+x; if(seen[i]) return; seen[i]=1; stack.push(i); };
  const bright=i=>{ const o=i*4; return (d[o]+d[o+1]+d[o+2])/3; };
  for(let x=0;x<w;x++){ push(x,0); push(x,h-1); }
  for(let y=0;y<h;y++){ push(0,y); push(w-1,y); }
  const lim=255-tol;
  const out=new Uint8Array(w*h);          // 1 = Hintergrund
  while(stack.length){
    const i=stack.pop();
    if(bright(i)<lim) continue;           // dunkler als die Toleranz: Kante erreicht
    out[i]=1;
    const x=i%w, y=(i-x)/w;
    push(x+1,y); push(x-1,y); push(x,y+1); push(x,y-1);
  }
  for(let i=0;i<w*h;i++) if(out[i]) d[i*4+3]=0;
  ctx.putImageData(im,0,0);
  return c;
}
/** Umgrenzung der sichtbaren Zeichnung. */
function prepBounds(cv){
  const w=cv.width, h=cv.height;
  const d=cv.getContext("2d").getImageData(0,0,w,h).data;
  let x0=w,y0=h,x1=0,y1=0;
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    if(d[(y*w+x)*4+3]>24){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; }
  }
  return {x0,y0,x1,y1,w:x1-x0+1,h:y1-y0+1};
}
/** Farbmaske: helle, deckende Flächen dürfen Farbe annehmen. Fenster,
    Cockpitscheiben und Triebwerkseinläufe sind dunkel und bleiben aussen vor. */
function prepMask(cv, thr, region){
  const w=cv.width, h=cv.height;
  const src=cv.getContext("2d").getImageData(0,0,w,h).data;
  const c=document.createElement("canvas"); c.width=w; c.height=h;
  const ctx=c.getContext("2d");
  const im=ctx.createImageData(w,h), d=im.data;
  for(let i=0;i<w*h;i++){
    const o=i*4;
    const x=i%w, y=(i-x)/w;
    let on = src[o+3]>150 && (src[o]+src[o+1]+src[o+2])/3 > thr;
    if(on && region){
      on = x>=region.x0 && x<=region.x1 && y>=region.y0 && y<=region.y1;
    }
    d[o]=d[o+1]=d[o+2]= on?255:0;
    d[o+3]=255;
  }
  ctx.putImageData(im,0,0);
  return c;
}
/** Bezugspunkt: Nase, Mittellinie und Rumpfradius aus dem Bild ableiten. */
function prepAnchor(cv, box){
  const w=cv.width;
  const d=cv.getContext("2d").getImageData(0,0,w,cv.height).data;
  const probe=Math.round(box.x0+box.w*0.28);   // vor der Tragfläche
  let top=-1, bot=-1;
  for(let y=box.y0;y<=box.y1;y++){
    if(d[(y*w+probe)*4+3]>150){ if(top<0) top=y; bot=y; }
  }
  if(top<0){ top=box.y0; bot=box.y1; }
  const yc=(top+bot)/2, r=(bot-top)/2;
  return {x0:box.x0, yc:Math.round(yc), r:Math.max(6,Math.round(r)), unit:box.w/1000};
}
function prepDownload(cv, name){
  cv.toBlob(b=>{ const u=URL.createObjectURL(b);
    const a=document.createElement("a"); a.href=u; a.download=name; a.click();
    setTimeout(()=>URL.revokeObjectURL(u),2000); }, "image/png");
}
function prepDialog(){
  let typeId=Object.keys(ACT)[8]||"a20n";
  let tol=42, thr=110, tailPct=0.72, useTail=true;
  modal("Grafikpaket vorbereiten",
    `<p class="dim">Eine Seitenansicht mit weissem Flugzeug auf hellem Grund laden. Das Werkzeug trennt den Hintergrund, erzeugt die Farbmaske und schlägt den Bezugspunkt vor. Heraus kommen die fertigen PNG und die Konfigurationszeile.</p>
     <label class="f">Muster, zu dem die Zeichnung gehört</label>
     <select id="pType">${ACTL.map(t=>`<option value="${t.id}" ${t.id===typeId?"selected":""}>${esc(t.name)} — ${t.id}</option>`).join("")}</select>
     <label class="f">Bilddatei</label><input type="file" id="pFile" accept="image/*">
     <div id="pWork" style="margin-top:10px"></div>`,
    [{t:"Schliessen",f:()=>$("#veil").classList.remove("on")}]);
  $("#pType").onchange=e=>{ typeId=e.target.value; if(PREP.img) run(); };
  $("#pFile").onchange=e=>{
    const f=e.target.files[0]; if(!f) return;
    const img=new Image();
    img.onload=()=>{ PREP.img=img; PREP.w=img.naturalWidth; PREP.h=img.naturalHeight; run(); };
    img.onerror=()=>toast("Bild konnte nicht gelesen werden.");
    img.src=URL.createObjectURL(f);
  };
  function run(){
    const box0=document.getElementById("pWork");
    box0.innerHTML=`<div class="dim">Wird verarbeitet …</div>`;
    setTimeout(()=>{
      PREP.base=prepCutout(PREP.img, tol);
      PREP.box=prepBounds(PREP.base);
      PREP.anchor=prepAnchor(PREP.base, PREP.box);
      const b=PREP.box;
      const tailRegion={x0:Math.round(b.x0+b.w*tailPct), x1:b.x1, y0:b.y0, y1:Math.round(PREP.anchor.yc)};
      PREP.mask=prepMask(PREP.base, thr, null);
      PREP.tail=useTail?prepMask(PREP.base, thr, tailRegion):null;
      draw(tailRegion);
    },30);
  }
  function draw(tailRegion){
    const b=PREP.box, an=PREP.anchor;
    const box0=document.getElementById("pWork");
    box0.innerHTML=`
      <div class="planebox" style="padding:0"><canvas id="pPrev" style="width:100%;display:block"></canvas></div>
      <label class="f">Hintergrund-Toleranz <span class="mono">${tol}</span> — höher, wenn Reste stehen bleiben</label>
      <input type="range" id="pTol" min="6" max="90" value="${tol}">
      <label class="f">Maskenschwelle <span class="mono">${thr}</span> — tiefer, wenn Fenster mitgefärbt werden</label>
      <input type="range" id="pThr" min="40" max="220" value="${thr}">
      <div class="row" style="margin-top:6px">
        <button class="sm ${useTail?'primary':''}" id="pTail">Leitwerksmaske ${useTail?"an":"aus"}</button></div>
      ${useTail?`<label class="f">Leitwerk beginnt bei <span class="mono">${fmt(tailPct*100,0)}%</span> der Länge</label>
        <input type="range" id="pTp" min="45" max="90" value="${Math.round(tailPct*100)}">`:""}
      <div class="card" style="margin-top:9px">
        <div class="kv"><span>Bildgrösse</span><span>${PREP.w} × ${PREP.h} px</span></div>
        <div class="kv"><span>Flugzeug im Bild</span><span>${b.w} × ${b.h} px ab x ${b.x0}</span></div>
        <div class="kv"><span>Mittellinie · Rumpfradius</span><span>y ${an.yc} · ${an.r} px</span></div>
      </div>
      <label class="f">Zeile für PLANE_ASSETS</label>
      <textarea id="pCfg" rows="2" readonly>${typeId}: {base:1, mask:1${useTail?", tail:1":""}, w:${PREP.w}, h:${PREP.h}, x0:${an.x0}, yc:${an.yc}, r:${an.r}, unit:${an.unit.toFixed(4)}},</textarea>
      <div class="row" style="margin-top:9px">
        <button class="primary" id="pDl">Alle Dateien herunterladen</button>
        <button id="pCopy">Zeile kopieren</button></div>
      <p class="dim" style="font-size:11px;margin-top:7px">Die Dateien in den Ordner <span class="mono">assets/planes/</span> legen, die Zeile oben in <span class="mono">index.html</span> bei <span class="mono">PLANE_ASSETS</span> einfügen und die Dateinamen zusätzlich in <span class="mono">sw.js</span> eintragen.</p>`;
    /* Vorschau: Basis, darüber die Maske in der Hausfarbe */
    const cv=document.getElementById("pPrev");
    const scale=Math.min(1, 900/PREP.w);
    cv.width=Math.round(PREP.w*scale); cv.height=Math.round(PREP.h*scale);
    const ctx=cv.getContext("2d");
    ctx.clearRect(0,0,cv.width,cv.height);
    ctx.drawImage(PREP.base,0,0,cv.width,cv.height);
    const paint=(src,col)=>{
      const off=document.createElement("canvas"); off.width=cv.width; off.height=cv.height;
      const oc=off.getContext("2d");
      oc.drawImage(src,0,0,cv.width,cv.height);
      oc.globalCompositeOperation="source-in";
      oc.fillStyle=col; oc.fillRect(0,0,cv.width,cv.height);
      ctx.globalCompositeOperation="multiply";
      ctx.drawImage(off,0,0);
      ctx.globalCompositeOperation="source-over";
    };
    const L=(S&&S.livery)||DEFAULT_LIVERY;
    const maskAlpha=(src)=>{           // Weiss der Maske in Deckung umwandeln
      const off=document.createElement("canvas"); off.width=src.width; off.height=src.height;
      const oc=off.getContext("2d");
      const im=src.getContext("2d").getImageData(0,0,src.width,src.height);
      const d=im.data;
      for(let i=0;i<d.length;i+=4){ const v=d[i]; d[i]=255;d[i+1]=255;d[i+2]=255; d[i+3]=v; }
      oc.putImageData(im,0,0);
      return off;
    };
    paint(maskAlpha(PREP.mask), BODY_COLS[L.body]||L.c1);
    if(PREP.tail) paint(maskAlpha(PREP.tail), L.c1);
    if(tailRegion){
      ctx.strokeStyle="#f2a93b"; ctx.setLineDash([6,4]); ctx.lineWidth=1.5;
      ctx.strokeRect(tailRegion.x0*scale, tailRegion.y0*scale,
        (tailRegion.x1-tailRegion.x0)*scale, (tailRegion.y1-tailRegion.y0)*scale);
      ctx.setLineDash([]);
    }
    document.getElementById("pTol").onchange=e=>{ tol=+e.target.value; run(); };
    document.getElementById("pThr").onchange=e=>{ thr=+e.target.value; run(); };
    document.getElementById("pTail").onclick=()=>{ useTail=!useTail; run(); };
    const tp=document.getElementById("pTp"); if(tp) tp.onchange=e=>{ tailPct=+e.target.value/100; run(); };
    document.getElementById("pDl").onclick=()=>{
      prepDownload(PREP.base, typeId+"-base.png");
      setTimeout(()=>prepDownload(maskAlpha(PREP.mask), typeId+"-mask.png"),400);
      if(PREP.tail) setTimeout(()=>prepDownload(maskAlpha(PREP.tail), typeId+"-tail.png"),800);
      toast("Dateien werden heruntergeladen.");
    };
    document.getElementById("pCopy").onclick=()=>{
      const t=document.getElementById("pCfg");
      t.select(); try{ document.execCommand("copy"); toast("Zeile kopiert."); }
      catch(e){ toast("Bitte von Hand markieren und kopieren."); }
    };
  }
}

    ["ACH","Altenrhein","Schweiz",47.48,9.56,0.10,1500,0.85,1.40,1.10,0.95,"EU",[1320,360]]],null,1);};
  $("#expap").onclick=()=>download("flughaefen.json",JSON.stringify(

      return [a.iata,a.city,a.country,a.lat,a.lon,a.pax,a.runway,a.fee,a.income,a.tourism,a.biz,a.region].concat(c?[c]:[]);}),null,1));
  $("#addap").onclick=()=>{
    const msg=$("#apmsg"); let arr;
    try{ arr=JSON.parse($("#apjson").value); }
    catch(err){ msg.innerHTML=`<span class="neg">JSON ungültig: ${esc(err.message)}</span>`; return; }
    if(!Array.isArray(arr)){ msg.innerHTML=`<span class="neg">Erwartet wird ein Array.</span>`; return; }
    let added=0, skipped=[];
    arr.forEach(e=>{
      let a, cf=null;
      if(Array.isArray(e)){ if(e.length<12){skipped.push(e[0]||"?");return;}
        a=buildAirport(e); if(Array.isArray(e[12])&&e[12].length===2) cf=e[12]; }
      else if(e&&typeof e==="object"&&e.iata){
        a={iata:e.iata,city:e.city||e.iata,country:e.country||"",lat:+e.lat,lon:+e.lon,
           pax:+e.pax||1,runway:+e.runway||2500,fee:+e.fee||1,income:+e.income||1,
           tourism:+e.tourism||1,biz:+e.biz||1,region:e.region||"EU"};
        if(Array.isArray(e.curfew)&&e.curfew.length===2) cf=e.curfew;
      } else { skipped.push("?"); return; }
      if(!a.iata||a.iata.length>4||!isFinite(a.lat)||!isFinite(a.lon)){skipped.push(a.iata||"?");return;}
      if(AP[a.iata]){skipped.push(a.iata+" (vorhanden)");return;}
      AP[a.iata]=a; APL.push(a); S.ownAirports.push({a,cf});
      if(cf) CURFEW[a.iata]=cf;
      added++;
    });
    msg.innerHTML=`<span class="pos">${added} Flughäfen übernommen.</span>`
      +(skipped.length?` <span class="neg">Übersprungen: ${esc(skipped.join(", "))}</span>`:"");
    if(added){ logg(`${added} Flughäfen ergänzt.`,""); renderMap(); renderPane(); }
  };
}

function download(name,text){
  const b=new Blob([text],{type:"application/json"}), u=URL.createObjectURL(b);
  const a=document.createElement("a"); a.href=u; a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(u),1500);
}
function saveGame(){
  download(`${S.code||"airline"}-${S.year}-${String(S.month+1).padStart(2,"0")}.json`,JSON.stringify(S));
  toast("Spielstand heruntergeladen.");
}
/** Übernimmt einen geladenen Spielstand und rüstet ältere Fassungen nach. */
function adoptSave(d){
  loadStaticData();
  (d.ownAirports||[]).forEach(o=>{ const a=o.a||o;
    if(a&&a.iata&&!AP[a.iata]){AP[a.iata]=a; APL.push(a); if(o.cf) CURFEW[a.iata]=o.cf;} });
  S=d;
  if(!S.ownAirports) S.ownAirports=[];
  if(!S.livery) S.livery=Object.assign({},DEFAULT_LIVERY,{code:S.code});
  if(!S.livery.decals) S.livery.decals=[];
  if(!S.livery.layers) S.livery.layers=[];
  if(!S.pilots||typeof S.pilots==="number") S.pilots={};
  if(!S.flightStart) S.flightStart=100;
  if(!S.campaigns) S.campaigns=[];
  if(!S.weather) rollWeather();
  if(!S.reviews) S.reviews=[];
  if(!S.charters) S.charters=[];
  if(!S.charterJobs) S.charterJobs=[];
  if(!S.achievements) S.achievements={};
  if(S.punctuality==null) S.punctuality=0.88;
  if(!S.rivals||!S.rivals.length||!S.rivals[0].hubs) initRivals();
  if(!S.clock) S.clock=Date.UTC(S.year||2027,S.month||0,1,4,0);
  if(!S.acc) S.acc={rev:0,direct:0,pax:0,seats:0,flights:0,rpk:0,ask:0};
  if(!S.ticker) S.ticker=[];
  if(!S.baseUp) S.baseUp={};
  if(!S.difficulty) S.difficulty="normal";
  applyDifficulty(S.difficulty);
  if(!S.usedMarket) rollUsed();
  if(!S.flightHistory) S.flightHistory=[];
  if(!S.hedges) S.hedges=[];
  if(!S.holdings) S.holdings={};
  if(!S.takeovers) S.takeovers=[];
  if(!S.finTab) S.finTab="gv";
  if(!S.mapStyle) S.mapStyle="nacht";
  if(!S.flightNums) S.flightNums={};
  if(!S.inbox) S.inbox=[];
  if(!S.rel) S.rel={crew:70, airports:70, partners:55};
  if(!S.blocks) S.blocks=[];
  if(!S.tutorial) S.tutorial={done:true, erledigt:{}};
  if(!S.jumpMode) S.jumpMode="event";
  S.fleet.forEach(ac=>{ if(!ac.plan) ac.plan={start:390,dests:[],days:[1,1,1,1,1,1,1],nums:[]};
    if(!ac.plan) ac.plan={};
    if(!ac.cab) ac.cab=CABIN_PRESETS[ACT[ac.type].cat==="Grossraum"?"standard":"europa"].f(ACT[ac.type]);
    if(!ac.svc) ac.svc="standard";
    if(!ac.reg||/^[A-Z]{1,3}-\d{3}$/.test(ac.reg)) ac.reg=newRegistration(ac.base);
    ensurePlan(ac); });
  S.routes=(S.routes||[]).map(r=>{ if(!r.key) r.key=routeKey(r.from,r.to); delete r.rivals; return r; });
  S.daySchedDay=null;
  recomputeWeek(); buildDaySchedule(); render(); setSpeed(0);
}
function loadGame(){
  const inp=document.createElement("input"); inp.type="file"; inp.accept=".json,application/json";
  inp.onchange=()=>{ const f=inp.files[0]; if(!f) return;
    const rd=new FileReader();
    rd.onload=()=>{ try{
        const d=JSON.parse(rd.result);
        if(!d||!d.name||!Array.isArray(d.bases)) throw new Error("Kein gültiger Spielstand");
        adoptSave(d);
        toast(`${S.name} geladen — ${monthLabel()}`);
      }catch(err){ toast("Datei konnte nicht gelesen werden: "+err.message); } };
    rd.readAsText(f); };
  inp.click();
}

      <tr><th>Strecke</th><th class="r">Pax/Tag</th><th class="r">SLF</th><th class="r">Ergebnis/Mt</th></tr>

/** Räumt ein frisch erzeugtes Netz auf: Flüge, die sich nicht tragen, werden
    gestrichen — dieselbe Massnahme, die dem Spieler auch zur Verfügung steht.
    So beginnt eine Partie nicht mit einem sinnlos aufgeblähten Flugplan. */
function seedTrim(passes){
  for(let p=0;p<(passes||2);p++){
    recomputeWeek();
    S.fleet.forEach(ac=>{
      const pl=ensurePlan(ac);
      if(!scheduleOf(ac).flights) return;
      let bestKey=null, bestVal=-Infinity;
      for(let d=0;d<7;d++){
        scheduleOf(ac).week[d].legs.forEach(l=>{
          const st=LEGSTATS[legKey(ac.id,d,l.i)];
          if(st && st.profit>bestVal){ bestVal=st.profit; bestKey=d+"#"+l.i; }
        });
      }
      for(let d=0;d<7;d++){
        const legs=scheduleOf(ac).week[d].legs;
        const drop=new Set();
        legs.forEach(l=>{
          const st=LEGSTATS[legKey(ac.id,d,l.i)];
          if(st && st.profit<0 && (d+"#"+l.i)!==bestKey) drop.add(l.i);
        });
        if(!drop.size) continue;
        const w=pl.week[d], dests=[], nums=[];
        w.dests.forEach((x,i)=>{ if(!drop.has(i)){ dests.push(x); nums.push(w.nums[i]); } });
        /* Ein Umlauf muss an der Basis enden, sonst strandet die Maschine */
        while(dests.length && dests[dests.length-1]!==ac.base) dests.pop();
        w.dests=dests; w.nums=nums.slice(0,dests.length);
      }
      ensurePlan(ac);
    });
  }
  recomputeWeek();
}

/** Verteilt eine Langstrecke auf zwei Tage: Hinflug, Übernachtung, Rückflug.
    Wird gebraucht, weil ein Umlauf über 6000 km nicht an einem Tag zu schaffen ist. */
function seedLongHaul(ac, dests){
  const t=ACT[ac.type];
  const far=(dests||[]).filter(dd=>AP[dd] && !acCanFly(ac, AP[ac.base], AP[dd]))
    .sort((x,y)=>distKm(AP[ac.base],AP[y])-distKm(AP[ac.base],AP[x]));
  if(!far.length) return false;
  for(const target of far.slice(0,4)){
    ensurePlan(ac);
    for(let d=0;d<7;d++) ac.plan.week[d]=emptyDay();
    [[0,1],[2,3],[4,5]].forEach(([out,back])=>{
      ac.plan.week[out]={start:10*60+30, dests:[target], nums:[]};
      ac.plan.week[back]={start:21*60, dests:[ac.base], nums:[]};
    });
    ensurePlan(ac);
    let g=0;
    while(g++<6 && scheduleOf(ac).week.some(x=>x.legs.some(l=>l.issues.length))){
      for(let d=0;d<7;d++) if(ac.plan.week[d].dests.length)
        ac.plan.week[d].start=(ac.plan.week[d].start+75)%1440;
    }
    const sch=scheduleOf(ac);
    if(sch.flights && !sch.week.some(x=>x.legs.some(l=>l.issues.length))) return true;
  }
  for(let d=0;d<7;d++) ac.plan.week[d]=emptyDay();
  ensurePlan(ac);
  return false;
}

/** Baut eine bestehende Gesellschaft auf: Flotte, Personal, Tagespläne. */
function startExisting(idx){
  const A=LEGACY_AIRLINES[idx]; if(!A) return;
  const liv=Object.assign({}, DEFAULT_LIVERY, A.liv, {code:A.code, decals:[], layers:[]});
  newGame({name:A.name, code:A.code, home:A.bases[0], level:"normal", livery:liv, flightStart:100});
  /* Weitere Basen ohne Eröffnungskosten */
  A.bases.slice(1).forEach(b=>{ if(AP[b] && !S.bases.includes(b)) S.bases.push(b); });
  S.cash=A.cash*1e6;
  S.rep=A.rep;
  /* Die übernommene Gesellschaft verschwindet aus dem Wettbewerb */
  const twin=(S.rivals||[]).find(x=>x.name.toLowerCase().startsWith(A.name.toLowerCase().slice(0,7)));
  if(twin) S.rivals=S.rivals.filter(x=>x!==twin);

  const dests=A.dests.filter(d=>AP[d]);
  let n=0;
  A.fleet.forEach(([type,cnt,bIdx])=>{
    for(let i=0;i<cnt;i++){
      const base=A.bases[bIdx!=null ? Math.min(bIdx,A.bases.length-1) : (n % A.bases.length)];
      const ac=addAircraft(type,false,base, Math.round(rnd(24,120)));
      ac.hours=Math.round(rnd(500, BAL.heavyCheckHrs*0.7));
      const t=ACT[type];
      /* Tagesplan: zwei bis drei Ziele, gestaffelte Abflugzeiten */
      const startMin = 6*60 + (n%7)*28;
      const pick2=[];
      for(let k=0;k<dests.length && pick2.length<3;k++){
        const dd=dests[(n*3+k) % dests.length];
        if(pick2.includes(dd)) continue;
        if(acCanFly(ac, AP[base], AP[dd])) continue;
        pick2.push(dd);
      }
      const chain=[]; pick2.forEach(dd=>chain.push(dd, base));
      ensurePlan(ac);
      for(let d=0;d<7;d++) ac.plan.week[d]={start:startMin, dests:chain.slice(), nums:[]};
      ensurePlan(ac);
      /* zu lange Umläufe kürzen, bis der Tag passt */
      let guard=0;
      while(guard++<8){
        const sch=scheduleOf(ac);
        const bad = sch.week.some(x=>x.blockSum>t.block*60 || x.duty>BAL.maxDuty
          || x.legs.some(l=>l.issues.length));
        if(!bad) break;
        for(let d=0;d<7;d++){ ac.plan.week[d].dests.splice(-2,2); ac.plan.week[d].nums.splice(-2,2); }
        ensurePlan(ac);
        if(!ac.plan.week[0].dests.length) break;
      }
      /* Kam nichts zustande, an der Hauptbasis mit einem Ziel neu ansetzen */
      if(!ac.plan.week[0].dests.length){
        ac.base=A.bases[0];
        ac.reg=newRegistration(ac.base);
        for(const dd of dests){
          if(acCanFly(ac, AP[ac.base], AP[dd])) continue;
          for(let d=0;d<7;d++) ac.plan.week[d]={start:startMin, dests:[dd, ac.base], nums:[]};
          ensurePlan(ac);
          const sch=scheduleOf(ac);
          if(!sch.week.some(x=>x.blockSum>t.block*60 || x.legs.some(l=>l.issues.length))) break;
          for(let d=0;d<7;d++) ac.plan.week[d]=emptyDay();
          ensurePlan(ac);
        }
      }
      n++;
    }
  });
  /* Langstrecken über Nacht auf zwei Tage verteilen, statt sie zu streichen */
  S.fleet.forEach(ac=>{ if(!scheduleOf(ac).flights) seedLongHaul(ac, A.dests); });
  const need0=pilotNeed(); S.pilots={};
  for(const k in need0) S.pilots[k]=Math.ceil(need0[k]*1.08);
  S.cabin=Math.ceil(cabinNeed()*1.08);
  seedTrim(2);
  S.fleet.forEach(ac=>{ if(!scheduleOf(ac).flights) seedLongHaul(ac, A.dests); });

  /* Personal nach Bedarf, mit etwas Reserve */
  const need=pilotNeed(); S.pilots={};
  for(const k in need) S.pilots[k]=Math.ceil(need[k]*1.08);
  S.cabin=Math.ceil(cabinNeed()*1.08);
  S.legacy=A.id; S.icao=A.icao||null; S.tutorial={done:true, erledigt:{}};
  applyPlayerArt();
  logg(`${A.name} übernommen: ${S.fleet.length} Flugzeuge, ${S.bases.length} Station${S.bases.length>1?"en":""}.`,"good");
  recomputeWeek(); buildDaySchedule(); render(); setSpeed(0);
}

const CAPITALS_EU = ["LHR","CDG","BER","FCO","MAD","LIS","AMS","BRU","VIE","BER","PRG","WAW",
  "BUD","CPH","OSL","ARN","HEL","DUB","ATH","LUX","ZRH","BRN","RIX","TLL","VNO","SOF","OTP",

/* ==================================================== Szenariobedingungen
   Jede Vorgabe ist eine Messgrösse mit Zielwert. Erfüllt sind sie, wenn alle
   zutreffen; «max» bedeutet, dass der Wert darunter liegen muss. */
function scMetric(c){
  const L=S.lastMonth, H=S.history;
  switch(c.art){
    case "kasse": return S.cash;
    case "schulden": return S.debt;
    case "gewinn": return L?L.profit:0;
    case "eigenkapital": return S.cash+fleetValue()+portfolioValue()-S.debt;
    case "ruf": return S.rep;
    case "gewinnFolge": { let n=0; for(let i=H.length-1;i>=0;i--){ if(H[i].profit>0) n++; else break; } return n; }
    case "rufFolge": { let n=0; for(let i=H.length-1;i>=0;i--){ if(H[i].rep>=(c.mindest||85)) n++; else break; } return n; }
    case "anteilStrecke": { const r=findRoute(c.von,c.nach);
      return r&&r.last&&r.last.ok ? r.last.share*100 : 0; }
    case "anteilHeim": { const land=AP[S.bases[0]]?AP[S.bases[0]].country:null;
      const rs=S.routes.filter(r=>r.last&&r.last.ok && AP[r.from].country===land && AP[r.to].country===land);
      return rs.length? rs.reduce((a,r)=>a+r.last.share,0)/rs.length*100 : 0; }
    case "zieleRegion": { const set=new Set();
      S.routes.forEach(r=>[r.from,r.to].forEach(i=>{ if(AP[i]&&AP[i].region===c.region) set.add(i); }));
      S.bases.forEach(b=>{ if(AP[b]&&AP[b].region===c.region) set.delete(b); });
      return set.size; }
    case "zieleLand": { const set=new Set();
      S.routes.forEach(r=>[r.from,r.to].forEach(i=>{ if(AP[i]&&AP[i].country===c.land) set.add(i); }));
      return set.size; }
    case "hauptstaedte": { const set=new Set();
      S.routes.forEach(r=>[r.from,r.to].forEach(i=>{ if(CAPITALS_EU.includes(i)&&!S.bases.includes(i)) set.add(i); }));
      return set.size; }
    case "uebernahmen": { const t=S.takeovers||[];
      if(!c.modell) return t.length;
      return t.filter(x=>{ const d=COMPETITOR_DATABASE.find(y=>y.id===x.id); return d&&d.model===c.modell; }).length; }
    case "uebernahmeVon": return (S.takeovers||[]).some(x=>(c.ids||[]).includes(x.id))?1:0;
    case "charterZahl": return S.charterDone||0;
    case "umsteiger": { const t=(S.transferInfo||[]).filter(x=>!c.hub||x.hub===c.hub);
      return t.reduce((a,x)=>a+x.pax,0)/7*30.4; }
    case "transferAnteil": { let tr=0, tot=0;
      S.routes.forEach(r=>{ if(!r.last||!r.last.ok) return;
        tot+=r.last.rev; tr+=(r.last.transferPax||0)*(r.last.pax?r.last.rev/r.last.pax:0); });
      return tot? clamp(tr/tot*100,0,100) : 0; }
    case "drehkreuze": { const set=new Set(S.bases.map(b=>AP[b]?AP[b].region:null).filter(Boolean));
      return set.size; }
    case "servicePremium": { if(!S.fleet.length) return 0;
      return S.fleet.filter(a=>(a.svc||"standard")==="premium").length/S.fleet.length*100; }
    case "flottenalter": { if(!S.fleet.length) return 0;
      return S.fleet.reduce((a,x)=>a+x.age,0)/S.fleet.length/12; }
    case "grossraum": return S.fleet.filter(a=>ACT[a.type].cat==="Grossraum").length;
    case "grossraumProfitabel": { const gute=new Set();
      S.routes.forEach(r=>{ if(r.last&&r.last.ok&&r.last.profit>0)
        (weeklyLegs()[r.key]||[]).forEach(e=>{ if(ACT[e.ac.type].cat==="Grossraum") gute.add(e.ac.id); }); });
      return gute.size; }
    case "lounge": return S.bases.some(b=>hasUpgrade(b,"lounge"))?1:0;
    case "frachtWoche": { let t=0; S.routes.forEach(r=>{ if(r.last&&r.last.ok) t+=r.last.cargoT||0; }); return t; }
    case "frachtterminal": return S.bases.some(b=>hasUpgrade(b,"fracht"))?1:0;
    case "keineKredite": return (S.debtPeak||0)<=(S.debtStart||0)?1:0;
    case "strecken": return S.routes.length;
    case "afrikaFuehrer": { let mich=0; const fremd={};
      S.routes.forEach(r=>{ const af=(AP[r.from].region==="AF")||(AP[r.to].region==="AF");
        if(!af||!r.last||!r.last.ok) return;
        mich+=r.last.flights;
        (r.rivals||[]).forEach(v=>{ fremd[v.id]=(fremd[v.id]||0)+v.flights; }); });
      const best=Math.max(0,...Object.values(fremd));
      return mich>best && mich>0 ? 1 : 0; }
    default: return 0;
  }
}
function scDone(c){
  const v=scMetric(c);
  return c.max ? v<=c.wert : v>=c.wert;
}
function scLabel(c){
  const v=scMetric(c);
  const f=(x)=>{
    switch(c.art){
      case "kasse": case "schulden": case "gewinn": case "eigenkapital": return chf(x);
      case "anteilStrecke": case "anteilHeim": case "servicePremium": case "transferAnteil": return fmt(x,1)+"%";
      case "flottenalter": return fmt(x,1)+" J";
      case "frachtWoche": return fmt(x,0)+" t";
      case "umsteiger": return fmt(x,0);
      case "lounge": case "frachtterminal": case "keineKredite": case "afrikaFuehrer":
      case "uebernahmeVon": return x?"ja":"nein";
      default: return fmt(x,0);
    }
  };
  return {v, txt:f(v), ziel:f(c.wert), ok:scDone(c),
    anteil: c.max ? clamp(c.wert/Math.max(v,0.0001),0,1) : clamp(v/(c.wert||1),0,1)};
}

const SCENARIO_ART = {};
async function scanScenarios(){
  for(const d of SCENARIO_DIR){
    const files=await listFolder(d);
    if(!files.length) continue;
    files.filter(f=>/\.(jpe?g|png|webp)$/i.test(f)).forEach(f=>{
      SCENARIO_ART[f.replace(/\.[^.]+$/,"").toLowerCase()]=d+"/"+f;
    });
    break;
  }
}
function scenarioImage(sc){
  const k=(sc.id||sc.name||"").toLowerCase();
  return SCENARIO_ART[k] || SCENARIO_ART[k.replace(/\s+/g,"-")] || SCENARIO_ART[k.replace(/\s+/g,"_")] || null;
}
/** Prüft nach jedem Monatsabschluss, ob Sieg oder Niederlage eingetreten ist. */
function currentScenario(){ return S.scenario && SCENARIOS.find(x=>x.id===S.scenario); }
function checkScenario(){
  const sc=currentScenario();
  if(!sc || S.scenarioDone) return;
  S.debtPeak=Math.max(S.debtPeak||0, S.debt);
  const v=sc.verloren;
  if(v && v.art){
    const val=scMetric(v);
    const raus = v.max ? val>v.wert : val<v.wert;
    if(raus){
      S.scenarioDone="verloren"; setSpeed(0);
      setTimeout(()=>modal(`${sc.name} — gescheitert`,
        `<p>${esc(v.text||"Die Vorgabe wurde nicht erreicht.")}</p>
         <p class="dim">Nach ${S.history.length} Monaten.</p>`,
        [{t:"Zurück zum Menü",p:true,f:()=>{$("#veil").classList.remove("on"); mainMenu();}}]),200);
      return;
    }
  }
  const ziele=sc.ziele||[];
  if(!ziele.length) return;
  if(ziele.every(scDone)){
    S.scenarioDone="gewonnen"; setSpeed(0);
    logg(`Szenario «${sc.name}» erfüllt.`,"good");
    setTimeout(()=>modal(`${sc.name} — geschafft`,
      `<p>Alle Vorgaben sind erfüllt:</p>
       ${ziele.map(c=>`<div class="kv"><span>${esc(c.text)}</span><span class="pos">${scLabel(c).txt}</span></div>`).join("")}
       <p class="dim" style="margin-top:8px">Nach ${S.history.length} Monaten. Der Betrieb lässt sich frei weiterführen.</p>`,
      [{t:"Weiterspielen",p:true,f:()=>{$("#veil").classList.remove("on");}}]),200);
  }
}

function startScenario(id){
  const sc=SCENARIOS.find(x=>x.id===id); if(!sc) return;
  const liv=Object.assign({}, DEFAULT_LIVERY, sc.airline.liv||{},
    {code:sc.airline.code, decals:[], layers:[]});
  newGame({name:sc.airline.name, code:sc.airline.code, home:sc.bases[0],
    level:sc.difficulty||"normal", livery:liv, flightStart:100});
  sc.bases.slice(1).forEach(b=>{ if(AP[b]&&!S.bases.includes(b)) S.bases.push(b); });
  if(sc.cash!=null) S.cash=sc.cash*1e6;
  if(sc.rep!=null) S.rep=sc.rep;
  /* Sonderregeln des Szenarios */
  const R=Object.assign({}, sc.regeln||{});
  S.rules=R;
  if(sc.jahr){ S.clock=Date.UTC(sc.jahr,0,1,4,0); S.year=sc.jahr; S.month=0; }
  if(R.aggro) BAL.aggroMult=(BAL.aggroMult||1)*R.aggro;
  if(R.fuel) S.fuel=R.fuel;
  if(R.schulden){ S.debt=R.schulden; S.debtStart=R.schulden; S.debtPeak=R.schulden; }
  else { S.debtStart=0; S.debtPeak=0; }
  if(R.noLCC) S.rivals=S.rivals.filter(x=>x.model!=="lcc");
  if(sc.bal) Object.keys(sc.bal).forEach(k=>{ if(k in BAL) BAL[k]=sc.bal[k]; else S[k]=sc.bal[k]; });
  const dests=(sc.dests||[]).filter(d=>AP[d]);
  let n=0;
  (sc.fleet||[]).forEach(([type,cnt,bIdx])=>{
    for(let i=0;i<cnt;i++){
      const base=sc.bases[bIdx!=null?Math.min(bIdx,sc.bases.length-1):(n%sc.bases.length)];
      const R2=sc.regeln||{};
      const ac=addAircraft(type,false,base,
        Math.round(R2.alterMin!=null ? rnd(R2.alterMin, R2.alterMax||R2.alterMin+60) : rnd(12,90)));
      if(R2.alterMin) ac.hours=Math.round(rnd(0.5,0.95)*BAL.heavyCheckHrs);
      if(R2.noLowCost) ac.svc="premium";
      const chain=[];
      for(let k=0;k<dests.length && chain.length<4;k++){
        const dd=dests[(n*3+k)%dests.length];
        if(chain.includes(dd)) continue;
        if(acCanFly(ac,AP[base],AP[dd])) continue;
        chain.push(dd, base);
      }
      ensurePlan(ac);
      for(let d=0;d<7;d++) ac.plan.week[d]={start:6*60+(n%7)*26, dests:chain.slice(), nums:[]};
      ensurePlan(ac);
      let g=0;
      while(g++<8 && scheduleOf(ac).week.some(x=>x.blockSum>ACT[type].block*60
          || x.duty>BAL.maxDuty || x.legs.some(l=>l.issues.length))){
        for(let d=0;d<7;d++){ ac.plan.week[d].dests.splice(-2,2); ac.plan.week[d].nums.splice(-2,2); }
        ensurePlan(ac);
        if(!ac.plan.week[0].dests.length) break;
      }
      n++;
    }
  });
  /* Wer an einem Tag nicht hin und zurück kommt, fliegt über Nacht */
  S.fleet.forEach(ac=>{ if(!scheduleOf(ac).flights) seedLongHaul(ac, dests); });
  const need0=pilotNeed(); S.pilots={};
  for(const k in need0) S.pilots[k]=Math.ceil(need0[k]*1.05);
  S.cabin=Math.ceil(cabinNeed()*1.05);
  seedTrim(2);
  S.fleet.forEach(ac=>{ if(!scheduleOf(ac).flights) seedLongHaul(ac, dests); });
  const need=pilotNeed(); S.pilots={};
  for(const k in need) S.pilots[k]=Math.ceil(need[k]*1.05);
  S.cabin=Math.ceil(cabinNeed()*1.05);
  S.scenario=sc.id; S.scenarioDone=null; S.tutorial={done:true, erledigt:{}};
  logg(`Szenario «${sc.name}» begonnen.`,"good");
  recomputeWeek(); buildDaySchedule(); render(); setSpeed(0);
}

/* Zahlen laufen weich in den neuen Wert, statt umzuspringen. */
const NUMANIM=new WeakMap();
function animateNum(el, to, fmtFn){
  if(!el) return;
  const prev=NUMANIM.get(el);
  const from=(prev&&isFinite(prev.val))?prev.val:to;
  if(prev&&prev.raf) cancelAnimationFrame(prev.raf);
  if(Math.abs(to-from)<1e-9){ el.textContent=fmtFn(to); NUMANIM.set(el,{val:to}); return; }
  const t0=performance.now(), dur=520;
  const step=(t)=>{
    const k=Math.min((t-t0)/dur,1);
    const e=1-Math.pow(1-k,3);
    const v=from+(to-from)*e;
    el.textContent=fmtFn(v);
    if(k<1){ NUMANIM.set(el,{val:v, raf:requestAnimationFrame(step)}); }
    else NUMANIM.set(el,{val:to});
  };
  NUMANIM.set(el,{val:from, raf:requestAnimationFrame(step)});
}

function buildTabs(force){
  const wrap=$("#tabs");
  const narrow=window.innerWidth<=880;

  mobileNav=narrow; wrap.dataset.built="1";
  const bdg=k=>k==="inbox"&&S&&mailUnread()?`<span class="badge">${mailUnread()}</span>`:"";

    wrap.innerHTML=Object.keys(TAB_NAME).map(k=>
      `<button data-t="${k}" class="${tab===k?'on':''}">${TAB_NAME[k]}${bdg(k)}</button>`).join("");
  } else {
    wrap.innerHTML=TAB_MAIN.map(k=>
      `<button data-t="${k}" class="${tab===k?'on':''}"><span class="ic">${TAB_ICON[k]}${bdg(k)}</span>${TAB_NAME[k]}</button>`).join("")
      +`<button data-more="1" class="${TAB_MAIN.includes(tab)?'':'on'}"><span class="ic">☰</span>Mehr</button>`;
  }
  wrap.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>setTab(b.dataset.t));
  const mb=wrap.querySelector("[data-more]");

];

/* ============================================ Planen auf der Karte ======
   Zwei Flughäfen anklicken, Maschine und Tage wählen — fertig. Die Listen
   im Netz- und Flottenreiter bleiben unverändert bestehen; das hier ist der
   schnellere Weg für eine neue Strecke. */
let PLAN_FROM=null;
function mapPlanStart(iata){
  PLAN_FROM=iata;
  toast(`Ab ${iata}: jetzt das Ziel auf der Karte anklicken.`);
  renderMap();
}
function mapPlanCancel(){ PLAN_FROM=null; renderMap(); }
function mapPlanTo(iata){
  const from=PLAN_FROM; PLAN_FROM=null;
  if(!from || from===iata){ renderMap(); return; }
  const A=AP[from], B=AP[iata];
  const kandidaten=S.fleet.filter(ac=>ac.status==="aktiv" && !acCanFly(ac,A,B)
    && (ac.base===from || ac.base===iata));
  const alle=S.fleet.filter(ac=>ac.status==="aktiv" && !acCanFly(ac,A,B));
  const liste=kandidaten.length?kandidaten:alle;
  const m=marketDemand(A,B,S.month);
  let sel=liste.length?liste[0].id:null, tage=[1,1,1,1,1,1,1];
  const body=()=>`
    <div class="kv"><span>Strecke</span><span>${from} ↔ ${iata} · ${fmt(m.d)} km</span></div>
    <div class="kv"><span>Markt</span><span>${fmt(m.daily,0)} Passagiere pro Tag, beide Richtungen</span></div>
    <div class="kv"><span>Wettbewerb</span><span>${fmt(competitorBase(A,B)/7,1)} Flüge pro Tag</span></div>
    <label class="f">Flugzeug</label>
    <div id="mpl">${liste.length?liste.map(ac=>{
      const s2=seatsOf(ac), bm=blockMinutes(ACT[ac.type], m.d);
      return `<div class="choice ${sel===ac.id?'on':''}" data-a="${ac.id}">
        <div><div class="t">${ac.reg} · ${esc(ACT[ac.type].name)}</div>
          <div class="d">${s2.total} Sitze · Basis ${ac.base} · ${fmt(bm/60,1)} h je Richtung
            · ${fmt(acWeeklyBlock(ac),1)} h Wochenblock belegt</div></div>
        <div class="mono">${ac.base===from||ac.base===iata?"passend":"andere Basis"}</div></div>`;}).join("")
      :`<div class="dim" style="padding:8px">Keine Maschine kann diese Strecke fliegen — Reichweite oder Pistenlänge.</div>`}</div>
    <label class="f">An welchen Tagen</label>
    <div class="daysel" id="mpd">${DAYS.map((d,i)=>
      `<button class="${tage[i]?'on':''}" data-d="${i}">${d}</button>`).join("")}</div>
    <p class="dim" style="font-size:11px;margin-top:6px">Hin- und Rückflug werden an den gewählten Tagen an den bestehenden Umlauf angehängt. Passt es zeitlich nicht, meldet es der Wochenplan.</p>`;
  modal(`Strecke ${from} – ${iata} aufnehmen`, body(),
    [{t:"Abbrechen",f:()=>{$("#veil").classList.remove("on"); renderMap();}},
     {t:"Aufnehmen",p:true,f:()=>{
        if(!sel){ toast("Keine passende Maschine."); return; }
        const ac=S.fleet.find(x=>x.id===sel);
        const ab = ac.base===iata ? iata : from;
        const zu = ab===from ? iata : from;
        ensurePlan(ac);
        let n=0;
        for(let d=0;d<7;d++){ if(!tage[d]) continue;
          ac.plan.week[d].dests.push(zu, ab); n++; }
        ensurePlan(ac);
        const sch=scheduleOf(ac);
        logg(`${ac.reg}: ${ab}–${zu} an ${n} Tagen aufgenommen.`, sch.warn.length?"warn":"good");
        $("#veil").classList.remove("on");
        render();
        if(sch.warn.length) setTimeout(()=>planDialog(ac.id),200);
     }}]);
  $("#mpl").onclick=e=>{const c=e.target.closest(".choice"); if(!c)return;
    sel=c.dataset.a; $("#mBody").innerHTML=body(); wire();};
  const wire=()=>{
    $("#mpl").onclick=e=>{const c=e.target.closest(".choice"); if(!c)return;
      sel=c.dataset.a; $("#mBody").innerHTML=body(); wire();};
    $("#mpd").querySelectorAll("button").forEach(b=>b.onclick=()=>{
      const i=+b.dataset.d; tage[i]=tage[i]?0:1; $("#mBody").innerHTML=body(); wire();});
  };
  wire();
}

/* ==================================================== Beziehungswerte ====
   Drei Zahlen mit Gedächtnis: Belegschaft, Flughäfen und Partner. Sie
   verändern sich langsam über Monate und steuern, wie oft und wie hart
   Störungen zuschlagen. Per Knopfdruck lässt sich hier nichts reparieren. */
const REL_NAME={crew:"Belegschaft", airports:"Flughäfen", partners:"Partner"};
function relLabel(v){
  return v>=80?"ausgezeichnet":v>=65?"gut":v>=48?"brauchbar":v>=32?"angespannt":"zerrüttet";
}
function relColor(v){ return v>=65?"var(--green)":v>=45?"var(--amber)":"var(--red)"; }
/** Monatliche Fortschreibung aus dem tatsächlichen Verhalten. */
function updateRelations(M){
  S.rel=S.rel||{crew:70, airports:70, partners:55};
  const R=S.rel;

  /* Belegschaft: Reserve, Blockstunden, Lohnniveau, Ausfälle */
  const reserve=(S.crewFactor||1);
  let dc=0;
  dc += reserve>1.12 ? 1.6 : reserve>1.03 ? 0.5 : -2.2;
  const stdProCrew = S.fleet.length ? S.fleet.reduce((a,x)=>a+acWeeklyBlock(x),0)/Math.max(S.cabin,1)*4.345 : 0;
  dc += stdProCrew>78 ? -1.8 : stdProCrew<58 ? 0.8 : 0;
  dc += BAL.cabinPay>=6200 ? 1.0 : BAL.cabinPay<=5200 ? -1.2 : 0;
  dc -= (M.cancel||0)*7;
  if(S.rel.crew<50 && (S.acc||{}).cancel) dc-=0.6;
  R.crew=clamp(R.crew+dc, 0, 100);

  /* Flughäfen: Pünktlichkeit, Sperrzeitverstösse, Ausbauten, Gebühren */
  let da=0;
  da += (S.punctuality||0.88)>0.92 ? 1.4 : (S.punctuality||0.88)<0.80 ? -1.8 : 0.2;
  da -= Math.min(6, (S.curfewHits||0)*0.35);
  da += Object.keys(S.baseUp||{}).reduce((a,k)=>a+baseUp(k).length,0)*0.25;
  R.airports=clamp(R.airports+da, 0, 100);

  /* Partner: Umsteiger, Codeshare, Umbuchungsverhalten */
  let dp=0;
  dp += S.codeshare ? 1.2 : -0.3;
  const tr=(S.transferInfo||[]).reduce((a,x)=>a+x.pax,0);
  dp += tr>2000 ? 1.4 : tr>400 ? 0.6 : 0;
  dp += loyaltyActive() ? 0.4 : 0;
  R.partners=clamp(R.partners+dp, 0, 100);
}
/** Wirkung auf die Störungshäufigkeit. */
function relRisk(){
  const R=S.rel||{crew:70,airports:70,partners:55};
  return {
    crew: clamp(1.8 - R.crew/60, 0.5, 2.2),
    airports: clamp(1.6 - R.airports/70, 0.5, 1.9)
  };
}
function relPanel(){
  const R=S.rel||{};
  return `<h3 class="sub">Beziehungen</h3>
  <div class="card"><p class="dim" style="font-size:11px;margin:0 0 7px">
    Wachsen und schrumpfen über Monate. Sie entscheiden mit, wie oft etwas schiefgeht.</p>
    ${Object.keys(REL_NAME).map(k=>{const v=R[k]||0;
      return `<div class="kv"><span>${REL_NAME[k]}</span>
        <span style="color:${relColor(v)}">${fmt(v,0)} · ${relLabel(v)}</span></div>
        <div class="bar"><i style="width:${v}%;background:${relColor(v)}"></i></div>`;}).join("")}
  </div>`;
}

/* ====================================================== Zeit überspringen
   Statt zuzuschauen: bis zum nächsten Ereignis springen. Die Simulation
   rechnet in Stundenschritten weiter und hält an, sobald etwas eintritt. */
let JUMPING=false, JUMP_STOP=false;
function stopForEvent(stufe){
  if(stufe>=2){ JUMP_STOP=true; S.stopGrund=S.stopGrund||"Ereignis"; }
}
const JUMP_MODES={
  event: "bis zum nächsten Ereignis",
  day:   "bis morgen früh",
  week:  "bis nächste Woche",
  month: "bis Monatsende"
};
/** Was steht als Nächstes an? Für die Vorschau neben dem Knopf. */
function nextEventPreview(){
  const out=[];
  const tage=(ms)=>Math.max(0, Math.round(ms/DAYMS));
  const d=clockDate();
  const monEnde=Date.UTC(d.getUTCFullYear(), d.getUTCMonth()+1, 1, 0, 0);
  out.push({t:monEnde-S.clock, txt:"Monatsabschluss"});
  (S.orders||[]).forEach(o=>out.push({t:o.left*30*DAYMS, txt:`Auslieferung ${o.n}× ${ACT[o.type].name}`}));
  S.fleet.forEach(ac=>{
    const rest=BAL.heavyCheckHrs-(ac.hours||0);
    const wo=acWeeklyBlock(ac);
    if(wo>0 && rest>0) out.push({t:rest/wo*7*DAYMS, txt:`Grosscheck ${ac.reg}`});
  });
  (S.charters||[]).forEach(c=>out.push({t:c.until-S.clock, txt:`Charter ${c.from}–${c.to} endet`}));
  (S.blocks||[]).forEach(b=>out.push({t:b.bis-S.clock, txt:`${b.grund} endet`}));
  (S.pilotsTrain||[]).forEach(x=>out.push({t:x.m*30*DAYMS, txt:`${x.n} Cockpitmitglieder fertig`}));
  out.sort((a,b)=>a.t-b.t);
  const n=out.find(x=>x.t>0);
  return n ? {tage:tage(n.t), txt:n.txt} : null;
}
async function jumpAhead(mode){
  if(!S || JUMPING) return;
  if(mailOpen().length){ toast("Zuerst die offene Entscheidung im Postfach beantworten."); setTab("inbox"); return; }
  JUMPING=true; JUMP_STOP=false; S.stopGrund=null;
  const start=S.clock, vorher=snapshotState();
  const d0=clockDate();
  const grenze = mode==="day"   ? Date.UTC(d0.getUTCFullYear(),d0.getUTCMonth(),d0.getUTCDate()+1,5,0)
    : mode==="week"  ? S.clock+7*DAYMS
    : mode==="month" ? Date.UTC(d0.getUTCFullYear(),d0.getUTCMonth()+1,1,5,0)
    : S.clock+60*DAYMS;
  const btn=$("#btnJump"); if(btn){ btn.classList.add("busy"); btn.textContent="läuft …"; }
  const schritt=()=>{
    let n=0;
    while(!JUMP_STOP && S.clock<grenze && n<48){ stepMinutes(60); n++; }
    if(!JUMP_STOP && S.clock<grenze){ setTimeout(schritt,0); return; }
    JUMPING=false;
    if(btn){ btn.classList.remove("busy"); }
    finishJump(start, vorher);
  };
  setSpeed(0);
  schritt();
}
function snapshotState(){
  return {cash:S.cash, pax:(S.acc||{}).pax||0, rev:(S.acc||{}).rev||0,
    rep:S.rep, flights:(S.acc||{}).flights||0, unread:mailUnread()};
}
/** Kurzer Bericht darüber, was seit dem letzten Halt geschah. */
function finishJump(start, v){
  const dauer=Math.max(1,Math.round((S.clock-start)/DAYMS));
  const neu=mailUnread()-v.unread;
  const a=S.acc||{};
  const dCash=S.cash-v.cash;
  S.dayReport={dauer, cash:dCash, pax:a.pax-v.pax, fluege:a.flights-v.flights,
    rep:S.rep-v.rep, neu, grund:S.stopGrund};
  render();
  const offen=mailOpen();
  if(offen.length){ setTimeout(()=>mailShow(offen[0].id),160); return; }
  if(neu>0){ setTab("inbox"); }
}
function jumpReportHTML(){
  const r=S.dayReport; if(!r) return "";
  return `<div class="card" style="border-color:var(--blue)">
    <div class="row" style="justify-content:space-between">
      <b>Bericht über ${r.dauer} Tag${r.dauer>1?"e":""}</b>
      ${r.neu?`<span class="pill warn">${r.neu} neue Nachricht${r.neu>1?"en":""}</span>`:`<span class="pill ok">ruhig</span>`}</div>
    <div class="kv"><span>Ergebnis</span><span class="${cls(r.cash)}">${sgn(r.cash)}</span></div>
    <div class="kv"><span>Flüge · Passagiere</span><span>${fmt(r.fluege)} · ${fmt(Math.round(r.pax))}</span></div>
    <div class="kv"><span>Ruf</span><span class="${cls(r.rep)}">${r.rep>=0?"+":""}${fmt(r.rep,1)}</span></div>
  </div>`;
}

/* ========================================================== Störungen ====
   Keine Würfelwürfe aus dem Nichts: Jede Störung hat einen Auslöser im
   Zustand der Gesellschaft. Alte Flotte bricht öfter, Crews ohne Reserve
   fallen aus, Billigservice rächt sich in der Presse. Drei Stufen — Ticker,
   Meldung, Entscheidung — damit nicht jede Kleinigkeit den Spieler stoppt. */
const DAYMS = 86400000;
function addBlock(b){ S.blocks=S.blocks||[]; S.blocks.push(b); }
function blockActive(art, wert){
  return (S.blocks||[]).some(b=>b.art===art && b.wert===wert && b.bis>S.clock);
}
function pruneBlocks(){ S.blocks=(S.blocks||[]).filter(b=>b.bis>S.clock); }
function blockReason(art, wert){
  const b=(S.blocks||[]).find(x=>x.art===art && x.wert===wert && x.bis>S.clock);
  return b?b.grund:null;
}
/** Streicht die heute noch offenen Flüge eines Flugzeugs. */
function cancelToday(acId){
  let n=0, pax=0;
  (S.daySched||[]).forEach(f=>{ if(f.ac===acId && !f.done){ f.done=true; f.cancelled=true;
    n++; pax+=f.pax; } });
  return {n, pax};
}
function cancelRoute(from, to){
  let n=0, pax=0;
  (S.daySched||[]).forEach(f=>{ if(!f.done && (f.from===from||f.to===from||f.from===to||f.to===to)){
    f.done=true; f.cancelled=true; n++; pax+=f.pax; } });
  return {n, pax};
}
/* Reisendenbetreuung nach einem Ausfall — dieselben drei Wege, jedes Mal */
function betreuung(pax, ort){
  return [
    {l:"Auf andere Gesellschaften umbuchen", d:"Teuer, aber die Reisenden kommen heute an.",
     kosten:Math.round(pax*185), wirkung:{rep:0.4, partners:1.5, airports:0.5}},
    {l:"Eigener Ersatzflug morgen früh", d:"Günstig, kostet eine Nacht im Hotel und etwas Ruf.",
     kosten:Math.round(pax*95), wirkung:{rep:-1.2, crew:-0.8}},
    {l:"Nur die gesetzliche Entschädigung", d:"Billigste Lösung, das Publikum merkt es sich.",
     kosten:Math.round(pax*55), wirkung:{rep:-3.0, partners:-1.5}}
  ];
}
function paxWord(n){ return fmt(Math.round(n))+" Reisende"; }

/** Tägliche Prüfung auf Störungen. */
function rollDisruptions(){
  if(!S || !S.fleet.length) return;
  pruneBlocks();
  const aktiv=S.fleet.filter(a=>a.status==="aktiv");
  if(!aktiv.length) return;
  const wochentag=weekdayIdx();

  /* 1 — Technische Störung: Wahrscheinlichkeit steigt mit Alter und Stunden */
  aktiv.forEach(ac=>{
    if(blockActive("ac",ac.id)) return;
    const alter=ac.age/12, nutzung=(ac.hours||0)/BAL.heavyCheckHrs;
    const hangar=hasUpgrade(ac.base,"hangar")?0.6:1;
    const pFail=(0.0011 + alter*0.00028 + nutzung*0.0022)*hangar*relRisk().airports;
    if(Math.random()>pFail) return;
    const heute=(S.daySched||[]).filter(f=>f.ac===ac.id && !f.done);
    const ort = heute.length ? heute[0].from : ac.base;
    const pax = heute.reduce((a,f)=>a+f.pax,0) || 90;
    const daheim = ort===ac.base;
    const teil=Math.round(rnd(35,140)*1000);
    mailAdd({kind:"stoerung", subj:`Technische Störung ${ac.reg} in ${ort}`,
      kurz:`${ACT[ac.type].name} · ${heute.length} Flüge betroffen`,
      stufe:3,
      body:`<p>Bei der Vorflugkontrolle in <b>${ort}</b> ${daheim?"an der Basis":"auf Aussenstation"} wurde an <b>${ac.reg}</b> ein Defekt festgestellt. Heute stehen noch ${heute.length} Flüge mit rund ${paxWord(pax)} an.</p>
             <p class="dim">${daheim?"An der eigenen Basis ist die Technik vor Ort — das verkürzt die Sache.":"Auf Aussenstation muss Material und Personal eingeflogen werden."}</p>`,
      optionen:[
        {l:`Ersatzteil und Technik einfliegen (${chf(teil)})`,
         d:daheim?"Bis zum Abend behoben, ein bis zwei Flüge fallen aus.":"Die Maschine steht morgen wieder bereit, heute fällt alles aus.",
         kosten:teil,
         f:()=>{ const c=cancelToday(ac.id);
           if(!daheim) addBlock({art:"ac", wert:ac.id, bis:S.clock+DAYMS, grund:"technische Störung"});
           S.rep=clamp(S.rep-0.4,5,99);
           logg(`${ac.reg}: Reparatur veranlasst, ${c.n} Flüge entfallen.`,"warn"); }},
        {l:"Am Boden lassen, Flüge annullieren",
         d:"Kostet nichts an Material, dafür Ruf und Entschädigungen.",
         f:()=>{ const c=cancelToday(ac.id);
           addBlock({art:"ac", wert:ac.id, bis:S.clock+DAYMS*2, grund:"technische Störung"});
           S.cash-=c.pax*120; S.rep=clamp(S.rep-2.2,5,99);
           logg(`${ac.reg} bleibt am Boden, ${c.n} Flüge annulliert.`,"bad"); }},
        {l:"Andere Maschine umleiten",
         d:"Der Umlauf des Ersatzflugzeugs bricht zusammen — Sie sehen es im Wochenplan.",
         f:()=>{ const c=cancelToday(ac.id);
           addBlock({art:"ac", wert:ac.id, bis:S.clock+DAYMS, grund:"technische Störung"});
           const andere=aktiv.filter(x=>x.id!==ac.id && ACT[x.type].cat===ACT[ac.type].cat);
           if(andere.length){ const e=pick(andere);
             const c2=cancelToday(e.id);
             addBlock({art:"ac", wert:e.id, bis:S.clock+DAYMS*0.6, grund:"Ersatzeinsatz"});
             logg(`${e.reg} springt für ${ac.reg} ein, ${c2.n} eigene Flüge entfallen.`,"warn");
           } else { S.rep=clamp(S.rep-1.5,5,99);
             logg("Keine passende Ersatzmaschine verfügbar.","bad"); } }}
      ]});
    stopForEvent(3);
  });

  /* 2 — Wetter über eigenen Stationen */
  S.bases.concat(S.routes.map(r=>r.to)).slice(0,24).forEach(code=>{
    const a=AP[code]; if(!a) return;
    const w=wxAt(a);
    if(w<0.55 || Math.random()>w*0.09) return;
    if(blockActive("wx",code)) return;
    addBlock({art:"wx", wert:code, bis:S.clock+DAYMS, grund:"Wetter"});
    const c=cancelRoute(code,code);
    if(!c.n) return;
    const pax=Math.max(c.pax,40);
    mailAdd({kind:"stoerung", subj:`Wetter legt ${code} lahm`,
      kurz:`${c.n} Flüge annulliert · ${paxWord(pax)}`, stufe:3,
      body:`<p>Über <b>${esc(a.city)}</b> steht ein Schlechtwettergebiet. ${c.n} Flüge sind annulliert, ${paxWord(pax)} stranden.</p>
            <p class="dim">Wie gehen Sie mit den Betroffenen um? Die Entscheidung spricht sich herum.</p>`,
      optionen:betreuung(pax, code)});
    stopForEvent(3);
  });

  /* 3 — Krankheitswelle, wenn keine Reserve da ist */
  const reserve=(S.crewFactor||1);
  if(reserve<1.02 && Math.random()<0.02*relRisk().crew && !blockActive("crew","all")){
    addBlock({art:"crew", wert:"all", bis:S.clock+DAYMS*3, grund:"Krankheitswelle"});
    const betroffen=aktiv.slice(0,Math.max(1,Math.round(aktiv.length*0.25)));
    let n=0; betroffen.forEach(ac=>{ n+=cancelToday(ac.id).n; });
    mailAdd({kind:"personal", subj:"Krankheitswelle in der Kabine",
      kurz:`${n} Flüge betroffen · keine Reserve vorhanden`, stufe:2,
      body:`<p>Eine Grippewelle hat die Kabinenbesatzung erwischt. Weil kaum Reserve eingeplant ist, fallen heute ${n} Flüge aus.</p>
            <p class="dim">Unter «Personal» lässt sich die Reserve dauerhaft erhöhen — das kostet Lohn, verhindert aber genau solche Tage.</p>`});
    S.rep=clamp(S.rep-1.2,5,99);
    stopForEvent(2);
  }

  /* 4 — Unmut der Belegschaft wächst zur Forderung */
  if(S.rel.crew<42 && !S.streikPhase && Math.random()<0.05){
    S.streikPhase=1;
    const mehr=Math.round(BAL.cabinPay*0.08);
    mailAdd({kind:"personal", subj:"Personalvertretung stellt Forderungen",
      kurz:"Ultimatum über vier Wochen", stufe:3,
      body:`<p>Die Belegschaft ist seit Monaten unzufrieden: knappe Reserve, hohe Blockstunden, Löhne unter dem Branchenschnitt. Die Vertretung verlangt eine Erhöhung und droht mit Ausstand.</p>
            <p class="dim">Zufriedenheit der Belegschaft: <b>${fmt(S.rel.crew,0)}</b> von 100.</p>`,
      optionen:[
        {l:`Erhöhung zusagen (+8% Personalkosten)`, d:"Teuer, beendet die Sache sofort.",
         f:()=>{ BAL.cabinPay=Math.round(BAL.cabinPay*1.08); BAL.pilotPay=Math.round(BAL.pilotPay*1.06);
           S.rel.crew=clamp(S.rel.crew+22,0,100); S.streikPhase=0;
           logg("Lohnerhöhung zugesagt, die Lage beruhigt sich.","good"); }},
        {l:"Verhandeln, kleinere Zugeständnisse", d:"Halber Preis, halbe Wirkung — das Risiko bleibt.",
         f:()=>{ BAL.cabinPay=Math.round(BAL.cabinPay*1.04);
           S.rel.crew=clamp(S.rel.crew+9,0,100); S.streikPhase=0;
           S.strikeRisk=(S.strikeRisk||0)+0.10;
           logg("Teileinigung mit der Personalvertretung.",""); }},
        {l:"Ablehnen", d:"Kostet nichts — vorerst.",
         f:()=>{ S.rel.crew=clamp(S.rel.crew-8,0,100); S.strikeRisk=(S.strikeRisk||0)+0.35;
           S.streikPhase=2; logg("Forderung abgelehnt. Die Stimmung kippt.","bad"); }}
      ]});
    stopForEvent(3);
  }

  /* 5 — Behördliche Prüfung nach wiederholten Verstössen */
  if((S.curfewHits||0)>=12 && Math.random()<0.08){
    S.curfewHits=0;
    const busse=Math.round(rnd(180,520))*1000;
    mailAdd({kind:"behoerde", subj:"Aufsichtsbehörde eröffnet ein Verfahren",
      kurz:`Verstösse gegen Nachtflugverbote · ${chf(busse)}`, stufe:2,
      body:`<p>Wiederholte Starts und Landungen innerhalb der Sperrzeiten sind aktenkundig geworden. Die Behörde verhängt eine Busse von <b>${chf(busse)} CHF</b> und behält sich Auflagen vor.</p>
            <p class="dim">Die Warnhinweise im Wochenplan sind nicht nur Kosmetik.</p>`});
    S.cash-=busse; S.rel.airports=clamp(S.rel.airports-8,0,100);
    stopForEvent(2);
  }

  /* 6 — Der virale Moment */
  if(Math.random()<0.006){
    const gut=avgServiceRep()>0.2 && (S.punctuality||0.85)>0.88;
    const schlecht=avgServiceRep()<-0.2 || (S.punctuality||0.85)<0.78;
    if(gut||schlecht){
      const d=gut?rnd(2.5,5):-rnd(3,6);
      S.rep=clamp(S.rep+d,5,99);
      mailAdd({kind:gut?"chance":"stoerung", subj:gut?"Ein Video macht die Runde":"Ein Video macht die Runde",
        kurz:(gut?"+":"")+fmt(d,1)+" Ruf",
        stufe:2,
        body:gut
          ? `<p>Ein Reisender hat eine Szene an Bord gefilmt — aufmerksames Personal, pünktlicher Anschluss. Der Beitrag wird zehntausendfach geteilt.</p><p class="dim">Der Ruf steigt um ${fmt(d,1)} Punkte.</p>`
          : `<p>Ein Reisender hat eine Szene an Bord gefilmt, die niemand sehen sollte: gereiztes Personal, verspäteter Anschluss, keine Information.</p><p class="dim">Der Ruf sinkt um ${fmt(-d,1)} Punkte.</p>`});
      stopForEvent(2);
    }
  }

  /* 7 — Luftraumsperrung */
  if(Math.random()<0.0022 && !(S.blocks||[]).some(b=>b.art==="region"&&b.bis>S.clock)){
    const regionen=Array.from(new Set(S.routes.map(r=>AP[r.to]?AP[r.to].region:null).filter(Boolean)));
    if(regionen.length){
      const rg=pick(regionen), tage=Math.round(rnd(2,6));
      const grund=pick(["Vulkanasche","ein Streik der Flugsicherung","eine militärische Sperrung","ein schwerer Sturmzug"]);
      addBlock({art:"region", wert:rg, bis:S.clock+DAYMS*tage, grund:"Luftraumsperrung"});
      const betroffen=S.routes.filter(r=>AP[r.from].region===rg||AP[r.to].region===rg).length;
      mailAdd({kind:"stoerung", subj:`Luftraum über ${REGION_NAME[rg]||rg} gesperrt`,
        kurz:`${tage} Tage · ${betroffen} Strecken betroffen`, stufe:2,
        body:`<p>Wegen ${grund} ist der Luftraum für rund ${tage} Tage gesperrt. ${betroffen} Ihrer Strecken sind betroffen und fallen aus.</p>
              <p class="dim">Ein breit gestreutes Netz federt so etwas ab. Wer alles auf eine Region setzt, steht still.</p>`});
      stopForEvent(2);
    }
  }

  /* 8 — Musterstilllegung: Klumpenrisiko der Einheitsflotte */
  if(Math.random()<0.0016){
    const typen={}; aktiv.forEach(a=>typen[a.type]=(typen[a.type]||0)+1);
    const t=Object.keys(typen).sort((a,b)=>typen[b]-typen[a])[0];
    if(t && !blockActive("type",t)){
      const tage=Math.round(rnd(5,16));
      addBlock({art:"type", wert:t, bis:S.clock+DAYMS*tage, grund:"Startverbot"});
      mailAdd({kind:"behoerde", subj:`Startverbot für ${ACT[t].name}`,
        kurz:`${typen[t]} Maschinen · ${tage} Tage`, stufe:2,
        body:`<p>Nach einem Vorfall bei einer anderen Gesellschaft haben die Behörden ein weltweites Startverbot für die <b>${esc(ACT[t].name)}</b> verhängt. ${typen[t]} Ihrer Maschinen sind betroffen, voraussichtlich ${tage} Tage.</p>
              <p class="dim">Eine Einheitsflotte spart Wartung und Ausbildung — und trifft Sie an einem Tag wie diesem doppelt.</p>`});
      stopForEvent(2);
    }
  }
}
const REGION_NAME={EU:"Europa", NA:"Nordamerika", SA:"Südamerika", AF:"Afrika",
  ME:"dem Nahen Osten", AS:"Asien", OC:"Ozeanien"};

/* ============================================================== Postfach ==
   Alles, was Aufmerksamkeit verlangt, landet hier: Berichte, Warnungen und
   Entscheidungen. Ungelesenes wird am Reiter gezählt, offene Entscheidungen
   halten die Uhr an. */
const MAIL_KIND = {
  bericht:  {n:"Bericht",      ic:"▤", col:"var(--dim)"},
  betrieb:  {n:"Betrieb",      ic:"✈", col:"var(--blue)"},
  stoerung: {n:"Störung",      ic:"⚠", col:"var(--red)"},
  personal: {n:"Personal",     ic:"👥", col:"var(--amber)"},
  markt:    {n:"Wettbewerb",   ic:"⇄", col:"var(--purple)"},
  chance:   {n:"Gelegenheit",  ic:"★", col:"var(--green)"},
  behoerde: {n:"Behörde",      ic:"§", col:"var(--red)"}
};
function mailAdd(m){
  S.inbox=S.inbox||[];
  const mail=Object.assign({
    id:"M"+(S.mailSeq=(S.mailSeq||0)+1),
    t:S.clock, kind:"bericht", read:false, entschieden:null
  }, m);
  S.inbox.unshift(mail);
  if(S.inbox.length>120) S.inbox.length=120;
  return mail;
}
function mailUnread(){ return (S.inbox||[]).filter(m=>!m.read).length; }
function mailOpen(){ return (S.inbox||[]).filter(m=>m.optionen && m.entschieden==null); }
function mailDate(m){
  const d=new Date(m.t);
  return `${DAYS[(d.getUTCDay()+6)%7]} ${String(d.getUTCDate()).padStart(2,"0")}.${String(d.getUTCMonth()+1).padStart(2,"0")}. ${String(d.getUTCHours()).padStart(2,"0")}:${String(d.getUTCMinutes()).padStart(2,"0")}`;
}
/** Öffnet eine Nachricht; bei Entscheidungen mit Auswahlknöpfen. */
function mailShow(id){
  const m=(S.inbox||[]).find(x=>x.id===id); if(!m) return;
  m.read=true;
  const K=MAIL_KIND[m.kind]||MAIL_KIND.bericht;
  const offen=m.optionen && m.entschieden==null;
  modal(m.subj,
    `<div class="row" style="justify-content:space-between;margin-bottom:8px">
       <span class="pill" style="border-color:${K.col};color:${K.col}">${K.ic} ${K.n}</span>
       <span class="dim mono" style="font-size:10.5px">${mailDate(m)}</span></div>
     <div>${m.body}</div>
     ${m.frist&&offen?`<p class="dim" style="margin-top:8px">Entscheidung nötig bis ${new Date(m.frist).toLocaleDateString("de-CH")} — ohne Antwort wird die erste Möglichkeit gewählt.</p>`:""}
     ${offen?`<div id="mailopt" style="margin-top:10px">${m.optionen.map((o,i)=>
       `<div class="choice" data-i="${i}"><div><div class="t">${esc(o.l)}</div>
         <div class="d">${esc(o.d||"")}</div></div>
         ${o.kosten?`<div class="mono neg">−${chf(o.kosten)}</div>`:""}</div>`).join("")}</div>`:""}
     ${m.entschieden!=null&&m.optionen?`<div class="pill ok" style="margin-top:9px;display:inline-block">
       Entschieden: ${esc(m.optionen[m.entschieden].l)}</div>`:""}`,
    offen?[]:[{t:"Schliessen",p:true,f:()=>{$("#veil").classList.remove("on"); render();}}]);
  if(offen){
    $("#mX").style.display="none";
    $("#mailopt").onclick=e=>{
      const c=e.target.closest(".choice"); if(!c) return;
      mailDecide(m.id, +c.dataset.i);
      $("#veil").classList.remove("on"); $("#mX").style.display=""; render();
    };
  } else render();
}
function mailDecide(id, idx){
  const m=(S.inbox||[]).find(x=>x.id===id); if(!m||!m.optionen) return;
  const o=m.optionen[idx]; if(!o) return;
  m.entschieden=idx; m.read=true;
  if(o.kosten) S.cash-=o.kosten;
  try{ if(typeof o.f==="function") o.f(); else if(o.wirkung) applyEffect(o.wirkung); }catch(e){}
  logg(`${m.subj}: ${o.l}`, o.ton||"");
}
/** Wirkungen als Daten, damit Entscheidungen einen Spielstand überleben. */
function applyEffect(w){
  if(!w) return;
  if(w.cash) S.cash+=w.cash;
  if(w.rep) S.rep=clamp(S.rep+w.rep,5,99);
  if(w.crew) S.rel.crew=clamp(S.rel.crew+w.crew,0,100);
  if(w.airports) S.rel.airports=clamp(S.rel.airports+w.airports,0,100);
  if(w.partners) S.rel.partners=clamp(S.rel.partners+w.partners,0,100);
  if(w.streikRisiko) S.strikeRisk=(S.strikeRisk||0)+w.streikRisiko;
  if(w.block) addBlock(w.block);
  if(w.cancelAc) cancelToday(w.cancelAc);
}

    `<div id="lm">

        <div class="d">Eine zuvor gesicherte JSON-Datei vom Gerät wählen.</div></div><div class="mono amb">›</div></div>

     </div>`,
    [{t:"Zurück",f:mainMenu}]);
  $("#mX").style.display="none";

        return;
      }
      $("#veil").classList.remove("on");
      await cloudPull("aktuell");
    }
  };
}

              <li>Oben rechts die Uhr starten.</li>

function startDialog(){
  const suggest=["BSL","ZRH","GVA","VIE","CPH","DUB","LIS","BER","MAN","OSL","HEL","PRG","BUD",
                 "EDI","KEF","TLV","AKL","YVR","MDE","CMN","BLR","BRN","LUG"];
  const opts=suggest.filter(c=>AP[c]).map(c=>AP[c])
    .concat([...APL].sort((a,b)=>b.pax-a.pax).filter(a=>!suggest.includes(a.iata)));
  const L=Object.assign({},DEFAULT_LIVERY);
  modal("Fluggesellschaft gründen",
    `${MISC.splash?`<div class="planebox" style="padding:0;margin-bottom:10px"><img src="${esc(MISC.splash)}" style="width:100%;display:block" alt=""></div>`:""}
     <p class="dim">Mittelgrosse Flughäfen sind der bequemste Einstieg. Sehr kleine Standorte wie Bern-Belp oder Lugano sind reizvoll, aber hart: die Märkte tragen dort kaum mehr als ein Regionalflugzeug.</p>
     <label class="f">Name der Fluggesellschaft</label>
     <input type="text" id="gn" value="Helvetic Skyways" maxlength="28">
     <label class="f">Airline-Code</label><input type="text" id="gc" value="HX" maxlength="3">
     <label class="f">Flugnummern beginnen bei</label><input type="number" id="gf" value="100" min="10" max="8000">
     <label class="f">Heimatstation</label>
     <select id="gh">${opts.map(a=>`<option value="${a.iata}" ${a.iata==="BSL"?"selected":""}>${a.iata} — ${esc(a.city)} (${fmt(a.pax,2)} Mio Pax, Piste ${fmt(a.runway)} m, Sperrzeit ${curfewText(a)})</option>`).join("")}</select>
     <label class="f">Schwierigkeit</label>
     <select id="gl">${Object.entries(DIFFICULTY).map(([k,v])=>
       `<option value="${k}" ${k==="normal"?"selected":""}>${v.n} — ${v.cash} Mio Startkapital, Elastizität ${v.elasticity}</option>`).join("")}</select>
     <p class="dim" id="gld" style="font-size:11px;margin-top:4px"></p>
     <h3 class="sub">Gestaltung</h3><div id="lvEd0"></div>`,
    [{t:"Zurück",f:mainMenu},
     {t:"Betrieb aufnehmen",p:true,f:()=>{
      const name=($("#gn").value||"Airline").trim();
      const code=($("#gc").value||"XX").trim().toUpperCase().slice(0,3);
      L.code=code;
      const fs0=clamp(+$("#gf").value||100,10,8000);
      newGame({name,code,home:$("#gh").value,level:$("#gl").value,livery:L,flightStart:fs0});
      $("#veil").classList.remove("on"); $("#mX").style.display="";
      focusAirport(S.bases[0]);
      recomputeWeek(); buildDaySchedule(); render(); setSpeed(0);
      setTimeout(()=>modal("Erste Schritte",
        `<ol style="padding-left:18px;line-height:1.85">
          <li>Unter <b>Markt</b> ein Muster kaufen oder leasen. Gebrauchte Flugzeuge kommen in zwei Monaten.</li>
          <li>Unter <b>Personal</b> Cockpitcrews für genau diese Musterberechtigung ausbilden, dazu Kabinenpersonal.</li>
          <li>Unter <b>Flotte</b> den <b>Tagesplan</b> bauen: Startzeit setzen, Ziele anhängen, Rückflug zur Basis nicht vergessen. Das Band zeigt den Tag von 00 bis 27 Uhr, die schraffierten Flächen sind Nachtflugverbote.</li>
          <li>Unter <b>Netz → Marktanalyse</b> sehen Sie, wie viele Passagiere pro Tag ein Städtepaar überhaupt hergibt.</li>
          <li>Oben rechts läuft die Uhr. Mit <b>❚❚</b> anhalten, mit <b>1×</b>, <b>5×</b> und <b>20×</b> beschleunigen — oder die Leertaste drücken.</li>
        </ol>
        <p class="dim">Im Lagebild stehen die ersten vier Handgriffe. Die Simulation hält bei wichtigen Ereignissen von selbst an — und mit ▶▶ springen Sie gleich dorthin.</p>`,
        [{t:"Angehalten lassen",f:()=>$("#veil").classList.remove("on")},
         {t:"Uhr starten",p:true,f:()=>{$("#veil").classList.remove("on"); setSpeed(1);}}]),380);
    }}]);
  $("#mX").style.display="none";
  const upd=()=>{ const v=DIFFICULTY[$("#gl").value]; $("#gld").textContent=v?v.d:""; };
  $("#gl").onchange=upd; upd();
  liveryEditor($("#lvEd0"), L, ()=>{}, ()=>($("#gc").value||"XX").toUpperCase().slice(0,3));
}
